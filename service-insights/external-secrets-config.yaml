intro: '[External Secrets Operator](https://external-secrets.io) (ESO) is a Kubernetes operator that synchronizes
  secrets from external providers (AWS Secrets Manager, HashiCorp Vault, Azure Key Vault, GCP Secret Manager,
  and others) into native Kubernetes Secrets. It decouples secret lifecycle management from application
  deployment — secrets are declared as `ExternalSecret` custom resources that reference a `SecretStore`
  or `ClusterSecretStore`, and the operator continuously reconciles the desired state against the external
  provider.


  A **ClusterSecretStore** is the cluster-wide variant of ESO''s provider connection. Unlike namespace-scoped
  `SecretStore` resources, a single `ClusterSecretStore` can serve `ExternalSecret` resources in any namespace,
  eliminating the need to duplicate provider credentials across every namespace that needs secrets.


  This `external-secrets-config` service is not the operator itself — it is the **configuration layer**
  that deploys the `ClusterSecretStore` resource connecting ESO to the platform''s secrets backend. It
  exists as a separate Flux Kustomization so that the operator CRDs and controller can be fully healthy
  before any custom resources are applied.

  '
purpose: 'This service deploys a single `ClusterSecretStore` named `localstack-secretstore` that connects
  the External Secrets Operator to LocalStack''s Secrets Manager API. Every downstream service that needs
  credentials — databases, monitoring stacks, application services — declares an `ExternalSecret` that
  references this store. By gating readiness on a health check against the `ClusterSecretStore`, Flux
  guarantees that no downstream service attempts secret synchronization before the provider connection
  is verified healthy.


  Nine services depend on this configuration being reconciled and healthy before they can start: traefik-config,
  kube-prometheus-stack, loki, redis-sentinel, n8n, temporal, kagent, agentgateway, and pgadmin4.

  '
purpose_rationale: '**Why a separate Kustomization from the operator:** CRD installation and controller
  startup must complete before any CR can be applied. Splitting config from operator allows Flux''s `dependsOn`
  to enforce this ordering without relying on retry loops or apply-time errors. The operator Kustomization
  handles CRDs and the controller Deployment; this Kustomization handles the `ClusterSecretStore` CR that
  depends on those CRDs existing.


  **Why ClusterSecretStore over namespace-scoped SecretStores:** With 9+ consuming namespaces, replicating
  provider credentials into each namespace creates operational overhead and secret sprawl. A single `ClusterSecretStore`
  provides one point of configuration for the LocalStack endpoint, and any namespace can reference it
  without needing its own copy of the provider connection.


  **Why LocalStack as the secrets backend:** In a development/homelab context, LocalStack provides an
  AWS-compatible Secrets Manager API without cloud costs or external network dependencies. Secrets are
  auto-seeded via LocalStack init hooks on startup, making the cluster fully self-bootstrapping with no
  manual secret initialization required.

  '
features:
- feature: Cluster-wide secret store
  detail: Deploys a ClusterSecretStore accessible from any namespace, eliminating per-namespace provider
    credential duplication.
- feature: Health-gated readiness
  detail: Flux health check on the ClusterSecretStore resource blocks all 9 downstream services until
    the provider connection is verified healthy.
- feature: Variable substitution
  detail: Uses postBuild substituteFrom with the cluster-vars ConfigMap, allowing environment-specific
    endpoint configuration without manifest duplication.
- feature: Ordered dependency chain
  detail: Depends on both external-secrets-operator (CRDs and controller) and localstack (secrets backend
    with pre-seeded data), ensuring the store is only created when both prerequisites are operational.
- feature: Wait semantics
  detail: Configured with wait=true and 5m timeout, meaning Flux will not report this Kustomization as
    ready until the ClusterSecretStore passes its health check.
