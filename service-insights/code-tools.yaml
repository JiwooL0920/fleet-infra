- title: code-tools Pod Topology
  mermaid: "graph TD\n    subgraph ns_code_tools[\"namespace: code-tools\"]\n        subgraph pod[\"Pod:\
    \ code-tools\"]\n            init[\"initContainer: pip-install<br/>installs packages to /data/lib\"\
    ]\n            main[\"container: code-tools<br/>python3 /app/server.py\"]\n        end\n        svc[\"\
    Service: code-tools<br/>:8765\"]\n        pvc[\"PVC: code-tools-data<br/>/data\"]\n        cm[\"ConfigMap:\
    \ code-tools-server<br/>server.py\"]\n    end\n    ollama[\"Ollama (host-native)<br/>host.docker.internal\"\
    ]\n    kagent[\"kagent agents\"]\n\n    init -->|\"writes to /data/lib\"| pvc\n    main -->|\"reads\
    \ /data/lib + /data/mem0\"| pvc\n    cm -->|\"mounted at /app/server.py\"| main\n    svc -->|\"TCP\
    \ :8765\"| main\n    kagent -->|\"Streamable HTTP /mcp\"| svc\n    main -->|\"OLLAMA_HOST<br/>embeddings\
    \ + LLM\"| ollama\n"
- title: Memory Tool Flow
  mermaid: "sequenceDiagram\n    participant Agent as kagent Agent\n    participant MCP as code-tools\
    \ MCP\n    participant Mem0 as mem0 (lazy init)\n    participant FAISS as FAISS Index<br/>/data/mem0\n\
    \    participant Ollama as Ollama<br/>nomic-embed-text\n\n    Agent->>MCP: add_memory(content, user_id)\n\
    \    MCP->>Mem0: .add(content, user_id)\n    Mem0->>Ollama: embed(content)\n    Ollama-->>Mem0: vector\
    \ [768-dim]\n    Mem0->>FAISS: store(vector, metadata)\n    FAISS-->>Mem0: memory_id\n    Mem0-->>MCP:\
    \ {id, metadata}\n    MCP-->>Agent: JSON result\n\n    Agent->>MCP: search_memories(query, user_id)\n\
    \    MCP->>Mem0: .search(query, user_id)\n    Mem0->>Ollama: embed(query)\n    Ollama-->>Mem0: query\
    \ vector\n    Mem0->>FAISS: similarity_search(vector, limit)\n    FAISS-->>Mem0: ranked results\n\
    \    Mem0-->>MCP: [{memory, score}]\n    MCP-->>Agent: JSON array"
