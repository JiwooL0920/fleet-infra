intro: '[Grafana Operator](https://grafana.github.io/grafana-operator/) manages Grafana resources (dashboards,
  datasources, folders) declaratively via Kubernetes CRDs. Rather than provisioning dashboards through
  ConfigMaps, API calls, or sidecar-based file watchers, the operator continuously reconciles `GrafanaDashboard`
  custom resources into a target Grafana instance — providing drift correction, lifecycle management,
  and native GitOps integration.


  This service is the **content layer** of the dashboard-as-code pipeline. While `grafana-operator` provides
  the controller and `grafana-config` registers the target instance, `grafana-dashboards` supplies the
  actual dashboard and folder definitions from a dedicated external Git repository. Flux polls this repository
  independently, meaning dashboard authors can iterate on visualizations without touching the main infrastructure
  repo or triggering unrelated reconciliation across the platform.

  '
purpose: '`grafana-dashboards` decouples dashboard content from infrastructure lifecycle. It pulls `GrafanaDashboard`
  and `GrafanaFolder` CRDs from a separate Git repository (`JiwooL0920/grafana-dashboards`) at a 5-minute
  polling interval, deploying them into the cluster where the Grafana Operator reconciles them into the
  running Grafana instance.


  This separation means dashboard changes (new panels, updated queries, folder reorganization) flow through
  their own Git history, PR review, and deployment cycle — independent of Helm chart bumps, operator upgrades,
  or dependency chain changes in the main flux-infra repo. The result is faster iteration for observability
  content without risk to platform stability.

  '
purpose_rationale: '**Why a separate Git repository over inline manifests in flux-infra:** Dashboard
  JSON is verbose (hundreds to thousands of lines per dashboard) and changes frequently as monitoring
  needs evolve. Embedding them in the infrastructure repo would pollute its Git history with large diffs
  unrelated to infrastructure changes, trigger unnecessary Flux reconciliation of the entire services
  tree, and force dashboard authors to understand the flux-infra dependency model just to update a Prometheus
  query. A dedicated repo with its own `GitRepository` source isolates the blast radius and enables a
  tighter feedback loop — push a dashboard change, see it in Grafana within 5 minutes.

  '
features:
- feature: Dedicated GitRepository source
  detail: 'Declares its own `GitRepository` CR pointing to `ssh://git@github.com/JiwooL0920/grafana-dashboards`
    rather than sharing the `flux-system` source used by all other services. This gives dashboards an
    independent polling interval and revision tracking.

    '
- feature: High-frequency polling
  detail: 'Configured with a 5-minute `spec.interval` on both the GitRepository and Kustomization — significantly
    shorter than the 1-hour interval used by the operator and config layers. Dashboard updates propagate
    to Grafana within minutes of merge.

    '
- feature: Path-scoped Kustomization
  detail: 'The Flux Kustomization targets only `./infra` within the external repository, allowing the
    dashboard repo to contain other content (documentation, Grafonnet source, CI configs) without affecting
    what gets applied to the cluster.

    '
- feature: Prune-enabled lifecycle management
  detail: '`spec.prune: true` ensures that deleting a dashboard manifest from the Git repository removes
    the corresponding `GrafanaDashboard` CR from the cluster, which the operator then removes from Grafana.
    No orphaned dashboards accumulate over time.

    '
- feature: SSH authentication via shared secret
  detail: 'Uses the `flux-system` Secret (the same deploy key bootstrapped during Flux installation) for
    Git authentication, avoiding additional credential management for the external repository.

    '
- feature: Dependency-gated deployment
  detail: '`dependsOn: grafana-config` ensures the Grafana instance CR (with its `dashboards: grafana`
    selector label) exists before dashboard CRDs are applied. Without this gate, dashboards would fail
    to reconcile as the operator would have no target instance.

    '
architecture_diagrams:
- title: Dashboard-as-Code Deployment Pipeline
  mermaid: "graph TD\n    subgraph external[\"External Git (JiwooL0920/grafana-dashboards)\"]\n      \
    \  REPO[\"main branch<br/>path: ./infra\"]\n    end\n    subgraph flux-system\n        GR[GitRepository<br/>grafana-dashboards]\n\
    \        FK[Flux Kustomization<br/>grafana-dashboards]\n        SEC[Secret<br/>flux-system]\n    end\n\
    \    subgraph monitoring\n        GI[Grafana CR<br/>labels: dashboards=grafana]\n        GRAF[Grafana\
    \ Instance<br/>kube-prometheus-stack]\n    end\n    subgraph grafana-operator-ns[\"grafana-operator\
    \ namespace\"]\n        GO[Grafana Operator]\n    end\n    subgraph target-ns[\"target namespace(s)\"\
    ]\n        CRDs[\"GrafanaDashboard CRs<br/>GrafanaFolder CRs\"]\n    end\n\n    GR -->|\"SSH auth\"\
    | SEC\n    GR -->|\"poll every 5m\"| REPO\n    FK -->|\"sourceRef\"| GR\n    FK -->|\"applies ./infra\"\
    | CRDs\n    CRDs -->|\"instanceSelector<br/>dashboards: grafana\"| GI\n    GO -->|\"watches all namespaces\"\
    | CRDs\n    GO -->|\"reconciles into\"| GRAF\n    GI -->|\"external.url :80\"| GRAF"
operations:
- scenario: GitRepository fetch failure — SSH authentication rejected
  symptoms: '`flux get source git grafana-dashboards` shows `False` ready status with message

    `ssh: handshake failed` or `authentication required`. The Kustomization remains at a stale

    revision while the source fails to pull.

    '
  steps:
  - flux get source git grafana-dashboards -n flux-system
  - kubectl get gitrepository grafana-dashboards -n flux-system -o yaml | grep -A 10 'status:'
  - kubectl get secret flux-system -n flux-system -o jsonpath='{.data.identity}' | base64 -d | head -2
  - kubectl get events -n flux-system --field-selector involvedObject.name=grafana-dashboards --sort-by=.lastTimestamp
  - ssh -T -i /dev/stdin git@github.com <<< "$(kubectl get secret flux-system -n flux-system -o jsonpath='{.data.identity}'
    | base64 -d)" 2>&1 | head -5
  - flux reconcile source git grafana-dashboards -n flux-system
- scenario: Kustomization reconciliation timeout — invalid manifests in dashboards repo
  symptoms: '`flux get kustomization grafana-dashboards` shows `reconciliation failed` with timeout or

    validation errors like `failed to decode YAML` or `unknown field`. Source revision advances

    but Kustomization stays at the previous applied revision.

    '
  steps:
  - flux get kustomization grafana-dashboards -n flux-system
  - kubectl get kustomization grafana-dashboards -n flux-system -o jsonpath='{.status.conditions[*].message}'
  - flux get source git grafana-dashboards -n flux-system
  - kubectl get events -n flux-system --field-selector involvedObject.name=grafana-dashboards,involvedObject.kind=Kustomization
    --sort-by=.lastTimestamp
  - flux reconcile kustomization grafana-dashboards --with-source
- scenario: Dashboards not appearing in Grafana despite healthy Kustomization
  symptoms: '`flux get kustomization grafana-dashboards` shows `Applied revision` at latest commit, but

    Grafana UI shows no new dashboards. `kubectl get grafanadashboards` shows resources present

    but operator logs indicate `No matching instances found`.

    '
  steps:
  - kubectl get grafanadashboards --all-namespaces
  - kubectl get grafanadashboards --all-namespaces -o yaml | grep -A 3 instanceSelector
  - kubectl get grafana grafana -n monitoring -o jsonpath='{.metadata.labels}'
  - kubectl logs -n grafana-operator -l app.kubernetes.io/name=grafana-operator --tail=50 | grep -iE "instance|dashboard|no
    matching"
  - kubectl get grafana grafana -n monitoring -o yaml | grep -A 5 'status:'
  see_also:
  - docs/adr/012-grafana-operator-dashboard-as-code.md
- scenario: Dependency gate blocking — grafana-config not ready
  symptoms: '`flux get kustomization grafana-dashboards` shows `dependency ''flux-system/grafana-config''
    is not ready`

    and reconciliation is suspended. Dashboard source may be fetched successfully but nothing is applied.

    '
  steps:
  - flux get kustomization grafana-dashboards -n flux-system
  - flux get kustomization grafana-config -n flux-system
  - flux get kustomization grafana-operator -n flux-system
  - kubectl get grafana grafana -n monitoring
  - kubectl logs -n grafana-operator -l app.kubernetes.io/name=grafana-operator --tail=30 | grep -i "instance"
  - flux reconcile kustomization grafana-config --with-source
- scenario: Stale dashboards after repo push — source revision not advancing
  symptoms: 'A commit has been merged to main in the grafana-dashboards repo but `flux get source git
    grafana-dashboards`

    still shows the old revision after multiple polling intervals (>10 minutes). Kustomization shows

    no activity.

    '
  steps:
  - flux get source git grafana-dashboards -n flux-system
  - kubectl get gitrepository grafana-dashboards -n flux-system -o jsonpath='{.status.artifact.revision}'
  - kubectl get gitrepository grafana-dashboards -n flux-system -o jsonpath='{.status.conditions[*].message}'
  - kubectl get events -n flux-system --field-selector involvedObject.name=grafana-dashboards,involvedObject.kind=GitRepository
    --sort-by=.lastTimestamp
  - flux reconcile source git grafana-dashboards -n flux-system
  - flux get source git grafana-dashboards -n flux-system
- scenario: Pruned dashboards not removed from Grafana
  symptoms: 'A `GrafanaDashboard` manifest was deleted from the dashboards repo and the Kustomization
    shows

    it has been pruned from the cluster, but the dashboard still appears in the Grafana UI.

    Operator may be failing to delete from the Grafana API.

    '
  steps:
  - kubectl get grafanadashboards --all-namespaces
  - flux get kustomization grafana-dashboards -n flux-system
  - kubectl logs -n grafana-operator -l app.kubernetes.io/name=grafana-operator --tail=50 | grep -iE "delete|remove|prune"
  - kubectl run curl-test --rm -it --image=curlimages/curl --restart=Never -- curl -s -o /dev/null -w
    '%{http_code}' http://monitoring-kube-prometheus-stack-grafana.monitoring.svc:80/api/health
  - kubectl get grafana grafana -n monitoring -o yaml | grep -A 5 'status:'
  see_also:
  - docs/adr/012-grafana-operator-dashboard-as-code.md
