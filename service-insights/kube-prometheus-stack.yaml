intro: '[kube-prometheus-stack](https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack)
  is an opinionated Helm chart that deploys the full Prometheus monitoring pipeline in a single release:
  Prometheus server, Alertmanager, Grafana, node-exporter, kube-state-metrics, and — critically — the
  **Prometheus Operator**. The Operator is what distinguishes this from a raw Prometheus install: it introduces
  Custom Resource Definitions (ServiceMonitor, PodMonitor, PrometheusRule, AlertmanagerConfig) that let
  monitoring configuration live alongside application manifests in Git, making the entire observability
  stack declaratively managed through GitOps.


  What sets this chart apart from assembling the components individually is the pre-wired integration:
  Grafana ships with datasource auto-discovery, Alertmanager routes are configured via CRDs rather than
  hand-edited ConfigMaps, and Prometheus scrape targets are declared per-service without touching a central
  `prometheus.yml`. For a platform running dozens of services with independent release cycles, this CRD-driven
  model eliminates the central bottleneck of a shared monitoring config file.


  The chart also bundles recording rules and alerts for Kubernetes internals (kubelet, apiserver, etcd,
  scheduler), providing cluster health observability out of the box without any additional configuration
  beyond the Helm values.

  '
purpose: 'kube-prometheus-stack is the platform''s foundational observability layer. It collects metrics
  from every instrumented service, stores time-series data with configurable retention, and provides Grafana
  as the unified visualization frontend. In this cluster, it is specifically configured to monitor the
  **kagent multi-agent AI platform** — tracking agent invocation rates, per-agent latency distributions,
  token consumption against budgets, A2A delegation counts, and tool usage patterns that detect God-Agent
  drift.


  Alertmanager is wired to route critical severity alerts directly to the kagent incident webhook (`alertmanager-hook.kagent.svc.cluster.local:8080`),
  enabling the AI agent platform to self-heal or escalate based on cluster state. Grafana uses a PostgreSQL
  backend for session and dashboard storage persistence, with credentials managed entirely through ExternalSecrets
  pulling from LocalStack — no secrets in Git.

  '
purpose_rationale: '**Why kube-prometheus-stack over individual Prometheus + Grafana deploys or managed
  alternatives (e.g., Grafana Cloud, AWS Managed Prometheus):** The CRD-driven configuration model is
  essential for this GitOps platform. Each service can declare its own ServiceMonitors and AlertmanagerConfigs
  in its own directory, reviewed and merged through the normal PR workflow. Managed services would require
  a separate Terraform/API layer for configuration, breaking the single-pane-of-glass Git model. The trade-off
  is self-managed storage, retention tuning, and capacity planning — accepted because this platform needs
  full control over scrape intervals, relabeling rules, and alert routing topology that managed services
  often constrain.

  '
features:
- feature: CRD-driven alert routing
  detail: AlertmanagerConfig CRD routes critical-severity alerts to the kagent incident webhook without
    editing a global Alertmanager config file.
- feature: ExternalSecrets-managed credentials
  detail: Both Grafana admin credentials and database passwords are synced from LocalStack via ClusterSecretStore
    — no secrets committed to Git.
- feature: PostgreSQL-backed Grafana
  detail: Grafana uses an external PostgreSQL database for dashboard and session storage, with credentials
    delivered via the grafana-db-credentials ExternalSecret.
- feature: Sidecar dashboard provisioning
  detail: Grafana's sidecar container watches for ConfigMaps labeled `grafana_dashboard=1` and auto-imports
    dashboards without restart or manual upload.
- feature: Multi-datasource dashboards
  detail: The kagent telemetry dashboard queries Prometheus for metrics, Loki for log-based refusal/rejection
    events, and links to Jaeger for distributed trace exploration.
- feature: PostBuild variable substitution
  detail: Resource limits, retention settings, and storage sizes are injected at reconcile time from the
    cluster-vars ConfigMap, enabling per-environment tuning without manifest duplication.
- feature: Deployment health gating
  detail: Flux healthChecks block downstream dependents until both the Prometheus Operator and Grafana
    deployments report ready in the monitoring namespace.
architecture_diagrams:
- title: Deployment Topology and Credential Flow
  mermaid: "graph TD\n    subgraph flux-system\n        KS[Kustomization<br/>kube-prometheus-stack]\n\
    \        CV[ConfigMap<br/>cluster-vars]\n    end\n\n    subgraph monitoring\n        OP[Prometheus\
    \ Operator<br/>Deployment]\n        PROM[Prometheus Server]\n        AM[Alertmanager]\n        GRAF[Grafana<br/>Deployment]\n\
    \        SIDE[Grafana Sidecar]\n        AMCFG[AlertmanagerConfig<br/>kagent-incident-webhook]\n  \
    \      DASH[ConfigMap<br/>grafana-dashboard-kagent]\n        SEC_ADMIN[Secret<br/>grafana-admin-credentials]\n\
    \        SEC_DB[Secret<br/>grafana-db-credentials]\n    end\n\n    subgraph external-secrets\n   \
    \     ESO[ExternalSecrets Operator]\n        CSS[ClusterSecretStore<br/>localstack-secretstore]\n\
    \    end\n\n    subgraph localstack\n        LS_ADMIN[grafana/admin/credentials/*]\n        LS_DB[grafana/database/password]\n\
    \    end\n\n    subgraph kagent\n        HOOK[alertmanager-hook<br/>:8080]\n    end\n\n    KS -->|dependsOn|\
    \ ESO\n    KS -->|substituteFrom| CV\n    KS -->|healthCheck| OP\n    KS -->|healthCheck| GRAF\n\n\
    \    CSS -->|remoteRef| LS_ADMIN\n    CSS -->|remoteRef| LS_DB\n    ESO -->|syncs| SEC_ADMIN\n   \
    \ ESO -->|syncs| SEC_DB\n\n    SEC_ADMIN -->|admin-user, admin-password| GRAF\n    SEC_DB -->|password|\
    \ GRAF\n\n    AMCFG -->|configures| AM\n    AM -->|webhook :8080| HOOK\n    SIDE -->|watches label\
    \ grafana_dashboard=1| DASH\n    DASH -->|auto-imports| GRAF\n\n    OP -->|manages| PROM\n    OP -->|manages|\
    \ AM\n"
- title: Alert-to-Incident Flow
  mermaid: "sequenceDiagram\n    participant P as Prometheus\n    participant AM as Alertmanager\n   \
    \ participant AMCFG as AlertmanagerConfig CRD\n    participant HOOK as kagent alertmanager-hook\n\n\
    \    P->>AM: fires alert (severity=critical)\n    AM->>AMCFG: matches route (severity = critical)\n\
    \    AMCFG-->>AM: receiver: kagent-hook\n    AM->>HOOK: POST /webhook/alertmanager (port 8080)\n \
    \   Note over HOOK: Writes incident:events stream<br/>to Redis DB 4"
operations:
- scenario: Grafana pod CrashLoopBackOff due to missing admin credentials
  symptoms: 'Grafana pod in `CrashLoopBackOff` with logs showing `error: secret grafana-admin-credentials
    not found` or `key admin-password not found in secret`. The ExternalSecret may show `SecretSyncedError`
    status.

    '
  steps:
  - kubectl get externalsecret grafana-admin-credentials -n monitoring -o yaml | grep -A5 status
  - kubectl get secret grafana-admin-credentials -n monitoring -o jsonpath='{.data}' | base64 -d
  - kubectl get clustersecretstore localstack-secretstore -o yaml | grep -A5 status
  - kubectl logs -n external-secrets -l app.kubernetes.io/name=external-secrets --tail=50 | grep -i grafana
  - kubectl delete externalsecret grafana-admin-credentials -n monitoring && kubectl apply -k apps/base/kube-prometheus-stack
- scenario: Alertmanager not forwarding critical alerts to kagent webhook
  symptoms: 'Critical alerts visible in Alertmanager UI (`amtool alert --alertmanager.url=http://localhost:9093`)
    but kagent alertmanager-hook receives no POST requests. No entries in alertmanager-hook logs for incoming
    webhooks.

    '
  steps:
  - kubectl get alertmanagerconfig kagent-incident-webhook -n monitoring -o yaml
  - kubectl port-forward -n monitoring svc/kube-prometheus-stack-alertmanager 9093:9093 &
  - curl -s http://localhost:9093/api/v2/alerts | jq '.[].labels.severity'
  - kubectl exec -n monitoring -it $(kubectl get pod -n monitoring -l app.kubernetes.io/name=alertmanager
    -o name | head -1) -- amtool config routes show --config.file=/etc/alertmanager/config_out/alertmanager.env.yaml
  - kubectl logs -n kagent -l app=alertmanager-hook --tail=100
  - 'kubectl run curl-test --rm -it --image=curlimages/curl --restart=Never -- curl -v http://alertmanager-hook.kagent.svc.cluster.local:8080/webhook/alertmanager
    -d ''{"alerts":[{"labels":{"severity":"critical"}}]}'' -H ''Content-Type: application/json'''
- scenario: Prometheus storage exhaustion causing sample ingestion failures
  symptoms: 'PrometheusStorageExhausted or PrometheusTSDBCompactionsFailing alerts firing. Prometheus
    logs show `storage: no space left on device` or `WAL corruption`. `kubectl top pod` shows Prometheus
    near memory limit.

    '
  steps:
  - kubectl exec -n monitoring -it $(kubectl get pod -n monitoring -l app.kubernetes.io/name=prometheus
    -o name | head -1) -- df -h /prometheus
  - kubectl exec -n monitoring -it $(kubectl get pod -n monitoring -l app.kubernetes.io/name=prometheus
    -o name | head -1) -- promtool tsdb list /prometheus
  - kubectl get pvc -n monitoring -l app.kubernetes.io/name=prometheus -o custom-columns=NAME:.metadata.name,CAPACITY:.spec.resources.requests.storage,USED:.status.capacity.storage
  - kubectl exec -n monitoring -it $(kubectl get pod -n monitoring -l app.kubernetes.io/name=prometheus
    -o name | head -1) -- curl -s http://localhost:9090/api/v1/status/tsdb | jq '.data.headStats'
  - kubectl exec -n monitoring -it $(kubectl get pod -n monitoring -l app.kubernetes.io/name=prometheus
    -o name | head -1) -- curl -XPOST http://localhost:9090/-/reload
- scenario: Grafana dashboard not appearing after ConfigMap apply
  symptoms: 'ConfigMap `grafana-dashboard-kagent` exists in monitoring namespace with correct label, but
    the dashboard does not appear in Grafana''s dashboard list. No errors in Grafana UI.

    '
  steps:
  - kubectl get configmap grafana-dashboard-kagent -n monitoring --show-labels | grep grafana_dashboard
  - kubectl logs -n monitoring $(kubectl get pod -n monitoring -l app.kubernetes.io/name=grafana -o name
    | head -1) -c grafana-sc-dashboard --tail=50
  - kubectl get configmap grafana-dashboard-kagent -n monitoring -o jsonpath='{.data}' | python3 -c 'import
    sys,json; json.loads(list(json.loads(sys.stdin.read()).values())[0]); print("valid JSON")'
  - kubectl rollout restart deployment kube-prometheus-stack-grafana -n monitoring
  - kubectl wait --for=condition=available deployment/kube-prometheus-stack-grafana -n monitoring --timeout=120s
- scenario: Flux Kustomization stuck due to health check timeout
  symptoms: '`kubectl get kustomization kube-prometheus-stack -n flux-system` shows `Health check failed
    after 5m0s timeout`. Downstream services (loki, opentelemetry-collector, grafana-operator) remain
    in `dependency not ready` state.

    '
  steps:
  - kubectl get kustomization kube-prometheus-stack -n flux-system -o yaml | grep -A10 'status:'
  - kubectl get deployment kube-prometheus-stack-operator -n monitoring -o jsonpath='{.status.conditions[*].message}'
  - kubectl get deployment kube-prometheus-stack-grafana -n monitoring -o jsonpath='{.status.conditions[*].message}'
  - kubectl get pods -n monitoring -l app.kubernetes.io/managed-by=Helm --field-selector=status.phase!=Running
  - kubectl describe pod -n monitoring $(kubectl get pod -n monitoring -l app.kubernetes.io/name=kube-prometheus-stack
    -o name --field-selector=status.phase!=Running | head -1)
  - flux reconcile kustomization kube-prometheus-stack --with-source
  see_also:
  - docs/adr/001-fine-grained-service-dependencies.md
- scenario: Grafana database connection failure after secret rotation
  symptoms: 'Grafana logs show `failed to connect to database` or `pq: password authentication failed`.
    Pod is running but Grafana UI returns 502. ExternalSecret `grafana-db-credentials` shows `SecretSynced`
    but Grafana uses stale credentials from prior mount.

    '
  steps:
  - kubectl get externalsecret grafana-db-credentials -n monitoring -o jsonpath='{.status.conditions[*].message}'
  - kubectl get secret grafana-db-credentials -n monitoring -o jsonpath='{.data.password}' | base64 -d
  - kubectl logs -n monitoring $(kubectl get pod -n monitoring -l app.kubernetes.io/name=grafana -o name
    | head -1) -c grafana --tail=30 | grep -i 'database\|pq:\|connect'
  - kubectl rollout restart deployment kube-prometheus-stack-grafana -n monitoring
  - kubectl wait --for=condition=available deployment/kube-prometheus-stack-grafana -n monitoring --timeout=120s
