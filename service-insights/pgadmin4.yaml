  mermaid: "graph TD\n    subgraph flux-system[\"flux-system namespace\"]\n        HR[HelmRelease: pgadmin4]\n\
    \        REPO[HelmRepository: runix]\n        HR -->|chart source| REPO\n    end\n\n    subgraph pgadmin4-ns[\"\
    pgadmin4 namespace\"]\n        DEP[Deployment: pgadmin4]\n        SVC[Service: pgadmin4<br/>ClusterIP\
    \ :80]\n        PVC[PVC<br/>ReadWriteOnce]\n        SEC[Secret: pgadmin4-credentials]\n        ES[ExternalSecret:\
    \ pgadmin4-credentials]\n        IR[IngressRoute: pgadmin4]\n\n        DEP -->|mounts| PVC\n     \
    \   DEP -->|reads password| SEC\n        ES -->|creates| SEC\n        SVC -->|targetPort 80| DEP\n\
    \        IR -->|routes to :80| SVC\n    end\n\n    subgraph traefik-ns[\"traefik namespace\"]\n  \
    \      TFK[Traefik Ingress Controller]\n    end\n\n    subgraph ext-secrets[\"External Secrets\"]\n\
    \        CSS[ClusterSecretStore:<br/>localstack-secretstore]\n    end\n\n    TFK -->|\"Host(pgadmin.local)\"\
    | IR\n    ES -->|\"refreshInterval: 1h\"| CSS\n    HR -->|deploys into| pgadmin4-ns"
operations:
- scenario: Pod CrashLoopBackOff due to PV permission denied
  symptoms: 'Pod logs show `Permission denied: ''/var/lib/pgadmin''` or `[Errno 13]`.

    `kubectl get pods -n pgadmin4` shows CrashLoopBackOff with short restart intervals.

    Occurs after PV migration or node scheduling change.

    '
  steps:
  - kubectl logs deployment/pgadmin4 -n pgadmin4 --previous | grep -i permission
  - kubectl get pvc -n pgadmin4 -o yaml | grep -A5 'spec:'
  - 'kubectl exec -it deployment/pgadmin4 -n pgadmin4 -- id  # Should show uid=5050 gid=5050'
  - kubectl get deployment pgadmin4 -n pgadmin4 -o jsonpath='{.spec.template.spec.securityContext}'
  - 'kubectl delete pod -n pgadmin4 -l app.kubernetes.io/name=pgadmin4  # Force reschedule with correct
    fsGroup'
- scenario: ExternalSecret stuck in SecretSyncedError
  symptoms: '`kubectl get externalsecret pgadmin4-credentials -n pgadmin4` shows status `SecretSyncedError`.

    Pod fails to start with `secret pgadmin4-credentials not found` in events.

    Usually occurs before LocalStack is fully initialized or ClusterSecretStore is unhealthy.

    '
  steps:
  - kubectl get externalsecret pgadmin4-credentials -n pgadmin4 -o yaml | grep -A10 'status:'
  - kubectl get clustersecretstore localstack-secretstore -o jsonpath='{.status.conditions[*].message}'
  - kubectl get pods -n external-secrets -l app.kubernetes.io/name=external-secrets
  - kubectl logs -n external-secrets -l app.kubernetes.io/name=external-secrets --tail=50 | grep pgadmin4
  - kubectl annotate externalsecret pgadmin4-credentials -n pgadmin4 force-sync=$(date +%s) --overwrite
  see_also:
  - docs/adr/001-fine-grained-service-dependencies.md
- scenario: pgAdmin4 unable to connect to PostgreSQL cluster
  symptoms: 'pgAdmin4 UI shows "Unable to connect to server" or "connection refused" when attempting

    to browse the registered PostgreSQL server. Pod itself is Running and healthy.

    '
  steps:
  - kubectl get cluster postgresql-cluster -n cnpg-system -o jsonpath='{.status.phase}'
  - kubectl get pods -n cnpg-system -l cnpg.io/cluster=postgresql-cluster
  - kubectl exec -n pgadmin4 deployment/pgadmin4 -- python -c "import socket; socket.create_connection(('postgresql-cluster-rw.cnpg-system.svc',
    5432), timeout=5)" 2>&1
  - kubectl get networkpolicies -n cnpg-system -o wide
  - kubectl get endpoints postgresql-cluster-rw -n cnpg-system
- scenario: IngressRoute not routing traffic to pgAdmin4
  symptoms: 'Browser returns 404 or connection refused when accessing `pgadmin.local`.

    `kubectl get ingressroute pgadmin4 -n pgadmin4` exists but Traefik dashboard shows no matching route.

    '
  steps:
  - kubectl get ingressroute pgadmin4 -n pgadmin4 -o yaml
  - kubectl get svc pgadmin4 -n pgadmin4 -o jsonpath='{.spec.ports[*]}'
  - kubectl get endpoints pgadmin4 -n pgadmin4
  - kubectl logs -n traefik -l app.kubernetes.io/name=traefik --tail=30 | grep pgadmin
  - 'kubectl port-forward svc/pgadmin4 -n pgadmin4 8080:80  # Bypass ingress to confirm service works'
- scenario: pgAdmin4 login fails with valid credentials
  symptoms: 'Login page loads correctly but returns "Incorrect username or password" despite

    using the email from the HelmRelease values and the password from the secret.

    Often occurs after secret rotation or initial deployment race condition.

    '
  steps:
  - kubectl get secret pgadmin4-credentials -n pgadmin4 -o jsonpath='{.data.password}' | base64 -d
  - kubectl get secret pgadmin4-credentials -n pgadmin4 -o jsonpath='{.data.email}' | base64 -d
  - kubectl exec -n pgadmin4 deployment/pgadmin4 -- cat /pgadmin4/config_local.py 2>/dev/null || echo
    'no config_local'
  - 'kubectl delete pod -n pgadmin4 -l app.kubernetes.io/name=pgadmin4  # Force re-read of secret mount'
  - kubectl logs deployment/pgadmin4 -n pgadmin4 | grep -i 'authentication\|login\|email'
