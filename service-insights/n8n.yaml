intro: '[n8n](https://n8n.io) ([GitHub](https://github.com/n8n-io/n8n)) is a source-available workflow
  automation platform that connects arbitrary services through a visual node-based editor. Unlike fully
  managed alternatives (Zapier, Make), n8n runs self-hosted with full data sovereignty and supports custom
  JavaScript/Python code nodes, webhooks, and complex branching logic — making it suitable for infrastructure
  automation, not just SaaS integrations.


  What distinguishes n8n from other open-source alternatives (Apache Airflow, Temporal): it targets citizen-developer
  and ops workflows with a low-code UI, while still exposing a full programmable API. It handles both
  scheduled and event-triggered executions, stores workflow state and execution history in a relational
  database, and provides a built-in credential vault for third-party service authentication.

  '
purpose: 'n8n serves as the platform''s general-purpose workflow automation engine — orchestrating integrations,
  scheduled tasks, and event-driven processes that don''t warrant a full Temporal workflow definition.
  It connects to the shared PostgreSQL cluster for execution history and workflow persistence, and is
  exposed internally via Traefik for webhook-triggered automations.


  Persistence is explicitly disabled at the filesystem level; all state lives in PostgreSQL, making the
  n8n pod stateless and horizontally scalable without shared volume concerns.

  '
features:
- feature: PostgreSQL-backed stateless deployment
  detail: 'Filesystem persistence is disabled (`persistence.enabled: false`); all workflow definitions
    and execution history are stored in the shared CNPG PostgreSQL cluster, making the pod fully stateless
    and replaceable.

    '
- feature: ExternalSecret credential injection
  detail: 'Database credentials are pulled from LocalStack via `ClusterSecretStore` into a Kubernetes
    Secret (`n8n-postgres-credentials`), with the `cnpg.io/reload: "true"` label enabling automatic credential
    rotation without pod restart.

    '
- feature: Traefik IngressRoute with direct service routing
  detail: 'An IngressRoute CRD routes `Host(n8n.local)` through the `web` entrypoint directly to the n8n
    service on port 80, bypassing the Kubernetes Ingress controller abstraction for Traefik-native routing
    control.

    '
- feature: Health probes with staggered timing
  detail: 'Liveness probe starts at 60s with 10s interval (tolerates slow JIT startup); readiness probe
    starts at 30s with 5s interval (faster traffic admission once healthy). Both hit `/healthz` on the
    HTTP port.

    '
- feature: Install and upgrade remediation
  detail: 'HelmRelease configures 3 retries with 10-minute timeouts for both install and upgrade operations,
    preventing transient failures (image pull, resource quota) from leaving the release in a failed state.

    '
- feature: Environment-differentiated resource allocation
  detail: 'Resource limits and requests are injected via `postBuild.substituteFrom` from the `cluster-vars`
    ConfigMap, allowing dev and prod clusters to apply different CPU/memory profiles without manifest
    duplication.

    '
