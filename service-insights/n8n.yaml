operations:
- scenario: ExternalSecret stuck in SecretSyncedError
  symptoms: '`kubectl get externalsecret -n n8n` shows `SecretSyncedError` status. n8n pod is in `CreateContainerConfigError`
    because the `n8n-postgres-credentials` Secret does not exist. Alert: `ExternalSecretNotReady`.

    '
  steps:
  - kubectl describe externalsecret n8n-postgres-credentials -n n8n
  - kubectl get clustersecretstore localstack-secretstore -o yaml | grep -A5 status
  - kubectl logs -n external-secrets -l app.kubernetes.io/name=external-secrets --tail=50
  - kubectl get secret -n n8n n8n-postgres-credentials -o json | jq '.data | keys'
  - aws --endpoint-url=http://localstack.localstack.svc:4566 secretsmanager get-secret-value --secret-id
    cnpg/postgresql-cluster-app/host
  see_also:
  - docs/adr/004-single-shared-postgresql-cluster.md
- scenario: Pod CrashLoopBackOff — database connection refused
  symptoms: 'n8n pod logs show `ECONNREFUSED 10.x.x.x:5432` or `connection to server at ... failed: Connection
    refused`. Pod restarts with increasing backoff. Liveness probe fails after 60s initial delay.

    '
  steps:
  - kubectl logs -n n8n deployment/n8n --previous --tail=30
  - kubectl get secret n8n-postgres-credentials -n n8n -o jsonpath='{.data.POSTGRES_HOST}' | base64 -d
  - kubectl get cluster -n cnpg-system postgresql-cluster -o jsonpath='{.status.phase}'
  - kubectl get pods -n cnpg-system -l cnpg.io/cluster=postgresql-cluster
  - kubectl exec -n n8n deployment/n8n -- nc -zv $(kubectl get secret n8n-postgres-credentials -n n8n
    -o jsonpath='{.data.POSTGRES_HOST}' | base64 -d) 5432
  see_also:
  - docs/adr/004-single-shared-postgresql-cluster.md
- scenario: HelmRelease reconciliation failure — chart fetch error
  symptoms: '`kubectl get helmrelease n8n -n flux-system` shows `False` ready condition with message containing
    `failed to fetch chart`. GitRepository `n8n-helm-chart` may show `GitOperationFailed`.

    '
  steps:
  - kubectl get gitrepository n8n-helm-chart -n flux-system -o yaml | grep -A10 status
  - kubectl describe helmrelease n8n -n flux-system | tail -20
  - flux reconcile source git n8n-helm-chart
  - flux reconcile helmrelease n8n
  - kubectl get events -n flux-system --field-selector involvedObject.name=n8n --sort-by=.lastTimestamp
- scenario: n8n unreachable via ingress — IngressRoute misconfiguration
  symptoms: 'Browser returns 404 or connection reset when accessing `http://n8n.local`. Pod is running
    and healthy. `curl -H ''Host: n8n.local'' http://localhost` from inside the cluster also fails.

    '
  steps:
  - kubectl get ingressroute n8n -n n8n -o yaml
  - kubectl get svc n8n -n n8n -o wide
  - kubectl get endpoints n8n -n n8n
  - kubectl exec -n traefik deployment/traefik -- wget -qO- http://localhost:8080/api/http/routers | grep
    n8n
  - kubectl port-forward -n n8n svc/n8n 5678:5678 & curl -s http://localhost:5678/healthz
- scenario: n8n readiness probe failing after PostgreSQL failover
  symptoms: 'After a CNPG failover event, n8n pods show `0/1 Ready`. Logs contain `terminating connection
    due to administrator command` or `could not translate host name`. Readiness probe returns non-200
    on `/healthz`.

    '
  steps:
  - kubectl get cluster -n cnpg-system postgresql-cluster -o jsonpath='{.status.currentPrimary}'
  - kubectl get secret n8n-postgres-credentials -n n8n -o jsonpath='{.data.POSTGRES_HOST}' | base64 -d
  - kubectl logs -n n8n deployment/n8n --tail=20 | grep -i 'connection\|postgres\|ECONNR'
  - kubectl rollout restart deployment/n8n -n n8n
  - kubectl get pods -n n8n -w
  see_also:
  - docs/adr/004-single-shared-postgresql-cluster.md
- scenario: Flux Kustomization suspended or dependency not satisfied
  symptoms: '`flux get kustomization n8n` shows `Suspended` or `dependency ''flux-system/postgresql-cluster''
    is not ready`. No HelmRelease activity. Other services that depend on n8n are also blocked.

    '
  steps:
  - flux get kustomization n8n
  - flux get kustomization postgresql-cluster
  - flux get kustomization external-secrets-config
  - kubectl get configmap cluster-vars -n flux-system -o yaml | grep N8N
  - flux resume kustomization n8n
  - flux reconcile kustomization n8n --with-source
  see_also:
  - docs/adr/001-fine-grained-service-dependencies.md
