intro: 'The [Grafana Operator](https://grafana.github.io/grafana-operator/) ([GitHub](https://github.com/grafana/grafana-operator))
  is a Kubernetes operator that manages Grafana instances and their associated resources (dashboards,
  datasources, folders) declaratively via Custom Resources. Unlike directly configuring Grafana through
  its HTTP API or provisioning files, the operator reconciles desired state continuously — if a dashboard
  is deleted manually in the UI, the operator restores it on the next reconciliation cycle.


  The `Grafana` CRD is the operator''s entry point: it registers a Grafana instance (either operator-managed
  or externally deployed) so that other CRDs (`GrafanaDashboard`, `GrafanaDatasource`) can target it.
  The operator supports two modes — **deployment mode** (it deploys and manages the Grafana pod lifecycle)
  and **external mode** (it connects to a pre-existing Grafana instance). This service uses external mode,
  pointing the operator at a Grafana already deployed by kube-prometheus-stack.

  '
purpose: '`grafana-config` registers the platform''s existing kube-prometheus-stack Grafana instance with
  the Grafana Operator. This creates the bridge that allows downstream `GrafanaDashboard` custom resources
  to be reconciled into the running Grafana without touching its Helm values or provisioning ConfigMaps.


  Without this CR, the operator has no target instance — dashboard CRDs would have nothing to reconcile
  against. This service sits between `grafana-operator` (which provides the controller) and `grafana-dashboards`
  (which provides the dashboard definitions), acting as the instance discovery layer.

  '
purpose_rationale: '**Why external mode over operator-managed deployment:** kube-prometheus-stack already
  deploys a fully configured Grafana with authentication, persistence, and datasource wiring baked into
  its Helm chart. Re-deploying Grafana through the operator would duplicate that work and lose the tight
  integration with Prometheus/Alertmanager that the stack provides. External mode gives the operator dashboard
  management capabilities while leaving instance lifecycle to the Helm chart that already handles it well.

  '
features:
- feature: External instance registration
  detail: 'Uses `spec.external.url` to connect to the kube-prometheus-stack Grafana service at `monitoring-kube-prometheus-stack-grafana.monitoring.svc:80`,
    avoiding a duplicate Grafana deployment.

    '
- feature: Instance selector label
  detail: 'The `dashboards: grafana` label on the CR acts as a target selector — downstream `GrafanaDashboard`
    resources use `instanceSelector.matchLabels` to bind to this specific instance.

    '
- feature: Secret-based admin authentication
  detail: 'Admin credentials are sourced from the `grafana-admin-credentials` Secret via `spec.external.adminPassword`
    and `spec.external.adminUser`, keeping credentials out of the CR spec.

    '
- feature: PostBuild variable substitution
  detail: 'The Flux Kustomization injects variables from the `cluster-vars` ConfigMap at deploy time,
    enabling environment-specific overrides without duplicating manifests per cluster.

    '
architecture_diagrams:
- title: Grafana Operator Instance Registration Topology
  mermaid: "graph TD\n    subgraph flux-system\n        FK[Flux Kustomization<br>grafana-config]\n   \
    \     CV[ConfigMap<br>cluster-vars]\n    end\n    subgraph monitoring\n        GR[Grafana CR<br>labels:\
    \ dashboards=grafana]\n        GS[Service<br>monitoring-kube-prometheus-stack-grafana]\n        SEC[Secret<br>grafana-admin-credentials]\n\
    \    end\n    subgraph grafana-operator-ns[operator namespace]\n        GO[Grafana Operator]\n   \
    \ end\n    subgraph downstream\n        GD[GrafanaDashboard CRs]\n    end\n\n    FK -->|postBuild\
    \ substitute| CV\n    FK -->|deploys| GR\n    GO -->|watches/reconciles| GR\n    GR -->|external.url\
    \ :80| GS\n    GR -->|adminPassword, adminUser| SEC\n    GD -->|instanceSelector<br>dashboards: grafana|\
    \ GR"
operations:
- scenario: Grafana CR stuck in failing state — operator cannot reach external instance
  symptoms: '`kubectl get grafana grafana -n monitoring` shows status with error message like

    `Could not connect to Grafana instance` or `401 Unauthorized`.

    Operator logs show repeated reconciliation failures.

    '
  steps:
  - kubectl get grafana grafana -n monitoring -o yaml | grep -A 20 status
  - kubectl logs -n grafana-operator -l app.kubernetes.io/name=grafana-operator --tail=50
  - kubectl get svc monitoring-kube-prometheus-stack-grafana -n monitoring
  - kubectl run curl-test --rm -it --image=curlimages/curl --restart=Never -- curl -s -o /dev/null -w
    '%{http_code}' http://monitoring-kube-prometheus-stack-grafana.monitoring.svc:80/api/health
  - kubectl get secret grafana-admin-credentials -n monitoring -o jsonpath='{.data.admin-user}' | base64
    -d
  - kubectl get secret grafana-admin-credentials -n monitoring -o jsonpath='{.data.admin-password}' |
    base64 -d
- scenario: Admin credentials secret missing or malformed
  symptoms: 'Grafana Operator logs report `secret "grafana-admin-credentials" not found` or

    `key "admin-password" not found in secret`. GrafanaDashboard CRs downstream remain

    in pending state.

    '
  steps:
  - kubectl get secret grafana-admin-credentials -n monitoring
  - kubectl get secret grafana-admin-credentials -n monitoring -o jsonpath='{.data}' | jq 'keys'
  - kubectl get externalsecrets -n monitoring -l app=grafana-config
  - kubectl logs -n external-secrets -l app.kubernetes.io/name=external-secrets --tail=30 | grep grafana
- scenario: Flux Kustomization not reconciling after git push
  symptoms: '`flux get kustomization grafana-config` shows `Applied revision` stuck at an old commit hash,

    or status shows `dependency ''flux-system/grafana-operator'' is not ready`.

    '
  steps:
  - flux get kustomization grafana-config
  - flux get kustomization grafana-operator
  - kubectl get kustomization grafana-config -n flux-system -o jsonpath='{.status.conditions[*].message}'
  - flux reconcile kustomization grafana-config --with-source
- scenario: Downstream dashboards not provisioning despite healthy Grafana CR
  symptoms: '`kubectl get grafanadashboards -n monitoring` shows dashboards with `No matching instances
    found`

    or empty `instanceSelector` resolution. The Grafana UI shows no new dashboards appearing.

    '
  steps:
  - kubectl get grafana grafana -n monitoring -o jsonpath='{.metadata.labels}'
  - kubectl get grafanadashboards -n monitoring -o yaml | grep -A 3 instanceSelector
  - kubectl logs -n grafana-operator -l app.kubernetes.io/name=grafana-operator --tail=50 | grep -i "instance"
  - kubectl get grafana -n monitoring --show-labels
