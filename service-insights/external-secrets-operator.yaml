intro: '[External Secrets Operator](https://external-secrets.io) ([GitHub](https://github.com/external-secrets/external-secrets))
  is a Kubernetes operator that synchronizes secrets from external secret management systems into native
  Kubernetes `Secret` objects. Unlike alternatives that require sidecar injection (Vault Agent) or custom
  volume drivers (Secrets Store CSI), ESO operates as a reconciliation controller — it watches `ExternalSecret`
  custom resources, fetches the referenced secret data from a configured provider, and materializes it
  as a standard `Secret` that any pod can consume via `envFrom` or volume mounts.


  The operator introduces three key CRDs: `SecretStore` / `ClusterSecretStore` (provider connection configuration),
  `ExternalSecret` (declarative mapping from external path to K8s Secret), and `PushSecret` (reverse sync
  from K8s into the external provider). This CRD-based model makes secret consumption fully GitOps-compatible
  — teams declare what secrets they need without embedding credentials in manifests or Helm values.


  ESO supports a wide matrix of backends (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, HashiCorp
  Vault, 1Password, and others) through a pluggable provider architecture. The same `ExternalSecret` manifest
  can target different backends by swapping only the `SecretStore` reference, enabling environment portability
  without manifest changes.

  '
purpose: 'External Secrets Operator is the platform''s secret materialization layer. It bridges the gap
  between LocalStack''s AWS Secrets Manager emulation (the authoritative secret store for this cluster)
  and the Kubernetes `Secret` objects that application workloads actually mount. Every service that needs
  credentials — database passwords, API keys, admin tokens — declares an `ExternalSecret` that the operator
  reconciles into a native Secret, eliminating manual `kubectl create secret` operations and ensuring
  secrets regenerate automatically on cluster rebuild.


  The operator also enables the `PushSecret` flow used by services like CNPG that generate credentials
  at runtime and need to push them back into the secret store for consumption by other services.

  '
purpose_rationale: '**Why External Secrets Operator over alternatives:** The primary requirement was production
  portability — the same `ExternalSecret` manifests must work against LocalStack in development and a
  real AWS Secrets Manager in production, with only the `ClusterSecretStore` differing between environments.
  SOPS and Sealed Secrets both commit encrypted material to Git (non-portable, environment-specific keys).
  The Secrets Store CSI Driver requires sidecar injection and doesn''t support the push-secret pattern
  needed for CNPG credential propagation. ESO''s reconciliation model also means secrets self-heal on
  drift — if a Secret is accidentally deleted, the operator recreates it within the reconciliation interval.

  '
features:
- feature: ClusterSecretStore with LocalStack backend
  detail: A cluster-scoped store targeting LocalStack's Secrets Manager API at port 4566, authenticated
    via a static K8s Secret with test credentials — enabling all namespaces to reference a single provider
    without per-namespace configuration.
- feature: Explicit endpoint override for non-AWS environments
  detail: The controller is configured with AWS_SECRETSMANAGER_ENDPOINT and AWS_STS_ENDPOINT environment
    variables pointing to LocalStack's in-cluster service, with EC2 metadata and SDK config loading disabled
    to prevent accidental real-AWS calls.
- feature: CRD auto-installation
  detail: The Helm chart deploys all ESO CRDs (ExternalSecret, SecretStore, ClusterSecretStore, PushSecret)
    as part of the release, ensuring the API types exist before downstream kustomizations attempt to create
    instances.
- feature: Webhook with independent scaling
  detail: The validating/mutating webhook runs as a separate deployment with its own replica count and
    resource budget, decoupling admission latency from the main controller's reconciliation load.
- feature: Install and upgrade remediation
  detail: Both install and upgrade operations are configured with 3 retries and a 10-minute timeout, tolerating
    transient failures during LocalStack startup without manual intervention.
