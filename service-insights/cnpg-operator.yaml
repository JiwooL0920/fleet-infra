operations:
- scenario: Operator pod CrashLoopBackOff after upgrade
  symptoms: '`cnpg-operator-cloudnative-pg` deployment in `cnpg-system` shows pods in CrashLoopBackOff.

    Flux Kustomization `cnpg-operator` reports `Health check failed` and downstream services

    (`postgresql-cluster`) are blocked. Alert: `KubePodCrashLooping`.

    '
  steps:
  - kubectl -n cnpg-system logs deploy/cnpg-operator-cloudnative-pg --previous | tail -50
  - kubectl -n cnpg-system describe deploy cnpg-operator-cloudnative-pg
  - kubectl get crd clusters.postgresql.cnpg.io -o jsonpath='{.status.storedVersions}'
  - kubectl -n flux-system get helmrelease cnpg-operator -o jsonpath='{.status.conditions[*].message}'
  - '# If CRD version mismatch — force CRD update from chart:'
  - kubectl -n flux-system annotate helmrelease cnpg-operator reconcile.fluxcd.io/requestedAt=$(date +%s)
    --overwrite
- scenario: Webhook certificate not ready — admission failures
  symptoms: 'New Cluster CRs or updates to existing clusters are rejected with

    `Internal error occurred: failed calling webhook "mcluster.cnpg.io"` or

    `connection refused` to the webhook service. Operator pod itself is Running.

    '
  steps:
  - kubectl -n cnpg-system get validatingwebhookconfigurations -l app.kubernetes.io/name=cloudnative-pg
  - kubectl -n cnpg-system get secret cnpg-webhook-cert -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl
    x509 -noout -dates
  - kubectl -n cnpg-system rollout restart deploy/cnpg-operator-cloudnative-pg
  - '# Wait for webhook cert regeneration:'
  - kubectl -n cnpg-system wait --for=condition=Available deploy/cnpg-operator-cloudnative-pg --timeout=120s
  - kubectl get validatingwebhookconfigurations -l app.kubernetes.io/name=cloudnative-pg -o jsonpath='{.items[0].webhooks[0].clientConfig.caBundle}'
    | wc -c
- scenario: HelmRelease stuck in upgrade — Flux timeout
  symptoms: '`kubectl -n flux-system get helmrelease cnpg-operator` shows `upgrade retries exhausted`

    or `Helm upgrade failed: timed out waiting for the condition`. The operator deployment

    may be partially rolled out with mixed old/new pods.

    '
  steps:
  - kubectl -n flux-system describe helmrelease cnpg-operator | grep -A5 'Last Applied'
  - kubectl -n cnpg-system rollout status deploy/cnpg-operator-cloudnative-pg --timeout=30s
  - kubectl -n cnpg-system get events --sort-by='.lastTimestamp' | tail -20
  - '# If stuck on resource quota or scheduling:'
  - kubectl -n cnpg-system describe pod -l app.kubernetes.io/name=cloudnative-pg | grep -A3 'Conditions'
  - '# Force Flux to retry:'
  - kubectl -n flux-system annotate helmrelease cnpg-operator reconcile.fluxcd.io/requestedAt=$(date +%s)
    --overwrite
- scenario: Operator not reconciling managed clusters
  symptoms: 'PostgreSQL Cluster CR shows stale `.status.phase` (e.g. stuck in `Setting up primary`).

    Operator pod is Running but cluster pods are not being created or updated.

    No recent events on the Cluster resource.

    '
  steps:
  - kubectl -n cnpg-system logs deploy/cnpg-operator-cloudnative-pg --since=10m | grep -i 'error\|reconcil'
  - kubectl -n cnpg-system top pod -l app.kubernetes.io/name=cloudnative-pg
  - '# Check if operator leader election is healthy:'
  - kubectl -n cnpg-system get lease cnpg-controller-manager -o jsonpath='{.spec.holderIdentity}'
  - '# Check RBAC — operator needs cluster-wide permissions:'
  - kubectl auth can-i list clusters.postgresql.cnpg.io --as=system:serviceaccount:cnpg-system:cnpg-manager
  - '# If leader lease is stale, restart to force re-election:'
  - kubectl -n cnpg-system rollout restart deploy/cnpg-operator-cloudnative-pg
- scenario: ConfigMap substitution not applied — raw variable placeholders in resources
  symptoms: 'Operator resources show literal `${CNPG_OPERATOR_CPU_LIMIT}` strings instead of resolved
    values.

    Pods fail to schedule due to invalid resource specifications.

    '
  steps:
  - kubectl -n flux-system get configmap cluster-vars -o yaml | grep CNPG_OPERATOR
  - kubectl -n flux-system get kustomization cnpg-operator -o jsonpath='{.status.conditions[*].message}'
  - '# Verify substituteFrom reference is valid:'
  - kubectl -n flux-system get kustomization cnpg-operator -o jsonpath='{.spec.postBuild.substituteFrom}'
  - '# Force re-reconciliation of the Kustomization:'
  - kubectl -n flux-system annotate kustomization cnpg-operator reconcile.fluxcd.io/requestedAt=$(date
    +%s) --overwrite
  see_also:
  - docs/adr/004-single-shared-postgresql-cluster.md
