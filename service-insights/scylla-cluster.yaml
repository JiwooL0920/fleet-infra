- title: ScyllaDB Cluster Deployment Topology
  mermaid: "graph TD\n    subgraph flux-system[\"flux-system namespace\"]\n        KS[Kustomization: scylla-cluster]\n\
    \        HR[HelmRelease: scylla]\n        REPO[HelmRepository: scylla]\n    end\n\n    subgraph scylla-ns[\"\
    scylla namespace\"]\n        SC[ScyllaCluster CR]\n        subgraph rack1[\"rack1\"]\n           \
    \ POD[ScyllaDB Pod]\n            AGENT[Manager Agent Sidecar]\n        end\n        SVC[Service: scylla-client]\n\
    \        IR[IngressRoute: scylla-alternator]\n        NS[Namespace: scylla]\n    end\n\n    subgraph\
    \ deps[\"Dependencies\"]\n        OP[scylla-operator]\n        TC[traefik-config]\n    end\n\n   \
    \ KS -->|dependsOn| OP\n    KS -->|dependsOn| TC\n    KS -->|deploys| HR\n    HR -->|chart ref| REPO\n\
    \    HR -->|creates| SC\n    SC -->|manages| POD\n    POD --- AGENT\n    POD -->|serves :8000| SVC\n\
    \    IR -->|routes scylla.local| SVC\n    KS -->|healthCheck| SVC\n"
- title: Alternator Request Flow
  mermaid: "sequenceDiagram\n    participant Client as DynamoDB SDK Client\n    participant Traefik as\
    \ Traefik Proxy\n    participant IR as IngressRoute\n    participant SVC as scylla-client:8000\n \
    \   participant Scylla as ScyllaDB Alternator\n\n    Client->>Traefik: HTTP request to scylla.local\n\
    \    Traefik->>IR: Match Host(`scylla.local`)\n    IR->>SVC: Forward to port 8000\n    SVC->>Scylla:\
    \ Route to ScyllaDB pod\n    Scylla-->>Client: DynamoDB-compatible response"
operations:
- scenario: ScyllaCluster pods stuck in Pending — PVC not binding
  symptoms: 'Pod remains in `Pending` state. `kubectl describe pod` shows `unbound immediate PersistentVolumeClaims`.

    Flux Kustomization `scylla-cluster` reports `health check failed` on `Service/scylla-client`.

    '
  steps:
  - kubectl get pvc -n scylla
  - kubectl describe pvc -n scylla -l app.kubernetes.io/name=scylla
  - kubectl get storageclass
  - kubectl get pv | grep scylla
  - '# On Kind clusters, verify local-path-provisioner is running:'
  - kubectl get pods -n local-path-storage
  - '# If provisioner is healthy but PVC stuck, delete the PVC and let operator recreate:'
  - kubectl delete pvc -n scylla -l app.kubernetes.io/name=scylla
- scenario: ScyllaCluster CRD not found — operator dependency race
  symptoms: 'HelmRelease `scylla` shows `install retries exhausted`. Flux logs contain

    `no matches for kind "ScyllaCluster" in version "scylla.scylladb.com/v1"`.

    The `scylla-operator` Kustomization may have failed silently.

    '
  steps:
  - kubectl get kustomization scylla-operator -n flux-system
  - kubectl get crd scyllaclusters.scylla.scylladb.com
  - '# If CRD missing, force reconcile the operator first:'
  - flux reconcile kustomization scylla-operator --with-source
  - '# Wait for CRD registration, then retry cluster:'
  - kubectl wait --for=condition=Established crd/scyllaclusters.scylla.scylladb.com --timeout=120s
  - flux reconcile kustomization scylla-cluster
  see_also:
  - docs/adr/001-fine-grained-service-dependencies.md
- scenario: Alternator not responding on port 8000
  symptoms: 'Applications receive connection refused or timeout when calling `scylla.local:8000`.

    `curl -v http://scylla.local/` through Traefik returns 502 or 504.

    IngressRoute exists but service has no ready endpoints.

    '
  steps:
  - kubectl get endpoints scylla-client -n scylla
  - kubectl get pods -n scylla -l app.kubernetes.io/name=scylla -o wide
  - '# Verify Alternator is listening inside the pod:'
  - kubectl exec -n scylla -it $(kubectl get pod -n scylla -l app.kubernetes.io/name=scylla -o jsonpath='{.items[0].metadata.name}')
    -- nodetool status
  - kubectl exec -n scylla -it $(kubectl get pod -n scylla -l app.kubernetes.io/name=scylla -o jsonpath='{.items[0].metadata.name}')
    -- curl -s http://localhost:8000/
  - '# Check IngressRoute is correctly targeting the service:'
  - kubectl get ingressroute scylla-alternator -n scylla -o yaml
  - '# Verify Traefik sees the route:'
  - kubectl logs -n traefik -l app.kubernetes.io/name=traefik --tail=50 | grep scylla
- scenario: Pod OOMKilled during startup or under load
  symptoms: 'Pod restarts with `reason: OOMKilled` in `kubectl describe pod`. Events show container

    `scylla` exceeded memory limit. Node `kubectl top node` may show memory pressure.

    '
  steps:
  - kubectl get pods -n scylla -o wide
  - kubectl describe pod -n scylla -l app.kubernetes.io/name=scylla | grep -A5 'Last State'
  - kubectl top pod -n scylla
  - '# Check if developer mode is active (reduces memory requirements):'
  - kubectl get helmrelease scylla -n flux-system -o jsonpath='{.spec.values.developerMode}'
  - '# Inspect cluster-vars for memory settings:'
  - kubectl get configmap cluster-vars -n flux-system -o jsonpath='{.data.SCYLLA_MEMORY_LIMIT}'
  - '# If OOM persists in developer mode, check node available memory:'
  - kubectl describe node | grep -A5 'Allocated resources'
- scenario: Flux health check timeout — scylla-client service never becomes ready
  symptoms: '`flux get kustomization scylla-cluster` shows `Health check failed after 15m0s timeout`.

    The `scylla-client` service exists but has zero ready endpoints.

    ScyllaDB pods may be running but not joining the cluster ring.

    '
  steps:
  - flux get kustomization scylla-cluster
  - kubectl get svc scylla-client -n scylla
  - kubectl get endpoints scylla-client -n scylla
  - kubectl get scyllacluster -n scylla -o yaml
  - '# Check operator logs for reconciliation errors:'
  - kubectl logs -n scylla-operator -l app.kubernetes.io/name=scylla-operator --tail=100
  - '# Check if ScyllaDB node has joined the ring:'
  - kubectl exec -n scylla -it $(kubectl get pod -n scylla -l app.kubernetes.io/name=scylla -o jsonpath='{.items[0].metadata.name}')
    -- nodetool status
  - '# If node shows DN (Down/Normal), check scylla logs:'
  - kubectl logs -n scylla $(kubectl get pod -n scylla -l app.kubernetes.io/name=scylla -o jsonpath='{.items[0].metadata.name}')
    -c scylla --tail=200
