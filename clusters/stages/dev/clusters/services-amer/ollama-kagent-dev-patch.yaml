---
# Suspend in-cluster Ollama in dev - dev uses native Ollama via host.docker.internal
# In-cluster Ollama would be CPU-only (no GPU passthrough in Colima VM) and sits idle
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: flux-system
spec:
  suspend: true
---
# Remove ollama dependsOn from kagent in dev - Ollama is external (native Mac Metal GPU)
# kagent connects to native Ollama via OLLAMA_HOST=http://host.docker.internal:11434
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-operator
    - name: external-secrets-config
    - name: traefik
