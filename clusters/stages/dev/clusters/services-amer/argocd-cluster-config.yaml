---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd-cluster-config
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/stages/dev/clusters/services-amer/argocd-config
  prune: true
  wait: true
  dependsOn:
    - name: argocd
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false
