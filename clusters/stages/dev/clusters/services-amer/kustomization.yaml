apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - flux-system
  - ../../../../../base/services/
  - argocd-cluster-config.yaml

patchesStrategicMerge:
  - cluster-vars-patch.yaml
  - ollama-kagent-dev-patch.yaml

# Enable variable substitution for environment-specific configurations
postBuild:
  substituteFrom:
    - kind: ConfigMap
      name: cluster-vars
      optional: false

# Merge environment-specific configuration
configMapGenerator:
  - name: cluster-vars
    behavior: merge
    envs:
      - environment.env
    options:
      disableNameSuffixHash: true
    namespace: flux-system
