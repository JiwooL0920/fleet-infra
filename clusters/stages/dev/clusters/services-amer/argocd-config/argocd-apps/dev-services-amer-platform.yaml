apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-services-amer-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JiwooL0920/argocd-applications.git
    targetRevision: main
    path: clusters-services/dev-services-amer
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
    syncOptions:
      - ServerSideApply=true
