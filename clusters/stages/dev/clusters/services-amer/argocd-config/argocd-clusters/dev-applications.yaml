# Registers the dev-applications spoke cluster with Argo CD (bearer token from LocalStack via ExternalSecret).
# Run once: `make register-app-cluster` after creating the spoke cluster (creates secret in LocalStack).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-cluster-dev-applications
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: dev-applications
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
      type: Opaque
      data:
        name: dev-applications
        server: https://dev-applications-control-plane:6443
        config: |
          {
            "bearerToken": "{{ .token }}",
            "tlsClientConfig": {
              "insecure": true
            }
          }
  data:
    - secretKey: token
      remoteRef:
        key: argocd/clusters/dev-applications
        property: token
