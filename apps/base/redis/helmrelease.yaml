apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: redis
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://registry-1.docker.io/bitnamicharts

---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: redis
  namespace: flux-system 
spec:
  targetNamespace: redis
  interval: 30m
  chart:
    spec:
      chart: redis
      reconcileStrategy: Revision
      version: "${REDIS_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: redis
        namespace: flux-system
  values:
    # Enable Redis Sentinel architecture
    architecture: replication
    
    # Override default naming
    fullnameOverride: "redis"
    
    # Override image tags to use available versions
    image:
      tag: "latest"
    volumePermissions:
      image:
        tag: "latest"
    kubectl:
      image:
        tag: "latest"
    
    # RBAC configuration (required for master service tracking)
    rbac:
      create: true

    # Authentication configuration
    auth:
      enabled: true
      sentinel: true
      existingSecret: "redis-password"
      existingSecretPasswordKey: "password"

    # Redis Sentinel configuration
    sentinel:
      enabled: true
      image:
        tag: "latest"
      masterSet: "mymaster"
      downAfterMilliseconds: ${REDIS_SENTINEL_TIMEOUT}
      failoverTimeout: ${REDIS_FAILOVER_TIMEOUT}
      parallelSyncs: ${REDIS_PARALLEL_SYNCS}
      # Use same password for Sentinel as Redis data servers
      # This allows Loki to authenticate with both using the same credential
      masterService:
        enabled: true
      
    # Redis Master configuration
    master:
      count: 1
      service:
        type: ClusterIP
        ports:
          redis: 6379
      persistence:
        enabled: true
        size: "${REDIS_STORAGE_SIZE}"
      resources:
        requests:
          memory: "${REDIS_MASTER_MEMORY_REQUEST}"
          cpu: "${REDIS_MASTER_CPU_REQUEST}"
        limits:
          memory: "${REDIS_MASTER_MEMORY_LIMIT}"
          cpu: "${REDIS_MASTER_CPU_LIMIT}"
        
    # Redis Replica configuration  
    replica:
      replicaCount: ${REDIS_REPLICA_COUNT}
      podAntiAffinityPreset: hard
      # Required for master service tracking functionality
      automountServiceAccountToken: true
      service:
        type: ClusterIP
        ports:
          redis: 6379
      persistence:
        enabled: true
        size: "${REDIS_STORAGE_SIZE}"
      resources:
        requests:
          memory: "${REDIS_REPLICA_MEMORY_REQUEST}"
          cpu: "${REDIS_REPLICA_CPU_REQUEST}"
        limits:
          memory: "${REDIS_REPLICA_MEMORY_LIMIT}"
          cpu: "${REDIS_REPLICA_CPU_LIMIT}"
      autoscaling:
        enabled: true
        maxReplicas: 3
        minReplicas: 2
        targetCPU: "80" 
        targetMemory: "80" 
        
    # Metrics configuration (optional)
    metrics:
      enabled: false
      serviceMonitor:
        enabled: true
        interval: 30s