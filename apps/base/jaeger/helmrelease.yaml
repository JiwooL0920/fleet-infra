apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jaegertracing
  namespace: flux-system
spec:
  interval: 10m
  url: https://jaegertracing.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jaeger
  namespace: flux-system
spec:
  interval: 10m
  releaseName: jaeger
  targetNamespace: jaeger
  chart:
    spec:
      chart: jaeger
      version: "${JAEGER_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: jaegertracing
        namespace: flux-system
      interval: 10m
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    provisionDataStore:
      cassandra: false
      elasticsearch: false
      kafka: false

    allInOne:
      enabled: true
      replicas: 1
      extraEnv:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
      resources:
        limits:
          cpu: "${JAEGER_CPU_LIMIT}"
          memory: "${JAEGER_MEMORY_LIMIT}"
        requests:
          cpu: "${JAEGER_CPU_REQUEST}"
          memory: "${JAEGER_MEMORY_REQUEST}"

    storage:
      type: memory

    collector:
      enabled: false

    query:
      enabled: false

    agent:
      enabled: false

    spark:
      enabled: false

    esIndexCleaner:
      enabled: false

    esRollover:
      enabled: false

    esLookback:
      enabled: false

    hotrod:
      enabled: false
