---
# AgentgatewayPolicy: defense-in-depth regex guardrail on the A2A inter-agent path.
#
# SCOPE: This policy fires on INTER-AGENT traffic (coordinator → workers via agentgateway).
# It does NOT guard user input — that is handled by the Traefik forwardAuth middleware
# at apps/base/kagent/base/input-guardrail.yaml.
#
# PURPOSE: Catch compromised-agent attacks where a worker (e.g. cluster-agent) puts
# prompt-injection strings into its own response, which would land in the coordinator's
# context window and could re-route subsequent tool calls.
#
# Schema: spec.backend.ai.promptGuard.request is a list of PromptguardRequest items.
# Each item uses regex.matches (list of patterns) with action: Reject.
# Reference: kubectl get crd agentgatewaypolicies.agentgateway.dev -o json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: a2a-input-guardrail
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: a2a-input-guardrail
    app.kubernetes.io/instance: agentgateway
    app.kubernetes.io/managed-by: kustomize
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: a2a-kagent
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Reject
              matches:
                # Category: credential_leak — compromised agent exfiltrating creds
                - "(?i)bearer\\s+[A-Za-z0-9._\\-]+"
                - "(?i)(password|passwd|pwd)\\s*[=:]\\s*\\S+"
                - "(?i)api[_-]?key\\s*[=:]\\s*\\S+"
                - "ghp_[A-Za-z0-9]{36}"
                - "sk-[A-Za-z0-9]{32,}"
                - "(?i)(secret|token)\\s*[=:]\\s*['\"]?[A-Za-z0-9._\\-]{16,}"
                # Category: prompt_injection via agent response (cross-agent injection)
                - "(?i)ignore (all |the )?(previous|prior|above) (instructions|prompts|messages)"
                - "(?i)disregard (all |the )?(previous|prior|above) (instructions|prompts)"
            response:
              statusCode: 403
              message: >-
                {"schema_version":"1","agent":"agentgateway","summary":"A2A request blocked by inter-agent guardrail","severity":"error","data":{"verdict":"refuse","category":"a2a_regex_block","reason":"Possible cross-agent injection or credential exfiltration in A2A payload"},"recommended_action":"Check worker agent logs for compromise.","raw_data_truncated":false,"follow_up_agent":null}
