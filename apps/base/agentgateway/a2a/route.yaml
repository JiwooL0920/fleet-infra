---
# A2A HTTPRoute: routes /agents/* requests from agentgateway to kagent-controller.
# The kagent-controller Service is annotated with appProtocol: kgateway.dev/a2a
# via the postRenderers patch in apps/base/kagent/base/helmrelease.yaml.
#
# Path matching: /agents/<agent-name> → AgentgatewayPolicy rewrites to /
# so kagent-controller receives clean A2A requests.
#
# Reference: https://agentgateway.dev/docs/kubernetes/latest/agent/a2a/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-kagent
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /agents
      backendRefs:
        - name: kagent-controller
          namespace: kagent
          port: 8083
