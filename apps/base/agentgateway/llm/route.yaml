---
# LLM HTTPRoute: routes all LLM inference traffic to Ollama backend.
#
# Ollama serves:
#   /api/chat, /api/generate, /api/embeddings — native Ollama protocol
#   /v1/chat/completions, /v1/models — OpenAI-compatible
#
# The PathPrefix "/" catch-all on the llm listener ensures all LLM traffic
# reaches Ollama regardless of protocol variant used by agents.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-ollama
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: llm
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ollama
          namespace: ollama
          port: 11434
