---
# Gateway API resource for AgentGateway proxy
# Creates an agentgateway proxy with dedicated listeners for A2A, MCP, and LLM traffic.
# Traefik IngressRoute handles external exposure (see ingressroute.yaml).
# Routes from the kagent namespace are allowed via ReferenceGrant (see referencegrant.yaml).
#
# allowedRoutes is open to all namespaces to simplify route attachment for agent workloads.
#
# Reference: https://agentgateway.dev/docs/kubernetes/latest/setup/
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy-params
  listeners:
    - name: a2a
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
    - name: mcp
      protocol: HTTP
      port: 9090
      allowedRoutes:
        namespaces:
          from: All
    - name: llm
      protocol: HTTP
      port: 9080
      allowedRoutes:
        namespaces:
          from: All
