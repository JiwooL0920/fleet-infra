---
# AgentgatewayParameters: proxy configuration for the agentgateway-proxy Gateway.
# Sets service type to ClusterIP (Traefik handles external access via IngressRoute).
# Configures OTEL tracing to the existing opentelemetry-collector in the monitoring namespace.
#
# Sampling at 10% for dev to minimize overhead. Increase to 1.0 for debugging.
# Reference: https://agentgateway.dev/docs/kubernetes/latest/reference/api/
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway-proxy-params
  namespace: agentgateway-system
spec:
  # ClusterIP: Traefik IngressRoute handles external exposure
  service:
    spec:
      type: ClusterIP
  # OTEL tracing to existing OTel Collector in monitoring namespace
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"
    - name: OTEL_SERVICE_NAME
      value: "agentgateway-proxy"
    - name: OTEL_TRACES_SAMPLER
      value: "traceidratio"
    - name: OTEL_TRACES_SAMPLER_ARG
      value: "0.1"
