apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Active backends — services-amer cluster only (single-cluster deployment).
# To onboard additional clusters, see future-clusters.yaml.disabled for the
# pre-written backend templates and follow cluster-agent/README.md.
resources:
  - backend.yaml
  - backend-k8s-services-amer.yaml
  - backend-helm-services-amer.yaml
  - backend-grafana.yaml
  - backend-github.yaml
  - route.yaml
  - guardrail-policy.yaml
  - rate-limit-policy.yaml
