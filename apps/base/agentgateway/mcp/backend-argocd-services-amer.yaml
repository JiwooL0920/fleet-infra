---
# AgentgatewayBackend: per-cluster ArgoCD tool federation for services-amer (PLACEHOLDER).
#
# Uncomment in mcp/kustomization.yaml when the ArgoCD MCP server is deployed.
# Target name 'argocd-services-amer' will become the tool prefix:
#   argocd-services-amer_app_get
#   argocd-services-amer_app_list
#   argocd-services-amer_app_diff
#   ... etc.
#
# Expected ArgoCD MCP server: argocd-mcp-server.argocd.svc.cluster.local:8080
# Referenced by RemoteMCPServer 'argocd-federated' via route /mcp/argo.
# Also uncomment the /mcp/argo rule in mcp/route.yaml.
#
# --- UNCOMMENT ENTIRE RESOURCE WHEN ARGOCD MCP IS DEPLOYED ---
#
# apiVersion: agentgateway.dev/v1alpha1
# kind: AgentgatewayBackend
# metadata:
#   name: argocd-mcp-services-amer
#   namespace: agentgateway-system
#   labels:
#     app.kubernetes.io/name: argocd-mcp-services-amer
#     app.kubernetes.io/instance: agentgateway
#     app.kubernetes.io/managed-by: kustomize
#     cluster: services-amer
#     domain: argocd
# spec:
#   mcp:
#     targets:
#       - name: argocd-services-amer
#         static:
#           host: argocd-mcp-server.argocd.svc.cluster.local
#           port: 8080
#           protocol: StreamableHTTP
