---
# MCP HTTPRoute: routes /mcp requests from agentgateway to the federated MCP backend.
# All MCP clients connect to http://agentgateway.local/mcp to access all federated tools.
#
# Reference: https://agentgateway.dev/docs/kubernetes/latest/tutorials/mcp-federation
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-federated
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: kagent-mcp
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
