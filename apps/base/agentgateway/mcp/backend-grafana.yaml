---
# AgentgatewayBackend: Grafana MCP server for observability and monitoring queries.
# Target name 'kagent-grafana-mcp' becomes the MCP tool prefix:
#   kagent-grafana-mcp_datasources_list
#   kagent-grafana-mcp_dashboards_search
#   kagent-grafana-mcp_prometheus_query
#   ... etc.
#
# Upstream: kagent's built-in grafana-mcp subchart.
# Referenced by RemoteMCPServer via route /mcp/grafana.
#
# Graceful degradation: failureMode FailOpen allows requests to continue even if
# the Grafana MCP backend is unavailable (observability shouldn't block operations).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: grafana-mcp-backend
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: grafana-mcp-backend
    app.kubernetes.io/instance: agentgateway
    app.kubernetes.io/managed-by: kustomize
    domain: observability
spec:
  mcp:
    failureMode: FailOpen
    targets:
      - name: kagent-grafana-mcp
        static:
          host: kagent-grafana-mcp.kagent.svc.cluster.local
          port: 8000
          protocol: StreamableHTTP
