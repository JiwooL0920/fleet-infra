---
# AgentgatewayPolicy: credential-leak guardrail on the MCP tool-call path.
#
# SCOPE: This policy fires on /mcp/* traffic (agent → MCP tool servers).
# It catches credential leaks where an agent accidentally passes a secret
# (e.g. from cluster logs or ConfigMaps) as a tool argument.
#
# Only credential-leak patterns are included — skip injection/jailbreak patterns
# which are user-input concerns, not tool-call concerns.
#
# Schema: spec.backend.ai.promptGuard.request is a list of PromptguardRequest items.
# Each item uses regex.matches (list of patterns) with action: Reject.
# Reference: kubectl get crd agentgatewaypolicies.agentgateway.dev -o json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-credential-guardrail
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: mcp-credential-guardrail
    app.kubernetes.io/instance: agentgateway
    app.kubernetes.io/managed-by: kustomize
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-federated
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Reject
              matches:
                # Credential patterns — ordered by frequency
                - "(?i)bearer\\s+[A-Za-z0-9._\\-]+"
                - "(?i)(password|passwd|pwd)\\s*[=:]\\s*\\S+"
                - "(?i)api[_-]?key\\s*[=:]\\s*\\S+"
                - "ghp_[A-Za-z0-9]{36}"
                - "sk-[A-Za-z0-9]{32,}"
                - "(?i)(secret|token)\\s*[=:]\\s*['\"]?[A-Za-z0-9._\\-]{16,}"
            response:
              statusCode: 403
              message: >-
                {"schema_version":"1","agent":"agentgateway","summary":"MCP tool call blocked — credential detected in arguments","severity":"error","data":{"verdict":"refuse","category":"mcp_credential_block","reason":"Credential pattern found in MCP tool call payload"},"recommended_action":"Review agent prompt and tool output for accidental secret exfiltration.","raw_data_truncated":false,"follow_up_agent":null}
