---
# AgentGateway control plane HelmRelease
# Depends on agentgateway-crds to ensure agentgateway-specific CRDs exist first.
# Gateway API CRDs are installed separately via base/services/gateway-api-crds.yaml.
#
# AgentGateway provides:
#   - A2A (Agent-to-Agent) routing via HTTPRoute + kgateway.dev/a2a appProtocol
#   - MCP federation via AgentgatewayBackend (aggregates multiple MCP servers)
#   - Gateway API GatewayClass "agentgateway" for traffic management
#
# Reference: https://agentgateway.dev/docs/kubernetes/latest/install/helm/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  interval: 10m
  releaseName: agentgateway
  targetNamespace: agentgateway-system
  dependsOn:
    - name: agentgateway-crds
  install:
    crds: Create
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: agentgateway
      version: "${AGENTGATEWAY_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: agentgateway-oci
        namespace: flux-system
      interval: 10m
  values:
    controller:
      replicaCount: "${AGENTGATEWAY_REPLICAS}"
      resources:
        requests:
          cpu: "${AGENTGATEWAY_CPU_REQUEST}"
          memory: "${AGENTGATEWAY_MEMORY_REQUEST}"
        limits:
          cpu: "${AGENTGATEWAY_CPU_LIMIT}"
          memory: "${AGENTGATEWAY_MEMORY_LIMIT}"
      # Enable experimental Gateway API features required for agentgateway routing
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
