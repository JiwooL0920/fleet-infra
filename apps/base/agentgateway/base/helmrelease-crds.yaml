---
# Install AgentGateway CRDs first
# CRDs must be present before the main agentgateway HelmRelease is applied.
# AgentGateway CRDs include: AgentgatewayBackend, AgentgatewayPolicy, AgentgatewayParameters
# Reference: https://agentgateway.dev/docs/kubernetes/latest/install/helm/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: flux-system
spec:
  interval: 10m
  releaseName: agentgateway-crds
  targetNamespace: agentgateway-system
  install:
    crds: Create
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: agentgateway-crds
      version: "${AGENTGATEWAY_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: agentgateway-oci
        namespace: flux-system
      interval: 10m
