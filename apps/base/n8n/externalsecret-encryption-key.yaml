---
# ExternalSecret: n8n data encryption key (was previously hardcoded in helmrelease.yaml).
#
# n8n uses this key to encrypt credentials stored in the database. Rotating it invalidates
# all stored credentials. Value is generated by LocalStack init on first startup and persists.
#
# See ADR-015 for the ExternalSecrets migration pattern.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-encryption-key
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: n8n-encryption-key
    creationPolicy: Owner
  data:
    - secretKey: encryption_key  # pragma: allowlist secret
      remoteRef:
        key: n8n/credentials/encryption-key  # pragma: allowlist secret
