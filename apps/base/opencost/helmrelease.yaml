---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opencost
  namespace: flux-system
spec:
  interval: 1h
  url: https://opencost.github.io/opencost-helm-chart
---
# OpenCost: Kubernetes cost monitoring (CNCF graduated).
# MCP server is built-in and enabled by default on port 8081.
# The security-agent queries cost data via the built-in MCP server.
#
# Connects to kube-prometheus-stack Prometheus to read CPU/memory usage
# and generates cost allocation data by namespace, pod, and node.
#
# MCP server at: http://opencost.opencost.svc.cluster.local:8081
# Available MCP tools:
#   - get_allocation_costs: cost by namespace/pod/node (time window based)
#   - get_asset_costs: node, disk, load balancer costs
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
  namespace: flux-system
spec:
  driftDetection:
    mode: enabled
  interval: 10m
  releaseName: opencost
  targetNamespace: opencost
  install:
    createNamespace: true
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  chart:
    spec:
      chart: opencost
      version: "${OPENCOST_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: opencost
        namespace: flux-system
      interval: 1h
  values:
    opencost:
      # Point to kube-prometheus-stack Prometheus in the monitoring namespace
      prometheus:
        internal:
          enabled: true
          serviceName: "monitoring-kube-prometheus-prometheus"
          namespaceName: "monitoring"
          port: 9090

      # MCP server: built-in, enabled by default on port 8081
      # Provides AI agents with cost allocation and asset data
      mcp:
        enabled: true
        port: 8081

      ui:
        enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 55Mi
          limits:
            cpu: 200m
            memory: 256Mi

      exporter:
        resources:
          requests:
            cpu: "${OPENCOST_CPU_REQUEST}"
            memory: "${OPENCOST_MEMORY_REQUEST}"
          limits:
            cpu: "${OPENCOST_CPU_LIMIT}"
            memory: "${OPENCOST_MEMORY_LIMIT}"

    clusterName: "cluster.local"
