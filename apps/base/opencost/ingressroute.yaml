---
# OpenCost IngressRoute — exposes the OpenCost UI at http://opencost.local
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opencost
  namespace: opencost
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`opencost.local`)
      kind: Rule
      services:
        - name: opencost-ui
          port: 9090
