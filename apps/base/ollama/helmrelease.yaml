---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 10m
  url: https://helm.otwld.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 10m
  releaseName: ollama
  targetNamespace: ollama
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ollama
      version: "${OLLAMA_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: ollama
        namespace: flux-system
      interval: 10m
  values:
    ollama:
      # Pull models automatically at container startup
      models:
        pull:
          - "${OLLAMA_MODEL}"

    # Persistent storage to avoid re-downloading models on pod restarts
    # Models are ~2GB each; persistence is critical for usability
    persistentVolume:
      enabled: true
      size: "${OLLAMA_STORAGE_SIZE}"

    resources:
      requests:
        cpu: "${OLLAMA_CPU_REQUEST}"
        memory: "${OLLAMA_MEMORY_REQUEST}"
      limits:
        cpu: "${OLLAMA_CPU_LIMIT}"
        memory: "${OLLAMA_MEMORY_LIMIT}"

    service:
      type: ClusterIP
      port: 11434
