---
# kagent-tools IngressRoute (template — update hostname per spoke cluster)
# Exposes the kagent-tools MCP endpoint so the hub cluster can reach it via HTTPS.
# Replace the hostname placeholder with the actual spoke cluster domain before deploying.
#
# Example hostnames:
#   kagent-tools.workbench.my-cluster.example.com
#   kagent-tools.factory.my-cluster.example.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kagent-tools
  namespace: kagent-tools
  labels:
    app.kubernetes.io/name: kagent-tools
    app.kubernetes.io/instance: kagent-tools-remote
    app.kubernetes.io/managed-by: kustomize
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kagent-tools.REPLACE_WITH_CLUSTER_DOMAIN`)
      kind: Rule
      services:
        - name: kagent-tools
          port: 8084
