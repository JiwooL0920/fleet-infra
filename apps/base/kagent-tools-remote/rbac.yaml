---
# ServiceAccount for kagent-tools pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-tools
  namespace: kagent
  labels:
    app.kubernetes.io/name: kagent-tools
    app.kubernetes.io/instance: kagent-tools-remote
    app.kubernetes.io/managed-by: kustomize
---
# Read-only ClusterRole for kagent-tools to inspect cluster resources.
# Covers common workload types, Flux CRDs, and batch resources.
# No write permissions — spoke clusters are strictly read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-tools-reader
  labels:
    app.kubernetes.io/name: kagent-tools
    app.kubernetes.io/instance: kagent-tools-remote
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - services
      - endpoints
      - configmaps
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-tools-reader
  labels:
    app.kubernetes.io/name: kagent-tools
    app.kubernetes.io/instance: kagent-tools-remote
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-tools-reader
subjects:
  - kind: ServiceAccount
    name: kagent-tools
    namespace: kagent
