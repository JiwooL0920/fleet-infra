apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1m
  url: https://helm.traefik.io/traefik
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1m
  releaseName: traefik
  targetNamespace: traefik
  install:
    createNamespace: true
  chart:
    spec:
      chart: traefik
      version: "${TRAEFIK_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m
  values:
    deployment:
      replicas: ${TRAEFIK_REPLICA_COUNT}
    
    # High Availability Configuration - Pod Anti-Affinity
    # Implements hard anti-affinity to prevent single point of failure
    # Based on Kubernetes official documentation: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik
          topologyKey: kubernetes.io/hostname
    
    resources:
      requests:
        cpu: "${TRAEFIK_CPU_REQUEST}"
        memory: "${TRAEFIK_MEMORY_REQUEST}"
      limits:
        cpu: "${TRAEFIK_CPU_LIMIT}"
        memory: "${TRAEFIK_MEMORY_LIMIT}"
    
    # Enable secure dashboard with authentication
    api:
      dashboard: true
      insecure: false
    
    # Use ClusterIP service
    service:
      type: ClusterIP
    
    # Configure ports - updated for Traefik v32.1.1 schema
    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
      traefik:
        port: 9000
        expose:
          default: true
        exposedPort: 9000
    
    # Configure providers
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
    
    logs:
      access:
        enabled: true
        format: "json"
        fields:
          general:
            defaultmode: keep
          headers:
            defaultmode: drop
            names:
              User-Agent: keep
              X-Forwarded-For: keep
              X-Request-Id: keep
              Referer: keep
              Authorization: redact
              Cookie: redact
              Proxy-Authorization: redact
    
    # Global arguments
    globalArguments:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
    
    # Additional arguments for local development
    additionalArguments:
      - "--api.insecure=false"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--entrypoints.web.address=:8000"
      - "--entrypoints.websecure.address=:8443"
      - "--ping=true"
      - "--providers.kubernetesingress=true"
      - "--providers.kubernetescrd=true"
