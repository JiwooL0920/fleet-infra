apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: traefik-dashboard-credentials
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: traefik-dashboard-credentials
    creationPolicy: Owner
    template:
      data:
        # Traefik basicAuth middleware requires a single 'users' key with htpasswd format
        users: "{{ .htpasswd }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: traefik/dashboard/credentials/htpasswd
