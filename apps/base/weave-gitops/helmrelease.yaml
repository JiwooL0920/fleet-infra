# Weave GitOps Helm Repository (OCI)
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/weaveworks/charts
---
# Weave GitOps HelmRelease
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  driftDetection:
    mode: enabled
  interval: 1m
  releaseName: weave-gitops
  targetNamespace: weave-gitops
  chart:
    spec:
      chart: weave-gitops
      version: "${WEAVE_GITOPS_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Weave GitOps configuration
    # adminUser credentials migrated to ExternalSecret (ADR-016).
    # Chart's cluster-user-auth Secret now owned by ExternalSecret cluster-user-auth
    # in apps/base/weave-gitops/externalsecret.yaml.
    adminUser:
      create: false

    # Service configuration
    service:
      type: ClusterIP
      port: 9001
      annotations: {}

    # Resources
    resources:
      requests:
        cpu: "${WEAVE_GITOPS_CPU_REQUEST}"
        memory: "${WEAVE_GITOPS_MEMORY_REQUEST}"
      limits:
        cpu: "${WEAVE_GITOPS_CPU_LIMIT}"
        memory: "${WEAVE_GITOPS_MEMORY_LIMIT}"

    # Security context
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000

    # Pod security context
    podSecurityContext:
      fsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000

    # RBAC
    rbac:
      create: true
      impersonationResourceNames: ["admin"]
      additionalRules: []

    # Service account
    serviceAccount:
      create: true
      annotations: {}

    # Ingress configuration (disabled by default)
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: weave-gitops.local
          paths:
            - path: /
              pathType: Prefix
      tls: []

    # Metrics
    metrics:
      enabled: true

    # Additional environment variables
    envVars: []

    # Node selector
    nodeSelector: {}

    # Tolerations
    tolerations: []

    # Affinity
    affinity: {}
