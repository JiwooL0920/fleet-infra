apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Crossplane Configuration  
# Contains native AWS ProviderConfigs, ExternalSecrets, and test resources
resources:
  - provider-config.yaml
  - compositions
  # Test resources for LocalStack integration
  - test-bucket.yaml

# Enable variable substitution from cluster-vars ConfigMap
postBuild:
  substituteFrom:
    - kind: ConfigMap
      name: cluster-vars
      optional: false