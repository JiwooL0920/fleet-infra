---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: crossplane
  namespace: flux-system
spec:
  interval: 5m
  url: https://charts.crossplane.io/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: flux-system
spec:
  driftDetection:
    mode: enabled
  interval: 5m
  releaseName: crossplane
  targetNamespace: crossplane-system
  install:
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: crossplane
      version: "${CROSSPLANE_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: flux-system
      interval: 5m
  values:
    # Core Crossplane configuration
    replicas: 1

    # Use default image from Helm chart

    # Resources for core controller
    resourcesCrossplane:
      limits:
        cpu: "${CROSSPLANE_CPU_LIMIT}"
        memory: "${CROSSPLANE_MEMORY_LIMIT}"
      requests:
        cpu: "${CROSSPLANE_CPU_REQUEST}"
        memory: "${CROSSPLANE_MEMORY_REQUEST}"

    # RBAC Manager configuration
    rbacManager:
      deploy: true
      replicas: 1
      leaderElection: true
      resourcesRBACManager:
        limits:
          cpu: "${CROSSPLANE_CPU_LIMIT}"
          memory: "${CROSSPLANE_MEMORY_LIMIT}"
        requests:
          cpu: "${CROSSPLANE_CPU_REQUEST}"
          memory: "${CROSSPLANE_MEMORY_REQUEST}"

    # Enable webhooks for validation
    webhooks:
      enabled: true

    # Metrics configuration
    metrics:
      enabled: true

    # Feature flags and arguments
    args:
      - --enable-composition-functions
      - --enable-composition-webhook-schema-validation

    # Package cache configuration
    packageCache:
      medium: ""
      sizeLimit: 20Mi
      pvc: ""

    # Service account configuration
    serviceAccount:
      customAnnotations: {}

    # Extra environment variables for AWS integration
    extraEnvVarsCrossplane:
      AWS_REGION:
        value: "${REGION}"
      AWS_DEFAULT_REGION:
        value: "${REGION}"
      # For LocalStack integration in development
      AWS_ENDPOINT_URL:
        value: "http://localstack.localstack.svc.cluster.local:4566"

    # Node selector and tolerations if needed
    nodeSelector: {}
    tolerations: []
    affinity: {}
