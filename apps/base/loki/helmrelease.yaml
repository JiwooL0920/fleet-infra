apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: loki
      version: 6.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Global configuration for environment variables
    global:
      extraArgs:
        - '-config.expand-env=true'
        - '-log.level=info'
      extraEnv:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-password
              key: password
    
    # Loki configuration
    loki:
      # Authentication
      auth_enabled: false
      
      # Common configuration
      commonConfig:
        path_prefix: /var/loki
        replication_factor: 1
        compactor_address: 'loki'
      
      # Schema configuration
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      
      # Storage configuration  
      storage:
        type: 'filesystem'
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      
      # Use structuredConfig to properly override all cache configurations
      structuredConfig:
        # Pattern ingester configuration
        pattern_ingester:
          enabled: true
        
        # Limits configuration
        limits_config:
          retention_period: 720h  # 30 days
          reject_old_samples: true
          reject_old_samples_max_age: 168h
          max_cache_freshness_per_query: 10m
          split_queries_by_interval: 15m
          per_stream_rate_limit: 512M
          per_stream_rate_limit_burst: 1024M
          ingestion_rate_mb: 512
          ingestion_burst_size_mb: 1024
          max_streams_per_user: 10000
          max_line_size: 256000
          allow_structured_metadata: true
          volume_enabled: true
        
        # Ruler configuration for alerting
        ruler:
          enable_api: true
          storage:
            type: local
            local:
              directory: /var/loki/rules
          rule_path: /var/loki/rules-temp
        
        # Query range configuration with caching
        query_range:
          align_queries_with_step: true
          cache_results: true
          results_cache:
            redis:
              endpoint: redis.redis.svc.cluster.local:26379
              master_name: mymaster
              password: "$${REDIS_PASSWORD}"
              db: 0
              expiration: 1h
              timeout: 500ms
              pool_size: 10
              idle_timeout: 90s
              max_connection_age: 10m
        
        # Frontend configuration with caching
        frontend:
          address: 0.0.0.0
          compress_responses: true
        
        # Chunk store configuration with Redis cache
        chunk_store_config:
          chunk_cache_config:
            redis:
              endpoint: redis.redis.svc.cluster.local:26379
              master_name: mymaster
              password: "$${REDIS_PASSWORD}"
              db: 1
              expiration: 1h
              timeout: 500ms
              pool_size: 10
              idle_timeout: 90s
              max_connection_age: 10m
          write_dedupe_cache_config:
            redis:
              endpoint: redis.redis.svc.cluster.local:26379
              master_name: mymaster
              password: "$${REDIS_PASSWORD}"
              db: 2
              expiration: 10m
              timeout: 500ms
              pool_size: 5
              idle_timeout: 90s
              max_connection_age: 10m
        
        # Storage configuration with index queries cache
        storage_config:
          filesystem:
            directory: /var/loki/chunks
          tsdb_shipper:
            active_index_directory: /var/loki/tsdb-index
            cache_location: /var/loki/tsdb-cache
          index_queries_cache_config:
            redis:
              endpoint: redis.redis.svc.cluster.local:26379
              master_name: mymaster
              password: "$${REDIS_PASSWORD}"
              db: 3
              expiration: 1h
              timeout: 500ms
              pool_size: 10
              idle_timeout: 90s
              max_connection_age: 10m
    
    # Deployment mode - single binary for simplicity
    deploymentMode: SingleBinary
    
    # Single binary configuration
    singleBinary:
      replicas: 1
      
      # Extra arguments to pass to the single binary
      extraArgs:
        - '-config.expand-env=true'
        - '-log.level=info'
      
      # Environment variables for Redis password
      extraEnv:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-password
              key: password
      
      # Resource limits
      resources:
        limits:
          memory: "1Gi"
          cpu: "500m"
        requests:
          memory: "512Mi"
          cpu: "250m"
      
      # Persistence for logs
      persistence:
        enabled: true
        storageClass: "standard"
        size: 10Gi
      
      # Service configuration
      service:
        type: ClusterIP
        port: 3100
    
    # Zero out replica counts of other deployment modes (required for SingleBinary)
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    
    # Monitoring configuration
    monitoring:
      serviceMonitor:
        enabled: true
        namespace: monitoring
        interval: 30s
    
    # Test configuration
    test:
      enabled: false
    
    # Lokicanary (health check) configuration  
    lokiCanary:
      enabled: false
    
    # Gateway configuration (not needed for single binary)
    gateway:
      enabled: false
    
    # Disable cache components for dev environment
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    
    # Disable memcached components
    memcached:
      enabled: false
    memcachedExporter:
      enabled: false
    memcachedChunks:
      enabled: false
    memcachedFrontend:
      enabled: false
    memcachedIndexQueries:
      enabled: false