apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: loki
      version: 6.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Loki configuration
    loki:
      # Authentication
      auth_enabled: false
      
      # Storage configuration
      commonConfig:
        replication_factor: 1
      
      # Schema configuration
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      
      # Storage configuration
      storage:
        type: 'filesystem'
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      
      # Limits configuration
      limits_config:
        retention_period: 30d
        enforce_metric_name: false
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        per_stream_rate_limit: 512M
        per_stream_rate_limit_burst: 1024M
        ingestion_rate_mb: 512
        ingestion_burst_size_mb: 1024
        max_streams_per_user: 10000
        max_line_size: 256000
    
    # Deployment mode - single binary for simplicity
    deploymentMode: SingleBinary
    
    # Single binary configuration
    singleBinary:
      replicas: 1
      
      # Resource limits
      resources:
        limits:
          memory: "2Gi"
          cpu: "1000m"
        requests:
          memory: "1Gi"
          cpu: "500m"
      
      # Persistence for logs
      persistence:
        enabled: true
        storageClass: "standard"
        size: 20Gi
      
      # Service configuration
      service:
        type: ClusterIP
        port: 3100
    
    # Zero out replica counts of other deployment modes (required for SingleBinary)
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    
    # Monitoring configuration
    monitoring:
      serviceMonitor:
        enabled: true
        namespace: monitoring
        interval: 30s
    
    # Test configuration
    test:
      enabled: false
    
    # Lokicanary (health check) configuration  
    lokiCanary:
      enabled: false
    
    # Gateway configuration (not needed for single binary)
    gateway:
      enabled: false