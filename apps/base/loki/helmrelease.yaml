apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: loki
      version: ${LOKI_CHART_VERSION}
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Deployment mode - SingleBinary for local dev simplicity
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      commonConfig:
        path_prefix: /var/loki
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: 'filesystem'
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

      limits_config:
        retention_period: ${LOKI_RETENTION_PERIOD}
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        per_stream_rate_limit: 512M
        per_stream_rate_limit_burst: 1024M
        ingestion_rate_mb: 512
        ingestion_burst_size_mb: 1024
        max_streams_per_user: 10000
        max_line_size: 256000

    # SingleBinary configuration
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: "standard"
        size: ${LOKI_STORAGE_SIZE}
      resources:
        limits:
          cpu: "1000m"
          memory: "2Gi"
        requests:
          cpu: "500m"
          memory: "1Gi"

    # Gateway configuration
    gateway:
      enabled: true
      replicas: 1

    # Disable all scalable components for SingleBinary mode
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0

    # Disable MinIO
    minio:
      enabled: false

    # Monitoring configuration
    monitoring:
      serviceMonitor:
        enabled: true
        namespace: monitoring
        interval: 30s

    # Test configuration
    test:
      enabled: false

    lokiCanary:
      enabled: false

    # Disable cache components
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false

    # Disable memcached components
    memcached:
      enabled: false
    memcachedExporter:
      enabled: false
    memcachedChunks:
      enabled: false
    memcachedFrontend:
      enabled: false
    memcachedIndexQueries:
      enabled: false
