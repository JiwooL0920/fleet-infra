---
# Secret Initialization Job - Runs in Wave 1 to prepare secrets for all services
# This replaces the manual init-*-secrets.sh scripts with an automated solution
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-init-script
  namespace: default
data:
  init-secrets.sh: |
    #!/bin/bash
    set -e
    
    echo "🔐 Initializing infrastructure secrets in LocalStack..."
    
    # Wait for LocalStack to be ready
    echo "⏳ Waiting for LocalStack to be ready..."
    until curl -s http://localstack.localstack.svc.cluster.local:4566/_localstack/health | grep -q '"secretsmanager".*"running\|available"'; do
        echo "Waiting for LocalStack Secrets Manager..."
        sleep 5
    done
    echo "✅ LocalStack is ready!"
    
    # Function to create or update secret
    create_secret() {
        local name="$1"
        local value="$2"
        local description="$3"
        
        echo "📝 Creating/updating secret: $name"
        aws --endpoint-url=http://localstack.localstack.svc.cluster.local:4566 \
            secretsmanager create-secret \
            --name "$name" \
            --description "$description" \
            --secret-string "$value" \
            --region us-east-1 \
            --no-cli-pager 2>/dev/null || \
        aws --endpoint-url=http://localstack.localstack.svc.cluster.local:4566 \
            secretsmanager update-secret \
            --secret-id "$name" \
            --secret-string "$value" \
            --region us-east-1 \
            --no-cli-pager
    }
    
    # Generate secure credentials using simple approaches
    CROSSPLANE_ACCESS_KEY="localstack-access-key-$(date +%s)"
    CROSSPLANE_SECRET_KEY=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
    REDIS_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
    PGADMIN_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
    GRAFANA_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
    TRAEFIK_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
    
    # Create all infrastructure secrets
    create_secret "crossplane/aws" \
        "{\"access_key_id\":\"$CROSSPLANE_ACCESS_KEY\",\"secret_access_key\":\"$CROSSPLANE_SECRET_KEY\"}" \
        "AWS credentials for Crossplane LocalStack integration"
    
    create_secret "redis/credentials/password" \
        "$REDIS_PASSWORD" \
        "Redis authentication password"
    
    create_secret "pgadmin4/credentials/email" \
        "admin@example.com" \
        "pgAdmin4 default email"
    
    create_secret "pgadmin4/credentials/password" \
        "$PGADMIN_PASSWORD" \
        "pgAdmin4 default password"
    
    create_secret "grafana/admin/credentials/username" \
        "admin" \
        "Grafana admin username"
    
    create_secret "grafana/admin/credentials/password" \
        "$GRAFANA_PASSWORD" \
        "Grafana admin password"
    
    create_secret "traefik/dashboard/credentials/username" \
        "admin" \
        "Traefik dashboard username"
    
    create_secret "traefik/dashboard/credentials/password" \
        "$TRAEFIK_PASSWORD" \
        "Traefik dashboard password"
    
    # Generate htpasswd format for Traefik Basic Auth using Python's crypt
    # This works with Python available in aws-cli image
    TRAEFIK_HTPASSWD=$(python3 -c "
import crypt
import secrets
import string

password = '$TRAEFIK_PASSWORD'
salt = ''.join(secrets.choice(string.ascii_letters + string.digits + './') for _ in range(8))
hash = crypt.crypt(password, '\$1\$' + salt + '\$')
print('admin:' + hash)
    ")
    create_secret "traefik/dashboard/credentials/htpasswd" \
        "$TRAEFIK_HTPASSWD" \
        "Traefik dashboard htpasswd for Basic Auth"
    
    echo "✅ All infrastructure secrets created successfully!"
    echo "🔄 External Secrets Operator will automatically sync these to Kubernetes."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-initializer
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-10"
spec:
  ttlSecondsAfterFinished: 300  # Clean up job after 5 minutes
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: secret-init
        image: amazon/aws-cli:2.15.17
        command: ["/bin/bash"]
        args: ["/scripts/init-secrets.sh"]
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY  
          value: "test"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: script-volume
        configMap:
          name: secret-init-script
          defaultMode: 0755