apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: flux-system
spec:
  driftDetection:
    mode: enabled
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: promtail
      version: "${PROMTAIL_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Promtail configuration
    config:
      # Loki client configuration
      clients:
        - url: http://monitoring-loki:3100/loki/api/v1/push
          tenant_id: fake

      # Server configuration
      serverPort: 3101

      # Positions file to track log reading progress
      positions:
        filename: /run/promtail/positions.yaml

      snippets:
        scrapeConfigs: |
          - job_name: kubernetes-pods
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: pod-logs
                  __path__: /var/log/pods/*/*/*.log
            pipeline_stages:
              - cri: {}
              # Extract namespace, pod, container from the actual file path.
              # `filename` holds the resolved path, e.g.:
              #   /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
              # relabel_configs would only see the glob pattern, not each file.
              - regex:
                  source: filename
                  expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_[a-z0-9-]{36}/(?P<container>[^/]+)/.*'
              - labels:
                  namespace:
                  pod:
                  container:
              - labeldrop:
                  - filename

    # DaemonSet on all nodes so every node's logs are collected.
    # An init container raises fs.inotify.max_user_instances to prevent
    # "too many open files" with high pod counts.
    daemonset:
      enabled: true

    deployment:
      enabled: false

    # Run on all nodes including control-plane
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Increase inotify limit before Promtail starts (chart-native mechanism)
    initContainer:
      - name: init-inotify
        image: docker.io/busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - sysctl -w fs.inotify.max_user_instances=8192
        securityContext:
          privileged: true

    # Pod configuration
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3101"

    # Resource limits
    resources:
      limits:
        cpu: "${PROMTAIL_CPU_LIMIT}"
        memory: "${PROMTAIL_MEMORY_LIMIT}"
      requests:
        cpu: "${PROMTAIL_CPU_REQUEST}"
        memory: "${PROMTAIL_MEMORY_REQUEST}"

    # Service Account
    serviceAccount:
      create: true
      name: promtail

    rbac:
      create: true
      pspEnabled: false

    # Security context for the main container
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # Volume mounts for log collection
    defaultVolumes:
      - name: run
        emptyDir: {}
      - name: pods
        hostPath:
          path: /var/log/pods

    defaultVolumeMounts:
      - name: run
        mountPath: /run/promtail
      - name: pods
        mountPath: /var/log/pods
        readOnly: true

    extraVolumes: []
    extraVolumeMounts: []

    # Service Monitor for Prometheus scraping
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      labels:
        prometheus: kube-prometheus
