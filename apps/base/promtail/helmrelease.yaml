apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: promtail
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: promtail
      version: "${PROMTAIL_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Promtail configuration
    config:
      # Loki client configuration
      clients:
        - url: http://monitoring-loki:3100/loki/api/v1/push
          tenant_id: fake
      
      # Server configuration
      serverPort: 3101
      
      # Positions file to track log reading progress
      positions:
        filename: /run/promtail/positions.yaml
      
      # Scrape configurations
      snippets:
        # Disable automatic pod discovery to reduce file descriptor usage
        scrapeConfigs: false
        
        # Add simple manual scrape config for specific log files only
        extraScrapeConfigs: |
          - job_name: system
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: varlogs
                  __path__: /var/log/*log
    
    # DaemonSet configuration
    # Reduce to single replica for local dev to minimize file descriptors
    daemonset:
      enabled: false
    
    # Use Deployment instead with single replica
    deployment:
      enabled: true
      replicaCount: 1
      autoscaling:
        enabled: false
    
    # Pod configuration
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3101"
    
    # Resource limits
    resources:
      limits:
        cpu: "${PROMTAIL_CPU_LIMIT}"
        memory: "${PROMTAIL_MEMORY_LIMIT}"
      requests:
        cpu: "${PROMTAIL_CPU_REQUEST}"
        memory: "${PROMTAIL_MEMORY_REQUEST}"
    
    # Service Account
    serviceAccount:
      create: true
      name: promtail
    
    # RBAC configuration
    rbac:
      create: true
      pspEnabled: false
    
    # Security context
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    
    # Volume mounts for log collection
    # Simplified for local dev - only monitor pod logs
    defaultVolumes:
      - name: run
        emptyDir: {}
      - name: pods
        hostPath:
          path: /var/log/pods
    
    defaultVolumeMounts:
      - name: run
        mountPath: /run/promtail
      - name: pods
        mountPath: /var/log/pods
        readOnly: true
    
    # Extra volumes for systemd journal (if needed)
    extraVolumes:
      - name: journal
        hostPath:
          path: /var/log/journal
    
    extraVolumeMounts:
      - name: journal
        mountPath: /var/log/journal
        readOnly: true
    
    # Tolerations to run on all nodes
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
    
    # Service Monitor for Prometheus scraping
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      labels:
        prometheus: kube-prometheus
    
    # Enable extra scrape configs for systemd logs
    extraScrapeConfigs:
      - job_name: journal
        journal:
          path: /var/log/journal
          max_age: 12h
          labels:
            job: systemd-journal
        relabel_configs:
          - source_labels: ['__journal__systemd_unit']
            target_label: 'unit'
          - source_labels: ['__journal__hostname']
            target_label: 'hostname'
        pipeline_stages:
          - labeldrop:
              - filename
              - stream