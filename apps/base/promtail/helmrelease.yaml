apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: promtail
      version: "${PROMTAIL_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Promtail configuration
    config:
      # Loki client configuration
      clients:
        - url: http://monitoring-loki:3100/loki/api/v1/push
          tenant_id: fake

      # Server configuration
      serverPort: 3101

      # Positions file to track log reading progress
      positions:
        filename: /run/promtail/positions.yaml

      # Minimal scrape configuration - NO kubernetes service discovery
      snippets:
        # Completely disable default scrape configs
        scrapeConfigs: |
          - job_name: static-pods
            static_configs:
              - targets:
                  - localhost
                labels:
                  job: pod-logs
                  __path__: /var/log/pods/*/*/*.log
            pipeline_stages:
              - cri: {}
              - labeldrop:
                  - filename

    # Use Deployment mode with single replica on control-plane
    # DaemonSet causes "too many open files" on worker nodes with many pods
    daemonset:
      enabled: false

    # Enable Deployment mode
    deployment:
      enabled: true
      replicaCount: 1
      autoscaling:
        enabled: false

    # Schedule on control-plane node (fewer pods = fewer file descriptors)
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""

    # Tolerate control-plane taint
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Pod configuration
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3101"

    # Resource limits
    resources:
      limits:
        cpu: "${PROMTAIL_CPU_LIMIT}"
        memory: "${PROMTAIL_MEMORY_LIMIT}"
      requests:
        cpu: "${PROMTAIL_CPU_REQUEST}"
        memory: "${PROMTAIL_MEMORY_REQUEST}"

    # Service Account
    serviceAccount:
      create: true
      name: promtail

    # RBAC configuration - minimal permissions since no k8s API calls
    rbac:
      create: true
      pspEnabled: false

    # Security context
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # Volume mounts for log collection - ONLY pod logs
    defaultVolumes:
      - name: run
        emptyDir: {}
      - name: pods
        hostPath:
          path: /var/log/pods

    defaultVolumeMounts:
      - name: run
        mountPath: /run/promtail
      - name: pods
        mountPath: /var/log/pods
        readOnly: true

    # No extra volumes
    extraVolumes: []
    extraVolumeMounts: []

    # Service Monitor for Prometheus scraping
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      labels:
        prometheus: kube-prometheus
