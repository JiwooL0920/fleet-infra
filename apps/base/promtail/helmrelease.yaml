apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: promtail
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: promtail
      version: "${PROMTAIL_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Promtail configuration
    config:
      # Loki client configuration
      clients:
        - url: http://monitoring-loki:3100/loki/api/v1/push
          tenant_id: fake
      
      # Server configuration
      serverPort: 3101
      
      # Positions file to track log reading progress
      positions:
        filename: /run/promtail/positions.yaml
      
      # Scrape configurations - minimal config to avoid file descriptor issues
      snippets:
        # Use minimal pod logs scraping only
        scrapeConfigs: |
          - job_name: kubernetes-pods
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # Only scrape pods with specific annotation to limit scope
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              - source_labels: [__meta_kubernetes_pod_container_name]
                target_label: container
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - replacement: /var/log/pods/*$1/*.log
                separator: /
                source_labels:
                  - __meta_kubernetes_pod_uid
                  - __meta_kubernetes_pod_container_name
                target_label: __path__
    
    # DaemonSet configuration - use DaemonSet for proper log collection
    daemonset:
      enabled: true
    
    # Disable Deployment mode
    deployment:
      enabled: false
    
    # Pod configuration
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3101"
    
    # Resource limits
    resources:
      limits:
        cpu: "${PROMTAIL_CPU_LIMIT}"
        memory: "${PROMTAIL_MEMORY_LIMIT}"
      requests:
        cpu: "${PROMTAIL_CPU_REQUEST}"
        memory: "${PROMTAIL_MEMORY_REQUEST}"
    
    # Service Account
    serviceAccount:
      create: true
      name: promtail
    
    # RBAC configuration
    rbac:
      create: true
      pspEnabled: false
    
    # Security context
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    
    # Volume mounts for log collection
    # Only mount what's necessary
    defaultVolumes:
      - name: run
        emptyDir: {}
      - name: pods
        hostPath:
          path: /var/log/pods
    
    defaultVolumeMounts:
      - name: run
        mountPath: /run/promtail
      - name: pods
        mountPath: /var/log/pods
        readOnly: true
    
    # Remove extra volumes to reduce file descriptor usage
    extraVolumes: []
    extraVolumeMounts: []
    
    # Tolerations to run on all nodes
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
    
    # Service Monitor for Prometheus scraping
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      labels:
        prometheus: kube-prometheus