apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  driftDetection:
    mode: enabled
  releaseName: keda
  targetNamespace: keda
  interval: 10m
  chart:
    spec:
      chart: keda
      version: 2.16.1
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    operator:
      replicaCount: 1
    resources:
      operator:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    metricsServer:
      replicaCount: 1
