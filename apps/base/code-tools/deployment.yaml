---
# code-tools: FastMCP server providing code execution, HTTP, and memory tools to kagent.
#
# Startup sequence:
#   initContainer (pip-install):  Installs Python packages to /data/lib.
#     First startup ~2-3 min; subsequent restarts are fast (packages cached on PVC).
#   main container (code-tools):  Runs server.py with PYTHONPATH=/data/lib.
#
# Security: runs as non-root (UID 1000). execute_python runs code in a subprocess —
#   acceptable for homelab; do not expose the MCP endpoint outside the cluster.
#
# Memory: mem0 FAISS index stored at /data/mem0 (PVC, survives pod restarts).
#   nomic-embed-text model pulled on first memory operation; requires Ollama.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-tools
  namespace: code-tools
  labels:
    app.kubernetes.io/name: code-tools
    app.kubernetes.io/instance: code-tools
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-tools
        app.kubernetes.io/instance: code-tools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: pip-install
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Installing code-tools Python dependencies to /data/lib..."
              pip install --no-cache-dir --target /data/lib \
                "mcp>=1.0.0" \
                httpx \
                "mem0ai[vector-stores,llms]"
              echo "pip install complete."
          securityContext:
            runAsNonRoot: false   # pip needs to write to /data/lib as root, fsGroup handles ownership
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      containers:
        - name: code-tools
          image: python:3.12-slim
          command: ["python3", "/app/server.py"]
          env:
            - name: PYTHONPATH
              value: "/data/lib"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OLLAMA_HOST
              value: "${OLLAMA_HOST}"
            - name: OLLAMA_MODEL
              value: "${CODE_TOOLS_OLLAMA_MODEL}"
            - name: EMBED_MODEL
              value: "${CODE_TOOLS_EMBED_MODEL}"
            - name: MEM0_DATA_DIR
              value: "/data/mem0"
            - name: SERVER_PORT
              value: "8765"
          ports:
            - name: mcp
              containerPort: 8765
              protocol: TCP
          volumeMounts:
            - name: server-script
              mountPath: /app/server.py
              subPath: server.py
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "${CODE_TOOLS_CPU_REQUEST}"
              memory: "${CODE_TOOLS_MEMORY_REQUEST}"
            limits:
              cpu: "${CODE_TOOLS_CPU_LIMIT}"
              memory: "${CODE_TOOLS_MEMORY_LIMIT}"
          readinessProbe:
            tcpSocket:
              port: 8765
            # Generous initial delay: init container pip-install may run on first start
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 8765
            # Allow up to 5 min for first-time pip install (30 * 10s)
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: server-script
          configMap:
            name: code-tools-server
            defaultMode: 0755
        - name: data
          persistentVolumeClaim:
            claimName: code-tools-data
