---
# kagent Database
# PostgreSQL database with pgvector extension for agent memory (RAG/embeddings)
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kagent
  namespace: cnpg-system
spec:
  name: kagent
  owner: app
  cluster:
    name: postgresql-cluster
  extensions:
    - name: vector
      ensure: present
