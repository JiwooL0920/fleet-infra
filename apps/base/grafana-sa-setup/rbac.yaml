---
# ServiceAccount for the grafana-sa-setup Job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa-setup
  namespace: monitoring
---
# Role to read the Grafana admin credentials Secret and reset admin password
# via grafana-cli in the Grafana pod (needed when LocalStack regenerates the
# password on a fresh pod restart — Grafana's persistent DB otherwise keeps
# the old value, causing 401 on all subsequent auth attempts).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-sa-setup
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-admin-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-sa-setup
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: grafana-sa-setup
    namespace: monitoring
roleRef:
  kind: Role
  name: grafana-sa-setup
  apiGroup: rbac.authorization.k8s.io
