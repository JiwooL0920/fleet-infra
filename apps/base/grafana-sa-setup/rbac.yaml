---
# ServiceAccount for the grafana-sa-setup Job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa-setup
  namespace: monitoring
---
# Role to read the Grafana admin credentials Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-sa-setup
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-admin-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-sa-setup
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: grafana-sa-setup
    namespace: monitoring
roleRef:
  kind: Role
  name: grafana-sa-setup
  apiGroup: rbac.authorization.k8s.io
