---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-image-gc
  namespace: node-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-image-gc
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-image-gc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-image-gc
subjects:
  - kind: ServiceAccount
    name: node-image-gc
    namespace: node-maintenance
