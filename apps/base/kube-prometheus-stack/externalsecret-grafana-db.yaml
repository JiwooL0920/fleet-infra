---
# ExternalSecret to sync the PostgreSQL app password from LocalStack
# into the monitoring namespace for Grafana's database backend.
#
# Source of truth: postgresql-cluster-app Secret in cnpg-system, which is
# CNPG-generated and lives on the PostgreSQL cluster PVC. That Secret is
# push-synced into LocalStack by PushSecret/push-cnpg-app-secret
# (apps/base/cloudnative-pg/push-secret.yaml) at key
# cnpg/postgresql-cluster-app/password. We pull the same key here so the
# Grafana DB credential is *always* the actual PG app password — no manual
# bootstrap step, no drift possible when LocalStack loses persistence
# (colima restart) or when the CNPG cluster is recreated. See ADR-020.
#
# This is the same pattern used by n8n-postgres-credentials (apps/base/n8n/
# externalsecret.yaml) and kagent-postgres-credentials (apps/base/kagent/
# base/externalsecret.yaml) — kept intentionally consistent.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: cnpg/postgresql-cluster-app/password
