---
# ExternalSecret to sync the PostgreSQL app password from LocalStack
# into the monitoring namespace for Grafana's database backend.
#
# The password is stored in LocalStack by: make setup-grafana-db
# This follows the same "secret zero" bootstrap pattern as GitHub PAT.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: grafana/database/password
