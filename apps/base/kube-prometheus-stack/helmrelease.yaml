apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1m
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  driftDetection:
    mode: enabled
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "${PROMETHEUS_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        # Storage configuration
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "standard"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: "${PROMETHEUS_STORAGE_SIZE}"

        # Resource limits
        resources:
          limits:
            memory: "${PROMETHEUS_MEMORY_LIMIT}"
            cpu: "${PROMETHEUS_CPU_LIMIT}"
          requests:
            memory: "${PROMETHEUS_MEMORY_REQUEST}"
            cpu: "${PROMETHEUS_CPU_REQUEST}"

        # Retention policy
        retention: "${PROMETHEUS_RETENTION_TIME}"
        retentionSize: "${PROMETHEUS_RETENTION_SIZE}"

        # Scrape Mac host GPU exporter (runs on host.docker.internal:9101)
        additionalScrapeConfigs:
          - job_name: 'mac-gpu-exporter'
            static_configs:
              - targets: ['host.docker.internal:9101']
                labels:
                  instance: 'mac-host'
            scrape_interval: 5s

    # Grafana configuration
    grafana:
      enabled: true
      admin:
        existingSecret: "grafana-admin-credentials"
        userKey: "admin-user"
        passwordKey: "admin-password"

      # Service configuration
      service:
        type: ClusterIP
        port: 80

      # Resource limits
      resources:
        limits:
          memory: "${GRAFANA_MEMORY_LIMIT}"
          cpu: "${GRAFANA_CPU_LIMIT}"
        requests:
          memory: "${GRAFANA_MEMORY_REQUEST}"
          cpu: "${GRAFANA_CPU_REQUEST}"

      # PostgreSQL database backend (replaces default SQLite)
      # Password synced from LocalStack via ExternalSecret grafana-db-credentials,
      # which sources cnpg/postgresql-cluster-app/password (push-synced from the
      # CNPG-generated postgresql-cluster-app Secret — see ADR-020).
      env:
        GF_DATABASE_TYPE: postgres
        GF_DATABASE_HOST: postgresql-cluster-rw.cnpg-system:5432
        GF_DATABASE_NAME: grafana
        GF_DATABASE_USER: app
        GF_DATABASE_SSL_MODE: disable
      envValueFrom:
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-db-credentials
            key: password

      # Persistence disabled — state is in PostgreSQL
      persistence:
        enabled: false

      # Dashboard sidecar: auto-imports ConfigMaps with grafana_dashboard="1" label.
      # Watches all namespaces so monitoring, kagent, etc. can contribute dashboards.
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"

      # Additional datasources
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://monitoring-loki-gateway.monitoring.svc.cluster.local:80
          jsonData:
            maxLines: 1000
        - name: Jaeger
          type: jaeger
          access: proxy
          url: http://jaeger-query.jaeger.svc.cluster.local:16686
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: '-1h'
              spanEndTimeShift: '1h'
              filterByTraceID: true
              filterBySpanID: true
            tracesToMetrics:
              datasourceUid: prometheus
              spanStartTimeShift: '-1h'
              spanEndTimeShift: '1h'
            nodeGraph:
              enabled: true


    # AlertManager configuration
    alertmanager:
      alertmanagerSpec:
        # Storage configuration
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: "standard"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

        # Resource limits
        resources:
          limits:
            memory: "${ALERTMANAGER_MEMORY_LIMIT}"
            cpu: "200m"
          requests:
            memory: "${ALERTMANAGER_MEMORY_REQUEST}"
            cpu: "50m"

    # Node Exporter configuration
    nodeExporter:
      enabled: true

    # Kube State Metrics configuration
    kubeStateMetrics:
      enabled: true
