apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1m
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "${PROMETHEUS_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        # Storage configuration
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "standard"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: "${PROMETHEUS_STORAGE_SIZE}"
        
        # Resource limits
        resources:
          limits:
            memory: "${PROMETHEUS_MEMORY_LIMIT}"
            cpu: "${PROMETHEUS_CPU_LIMIT}"
          requests:
            memory: "${PROMETHEUS_MEMORY_REQUEST}"
            cpu: "${PROMETHEUS_CPU_REQUEST}"
        
        # Retention policy
        retention: "${PROMETHEUS_RETENTION_TIME}"
        retentionSize: "${PROMETHEUS_RETENTION_SIZE}"
    
    # Grafana configuration
    grafana:
      enabled: true
      admin:
        existingSecret: "grafana-admin-credentials"
        userKey: "admin-user"
        passwordKey: "admin-password"
      
      # Service configuration
      service:
        type: ClusterIP
        port: 80
      
      # Resource limits
      resources:
        limits:
          memory: "${GRAFANA_MEMORY_LIMIT}"
          cpu: "${GRAFANA_CPU_LIMIT}"
        requests:
          memory: "${GRAFANA_MEMORY_REQUEST}"
          cpu: "${GRAFANA_CPU_REQUEST}"
      
      # Persistence
      persistence:
        enabled: true
        storageClassName: "standard"
        size: 5Gi
      
      # Additional datasources
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://monitoring-loki:3100
          jsonData:
            maxLines: 1000
      
    
    # AlertManager configuration
    alertmanager:
      alertmanagerSpec:
        # Storage configuration
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: "standard"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        
        # Resource limits
        resources:
          limits:
            memory: "${ALERTMANAGER_MEMORY_LIMIT}"
            cpu: "200m"
          requests:
            memory: "${ALERTMANAGER_MEMORY_REQUEST}"
            cpu: "50m"
    
    # Node Exporter configuration
    nodeExporter:
      enabled: true
    
    # Kube State Metrics configuration
    kubeStateMetrics:
      enabled: true
