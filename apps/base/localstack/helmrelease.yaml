apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: localstack
  namespace: flux-system
spec:
  interval: 1m
  url: https://localstack.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: localstack
  namespace: flux-system
spec:
  targetNamespace: localstack
  interval: 1m
  chart:
    spec:
      chart: localstack
      version: "${LOCALSTACK_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: localstack
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # avoid localstack-localstack
    fullnameOverride: "localstack"

    # Pin to stable v3.x community edition (latest pulled nightly dev build requiring Pro license)
    image:
      tag: "3.8.1"

    # Minimal LocalStack configuration
    debug: true

    # Enable basic services
    services: "s3,sm,dynamodb,sqs,sns,lambda"

    # Service configuration
    service:
      type: ClusterIP
      port: 4566

    # Resource limits (important for Kubernetes stability)
    resources:
      limits:
        memory: "${LOCALSTACK_MEMORY_LIMIT}"
        cpu: "${LOCALSTACK_CPU_LIMIT}"
      requests:
        memory: "${LOCALSTACK_MEMORY_REQUEST}"
        cpu: "${LOCALSTACK_CPU_REQUEST}"

    # Proper probe configuration format for LocalStack chart
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

    # Persist LocalStack state across pod restarts
    persistence:
      enabled: true
      size: 1Gi

    # Enable persistence mode in LocalStack runtime.
    # GITHUB_PAT is injected from the github-pat-bootstrap Secret (optional).
    # Create this Secret once during cluster bootstrap:
    #   make setup-github-secret
    # The startup script below reads it and creates github/mcp/token in LocalStack.
    extraEnvVars:
      - name: PERSISTENCE
        value: "1"
      - name: GITHUB_PAT
        valueFrom:
          secretKeyRef:
            name: github-pat-bootstrap
            key: token
            optional: true

    # Auto-initialize secrets when LocalStack becomes ready
    # Scripts in ready.d/ run after all services are confirmed healthy
    enableStartupScripts: true
    startupScriptContent: |
      #!/bin/bash
      set -euo pipefail

      echo "=== LocalStack Secret Initialization ==="

      # Create secret only if it doesn't already exist (idempotent with persistence)
      create_secret() {
          local name="$1"
          local value="$2"
          local description="$3"

          if awslocal secretsmanager get-secret-value \
              --secret-id "$name" \
              --region us-east-1 >/dev/null 2>&1; then
              echo "[SKIP] Already exists: $name"
              return 0
          fi

          echo "[CREATE] $name"
          awslocal secretsmanager create-secret \
              --name "$name" \
              --description "$description" \
              --secret-string "$value" \
              --region us-east-1 >/dev/null
      }

      # Generate secure random credentials
      gen_password() { head -c 32 /dev/urandom | base64 | tr -d '\n/+='; }

      REDIS_PWD=$(gen_password)
      PGADMIN_PWD=$(gen_password)
      GRAFANA_PWD=$(gen_password)
      TRAEFIK_PWD=$(gen_password)
      XP_ACCESS_KEY="localstack-access-key-$(date +%s)"
      XP_SECRET_KEY=$(gen_password)

      # Crossplane AWS credentials
      create_secret "crossplane/aws" \
          "{\"access_key_id\":\"$XP_ACCESS_KEY\",\"secret_access_key\":\"$XP_SECRET_KEY\"}" \
          "AWS credentials for Crossplane"

      # Redis
      create_secret "redis/credentials/password" \
          "$REDIS_PWD" \
          "Redis authentication password"

      # pgAdmin4
      create_secret "pgadmin4/credentials/email" \
          "admin@example.com" \
          "pgAdmin4 admin email"
      create_secret "pgadmin4/credentials/password" \
          "$PGADMIN_PWD" \
          "pgAdmin4 admin password"

      # n8n data encryption key (used to encrypt credentials stored in DB).
      # Rotating this invalidates all stored credentials. See ADR-015.
      create_secret "n8n/credentials/encryption-key" \
          "$(gen_password)" \
          "n8n data encryption key"

      # Weave GitOps emergency user (cluster-user-auth Secret).
      # Chart's adminUser.create=true currently generates this; ADR-016 migrates ownership
      # to ExternalSecrets. Pre-computed bcrypt cost 10 hash of password "admin" used
      # because the LocalStack container does not include htpasswd/apr-util or python-bcrypt.
      # This is acceptable for dev-only convention; the credentials are never used in prod.
      # To rotate: htpasswd -bnBC 10 "" "<new-password>" | tr -d ':\n' | sed 's/$2y/$2a/'
      # and replace both cleartext and passwordHash below.
      create_secret "weave-gitops/admin/credentials" \
          '{"username":"admin","passwordHash":"$$2a$$10$$MGOa6jAkrdZyrZP2r9GoBOYxVPz2VjPPdRd9d0i/WINe65BWhyD1e","cleartext":"admin"}' \
          "Weave GitOps admin credentials (bcrypt-hashed passwordHash + cleartext for local dev)"

      # Grafana
      create_secret "grafana/admin/credentials/username" \
          "admin" \
          "Grafana admin username"
      create_secret "grafana/admin/credentials/password" \
          "$GRAFANA_PWD" \
          "Grafana admin password"

      # Traefik
      create_secret "traefik/dashboard/credentials/username" \
          "admin" \
          "Traefik dashboard username"
      create_secret "traefik/dashboard/credentials/password" \
          "$TRAEFIK_PWD" \
          "Traefik dashboard password"

      # Traefik htpasswd (Basic Auth) - use openssl for proper apr1 hash
      HTPASSWD="admin:$(openssl passwd -apr1 "$TRAEFIK_PWD")"
      create_secret "traefik/dashboard/credentials/htpasswd" \
          "$HTPASSWD" \
          "Traefik dashboard htpasswd"

      # Grafana database password (for PostgreSQL backend)
      create_secret "grafana/database/password" \
          "$(gen_password)" \
          "Grafana PostgreSQL database password"

      # kagent Grafana SA token (populated by grafana-sa-setup Job after Grafana is healthy)
      create_secret "kagent/grafana/api-key" \
          "placeholder-run-grafana-sa-setup" \
          "Grafana SA token for kagent mcp-grafana (auto-populated by grafana-sa-setup Job)"

      # GitHub PAT for gitops-agent GitHub MCP server.
      # Injected from the github-pat-bootstrap K8s Secret via GITHUB_PAT env var.
      # Create the bootstrap secret once: make setup-github-secret
      if [[ -n "$${GITHUB_PAT:-}" ]]; then
          create_secret "github/mcp/token" \
              "{\"GITHUB_PERSONAL_ACCESS_TOKEN\":\"$$GITHUB_PAT\"}" \
              "GitHub PAT for gitops-agent GitHub MCP server"
      else
          echo "[SKIP] github/mcp/token — GITHUB_PAT env var not set"
          echo "       Create the bootstrap secret and restart LocalStack: make setup-github-secret"
      fi

      create_secret "kagent/ollama/api-key" \
          "{\"api-key\":\"ollama-no-auth-required\"}" \
          "Ollama API key placeholder (Ollama does not require auth; satisfies kagent OpenAI provider schema)"

      echo "=== Secret initialization complete ==="
