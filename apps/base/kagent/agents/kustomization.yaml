apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Safety gate — handles ambiguous queries from Traefik fast-path sniffer.
  # Fast-path unambiguous infra queries bypass this and go direct to coordinator.
  # See apps/base/kagent/base/input-guardrail.yaml for the Traefik two-tier fast-path.
  - coordinator-agent.yaml
  # Active cluster agents
  - cluster-agent/services-amer
  # Future cluster agents — uncomment when overlay is activated (see cluster-agent/README.md)
  # - cluster-agent/platform-amer
  # - cluster-agent/platform-emea
  # - cluster-agent/edge-amer
  # - cluster-agent/edge-emea
  - observability-agent.yaml   # fleet-only — cross-cluster aggregations
  - git-agent.yaml
  - finops-agent.yaml
  - code-agent.yaml            # code execution + HTTP + persistent memory (mem0 + FAISS)
  # Deleted agents (capabilities folded into cluster-agent):
  # - k8s-agent.yaml            # DELETED — k8s tools now in cluster-agent-{cluster}
  # - flux-agent.yaml           # DELETED — Flux CRD tools now in cluster-agent-{cluster}
  # - helm-agent.yaml           # DELETED — helm tools now in cluster-agent-{cluster}
  # - security-agent.yaml       # DISABLED — re-enable when security scanning is re-introduced
