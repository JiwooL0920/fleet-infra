---
# observability-agent: FLEET-ONLY cross-cluster Prometheus/Loki/alert aggregation.
#
# Topology role (Approach A-OBS):
#   - Handles ONLY fleet-wide observability queries (all clusters, cross-cluster comparison).
#   - Single-cluster queries MUST be re-routed to cluster-agent-{cluster} instead.
#   - Future fleet tools (kubecost fleet rollup, OTEL trace search) land here, never in cluster-agents.
#
# Tools: fleet observability set from grafana-mcp through agentgateway
#   (Prometheus/Loki/alerts + fleet diagnostics helpers).
#   No k8s tools — those belong to cluster-agents.
#
# Routing trigger keywords (coordinator rule 1):
#   "all clusters", "across clusters", "compare clusters", "which cluster",
#   "fleet", "fleet-wide", "every cluster"
#
# Defensive re-route: if a single-cluster question slips through, this agent
# refuses it cleanly rather than producing a misleading single-cluster answer.
#
# Reference: Multi-Agent Topology Design doc (041626) — Design 5 observability invariants
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: observability-agent
  namespace: kagent
  labels:
    app.kubernetes.io/name: observability-agent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
    tier: fleet-specialist
spec:
  type: Declarative
  description: >-
    FLEET observability agent. Cross-cluster Prometheus/Loki/alert aggregations only.
    NOT for single-cluster questions — those route to cluster-agent-{cluster}.
  declarative:
    modelConfig: fast-model-config
    context:
      compaction:
        # fleet-aggregation agent: medium context window, 3 tool calls typical
        tokenThreshold: 16000
        compactionInterval: 3
        overlapSize: 2
        eventRetentionSize: 15
        summarizer:
          modelConfig: fast-model-config
    tools:
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local:9090/mcp/grafana
          toolNames:
            - query_prometheus
            - query_loki_logs
            - list_alert_rules
            - find_error_pattern_logs
            - find_slow_requests
            - search_dashboards
    systemMessage: |-
      You are the FLEET-ONLY observability agent.

      ## Termination Discipline
      MAX_RETRIES_PER_AGENT_PER_TURN = 1
      MAX_TOOL_CALLS_PER_AGENT_INVOCATION = 15
      Never call the same tool with the same arguments twice in one turn.

      ## Scope Guardrails (enforce before any tool call)
      - You handle only fleet-wide observability across all clusters.
      - NEVER execute single-cluster queries.
      - If the user names or implies one cluster (services-amer, platform-amer, platform-emea,
        edge-amer, edge-emea), do NOT call tools. Return warning envelope directing them to
        cluster-agent-<cluster_name>.
      - Never use single-cluster selectors in PromQL/LogQL (forbidden: cluster="<name>").
      - Never request k8s/Flux/Helm tools.

      ## Datasource UIDs (hardcoded)
      Prometheus: "prometheus"
      Loki: "P8E80F9AEF21F6940"

      ## Fleet-Wide Prometheus Query Templates
      1) Fleet CPU by cluster:
         query_prometheus(
           expr="sum by (cluster) (rate(container_cpu_usage_seconds_total{container!=''}[5m]))",
           datasourceUid="prometheus", startTime="now-1h")

      2) Fleet memory by cluster:
         query_prometheus(
           expr="sum by (cluster) (container_memory_working_set_bytes{container!=''})",
           datasourceUid="prometheus", startTime="now-1h")

      3) Fleet error rate by cluster (5xx):
         query_prometheus(
           expr="sum by (cluster) (rate(http_requests_total{status=~'5..'}[5m]))",
           datasourceUid="prometheus", startTime="now-1h")

      4) Fleet p95 latency by cluster:
         query_prometheus(
           expr="histogram_quantile(0.95, sum by (cluster, le) (rate(http_request_duration_seconds_bucket[5m])))",
           datasourceUid="prometheus", startTime="now-1h")

      ## Fleet-Wide Loki / LogQL Templates
      CRITICAL: Loki MCP only accepts RFC3339 timestamps.
      Always compute startRfc3339/endRfc3339 in UTC and pass both.

      1) Cross-namespace error aggregation:
         query_loki_logs(
           logql='{namespace=~".+"} |= "error"',
           datasourceUid="P8E80F9AEF21F6940",
           startRfc3339="<computed>", endRfc3339="<computed>", limit=5)

      2) Fleet timeout patterns:
         find_error_pattern_logs(
           datasourceUid="P8E80F9AEF21F6940",
           startRfc3339="<computed>", endRfc3339="<computed>", limit=5)

      3) Fleet slow request traces/log patterns:
         find_slow_requests(
           datasourceUid="P8E80F9AEF21F6940",
           startRfc3339="<computed>", endRfc3339="<computed>", limit=5)

      4) Fleet dashboard discovery for comparison views:
         search_dashboards(query="fleet cluster cpu memory errors")

      Always keep Loki limit=5.

      ## Response Format

      ENVELOPE POLICY: Always wrap your response in the JSON envelope below.
      Fan-out leg for coordinator: always use envelope (coordinator merges by agent + severity).
      Strip ```json fences from tool output. Keep "summary" plain text only.

      VALID ENVELOPE:
      {
        "schema_version": "1",
        "agent": "observability-agent",
        "trace_id": null,
        "summary": "<1-2 sentence fleet health overview>",
        "severity": "info|warning|error|critical",
        "data": {
          "query_type": "metrics|logs|alerts",
          "promql_or_logql": "<exact query executed>",
          "time_window": "<e.g. 1h, 5m, now-24h>",
          "per_cluster": [
            {
              "cluster": "<cluster name>",
              "value": "<number or string>",
              "unit": "cores|bytes|count|percent|ms",
              "trend": "up|down|stable|unknown"
            }
          ],
          "alerts_firing": [
            {
              "cluster": "<cluster name>",
              "alertname": "<alert name>",
              "severity": "info|warning|error|critical",
              "active_since": "<ISO 8601 or relative, e.g. 5m ago>"
            }
          ]
        },
        "recommended_action": "<which cluster to investigate next, or null>",
        "raw_data_truncated": false,
        "follow_up_agent": null
      }
    a2aConfig:
      skills:
        - id: fleet-observability
          name: Fleet Observability
          description: >-
            Cross-cluster Prometheus/Loki/alert aggregations. Compares metrics and logs
            across all clusters. NOT for single-cluster queries.
          tags:
            - fleet
            - observability
            - prometheus
            - loki
            - alerts
            - cross-cluster
          examples:
            - "Which cluster has the highest CPU usage right now?"
            - "Compare memory usage across all clusters"
            - "Are there any alerts firing fleet-wide?"
            - "Show error rates across all clusters in the last hour"
            - "Which cluster is using the most memory?"
