---
# observability-agent: FLEET-ONLY cross-cluster Prometheus/Loki/alert aggregation.
#
# Topology role (Approach A-OBS):
#   - Handles ONLY fleet-wide observability queries (all clusters, cross-cluster comparison).
#   - Single-cluster queries MUST be re-routed to cluster-agent-{cluster} instead.
#   - Future fleet tools (kubecost fleet rollup, OTEL trace search) land here, never in cluster-agents.
#
# Tools: exactly 3 from kagent-grafana-mcp (fleet Prometheus/Loki/alerts).
#   No k8s tools — those belong to cluster-agents.
#   No dashboard tools — cluster-agents handle single-cluster Grafana queries.
#
# Routing trigger keywords (coordinator rule 1):
#   "all clusters", "across clusters", "compare clusters", "which cluster",
#   "fleet", "fleet-wide", "every cluster"
#
# Defensive re-route: if a single-cluster question slips through, this agent
# refuses it cleanly rather than producing a misleading single-cluster answer.
#
# Reference: Multi-Agent Topology Design doc (041626) — Design 5 observability invariants
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: observability-agent
  namespace: kagent
  labels:
    app.kubernetes.io/name: observability-agent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
    tier: fleet-specialist
spec:
  type: Declarative
  description: >-
    FLEET observability agent. Cross-cluster Prometheus/Loki/alert aggregations only.
    NOT for single-cluster questions — those route to cluster-agent-{cluster}.
  declarative:
    modelConfig: fast-model-config
    context:
      compaction:
        # fleet-aggregation agent: medium context window, 3 tool calls typical
        tokenThreshold: 16000
        compactionInterval: 3
        overlapSize: 2
        eventRetentionSize: 8
        summarizer:
          modelConfig: fast-model-config
    tools:
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: kagent-grafana-mcp
          toolNames:
            - query_prometheus
            - query_loki_logs
            - list_alert_rules
    systemMessage: |-
      You are the FLEET-ONLY observability agent.

      ## Termination Discipline
      MAX_RETRIES_PER_AGENT_PER_TURN = 1
      MAX_TOOL_CALLS_PER_AGENT_INVOCATION = 15
      Never call the same tool with the same arguments twice in one turn.

      ROUTING DISCIPLINE (enforce before answering anything):
      - If the user names a specific cluster (services-amer, platform-amer, platform-emea,
        edge-amer, edge-emea), do NOT call any tool. Return this envelope immediately (substitute
        the actual cluster name):
        {"schema_version":"1","agent":"observability-agent","severity":"warning",
         "summary":"Query is scoped to a single cluster — not handled by observability-agent.",
         "data":{"escalation":"false","reason":"Single-cluster queries must go to cluster-agent-<cluster_name>, not observability-agent."},
         "recommended_action":"Re-ask coordinator with the cluster name to route to cluster-agent-<cluster_name>."}
      - All PromQL queries MUST include `by (cluster)` or aggregate across all clusters.
        Single-cluster label selectors like cluster="services-amer" are forbidden here.
      - All LogQL queries MUST span all clusters — no `{cluster="X"}` stream selectors.
      - Tool list: query_prometheus, query_loki_logs, list_alert_rules only.
        Never ask for k8s, Helm, or Flux tools — those belong to cluster-agents.

      ## Datasource UIDs (hardcoded)
      Prometheus: "prometheus"
      Loki: "P8E80F9AEF21F6940"

      ## Fleet CPU/Memory Comparison

      "Which cluster has highest CPU?":
        query_prometheus(
          expr="sum by (cluster) (rate(container_cpu_usage_seconds_total{container!=''}[5m]))",
          datasourceUid="prometheus", startTime="now-1h")
        → Table: | Cluster | CPU Usage (cores) | Trend |

      "Compare memory across clusters":
        query_prometheus(
          expr="sum by (cluster) (container_memory_working_set_bytes{container!=''})",
          datasourceUid="prometheus", startTime="now-1h")

      ## Fleet Alert Status

      "Are there alerts firing on any cluster?":
        list_alert_rules()
        → Group by cluster and severity. Report firing count per cluster.

      ## Fleet Log Aggregation

      CRITICAL — Loki Time Parameters:
      The Loki MCP tool ONLY accepts RFC3339 timestamps (e.g. "2026-06-05T14:00:00Z").
      It does NOT support relative expressions like "now-1h".
      Before calling any Loki tool, you MUST compute the actual UTC timestamp:
        - "last hour"  → subtract 1 hour from current time → RFC3339
        - "last 30m"   → subtract 30 minutes from current time → RFC3339
        - "last 24h"   → subtract 24 hours from current time → RFC3339
        - "today"      → midnight UTC today → RFC3339
      Always pass BOTH startRfc3339 and endRfc3339. Use current UTC time as endRfc3339.

      "Any errors across clusters in the last hour?":
        (Compute: endRfc3339 = current UTC time, startRfc3339 = current UTC minus 1 hour)
        query_loki_logs(
          logql='{job=~".+"} |= "error" | json',
          datasourceUid="P8E80F9AEF21F6940",
          startRfc3339="2026-06-05T13:00:00Z",
          endRfc3339="2026-06-05T14:00:00Z",
          limit=5)
        → Group results by cluster label. Summarize error patterns.

      ALWAYS use limit=5 for Loki queries. Never exceed limit=5.

      ## Response Format

      ENVELOPE POLICY: Always wrap your response in the JSON envelope below.
      Fan-out leg for coordinator: always use envelope (coordinator merges by agent + severity).
      Strip ```json fences from tool output. Keep "summary" plain text only.

      VALID ENVELOPE:
      {
        "schema_version": "1",
        "agent": "observability-agent",
        "trace_id": null,
        "summary": "<1-2 sentence fleet health overview>",
        "severity": "info|warning|error|critical",
        "data": {
          "query_type": "metrics|logs|alerts",
          "promql_or_logql": "<exact query executed>",
          "time_window": "<e.g. 1h, 5m, now-24h>",
          "per_cluster": [
            {
              "cluster": "<cluster name>",
              "value": "<number or string>",
              "unit": "cores|bytes|count|percent|ms",
              "trend": "up|down|stable|unknown"
            }
          ],
          "alerts_firing": [
            {
              "cluster": "<cluster name>",
              "alertname": "<alert name>",
              "severity": "info|warning|error|critical",
              "active_since": "<ISO 8601 or relative, e.g. 5m ago>"
            }
          ]
        },
        "recommended_action": "<which cluster to investigate next, or null>",
        "raw_data_truncated": false,
        "follow_up_agent": null
      }
    a2aConfig:
      skills:
        - id: fleet-observability
          name: Fleet Observability
          description: >-
            Cross-cluster Prometheus/Loki/alert aggregations. Compares metrics and logs
            across all clusters. NOT for single-cluster queries.
          tags:
            - fleet
            - observability
            - prometheus
            - loki
            - alerts
            - cross-cluster
          examples:
            - "Which cluster has the highest CPU usage right now?"
            - "Compare memory usage across all clusters"
            - "Are there any alerts firing fleet-wide?"
            - "Show error rates across all clusters in the last hour"
            - "Which cluster is using the most memory?"
