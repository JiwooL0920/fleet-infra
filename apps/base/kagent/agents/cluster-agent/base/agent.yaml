---
# cluster-agent base: Kubernetes cluster agent owning k8s + flux + helm + cluster-scoped obs.
#
# Design: Approach A-OBS (per-cluster cluster-agents + fleet-only observability-agent).
# Reference: Multi-Agent Topology Design doc (041626)
#
# Tool plane:
#   tools[0] k8s-tools-federated  — k8s_* tools via agentgateway (/mcp/k8s)
#            Overlay populates toolNames with k8s-tools-{cluster}_* prefixed names.
#            Also covers Flux CRD operations (k8s_get_resources, k8s_annotate_resource).
#   tools[1] helm-tools-federated — helm_* tools via agentgateway (/mcp/helm)
#            Overlay populates toolNames with helm-tools-{cluster}_* prefixed names.
#   tools[2] kagent-grafana-mcp   — fleet Grafana endpoint; cluster scoping via prompt injection.
#
# ArgoCD slot: NOT included until argocd-federated RemoteMCPServer CR is deployed.
#   To add ArgoCD: enable argocd-federated in mcpservers/kustomization.yaml, add a 4th
#   tool entry here (argocd-federated, toolNames: []), and populate in each overlay.
#
# Overlay responsibility (per services-amer/kustomization.yaml pattern):
#   - Rename agent to cluster-agent-{cluster}
#   - Add labels: cluster: {cluster}, tier: worker
#   - Replace description with cluster-specific one-liner
#   - Populate tools[0].mcpServer.toolNames + requireApproval (cluster-prefixed k8s names)
#   - Populate tools[1].mcpServer.toolNames (cluster-prefixed helm names)
#   - Replace systemMessage with cluster-identity + scoped prompt
#   - Replace a2aConfig.skills with cluster-named examples
#
# Hop budget: every query = 1 A2A hop (coordinator → this agent).
# Tool-selection accuracy: ~25 tools at deployment → ~80% per Anthropic benchmarks.
#
# ADR: God-Agent boundary (Phase 5 anti-pattern audit — deliberately kept at 26 tools)
# ─────────────────────────────────────────────────────────────────────────────────────
# DECISION: cluster-agent owns ~26 tools (18 k8s + 5 helm + 3 grafana).
#
# RATIONALE (why NOT split into k8s-agent + flux-agent + helm-agent):
#   1. These tools share one domain boundary: "everything scoped to one cluster."
#      Splitting by tool type would create three agents per cluster that always
#      need to be called together — multiplying A2A hops from 1→3 per query.
#   2. Anthropic's 25-tool accuracy benchmark (~80% tool selection) was the ceiling
#      at initial deployment. With 26 tools we are marginally above that — acceptable
#      given the tools are highly distinct (k8s_ vs helm_ vs query_ prefixes).
#   3. The pre-existing k8s-agent, flux-agent, and helm-agent were merged into
#      cluster-agent in a prior refactor — re-splitting would undo that work without
#      improving accuracy (the federation boundary, not tool count, is the right axis).
#
# ALERT: PrometheusRule KagentAgentToolCountExceeded fires if count exceeds 32.
#   At 33+ tools: evaluate splitting argocd + observability into dedicated agents.
#   See apps/base/kagent/base/prometheusrule.yaml for the alert definition.
# ─────────────────────────────────────────────────────────────────────────────────────
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: cluster-agent
  namespace: kagent
  labels:
    app.kubernetes.io/name: cluster-agent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
    tier: worker
    # cluster: {CLUSTER_NAME}  ← overlay adds via JSON 6902 patch
spec:
  type: Declarative
  description: >-
    Cluster agent. Owns Kubernetes, Flux, Helm, and cluster-scoped observability for one cluster.
    Use for any operation scoped to a single named cluster.
  declarative:
    modelConfig: fast-model-config
    context:
      compaction:
        tokenThreshold: 12000
        compactionInterval: 4
        overlapSize: 2
        eventRetentionSize: 10
        summarizer:
          modelConfig: fast-model-config
    tools:
      # k8s tools (covers k8s operations + Flux CRD interactions)
      # Overlay populates toolNames with cluster-prefixed k8s_* names
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: k8s-tools-federated
          toolNames: []
          requireApproval: []
      # helm tools (read-only Helm release inspection)
      # Overlay populates toolNames with cluster-prefixed helm_* names
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: helm-tools-federated
          toolNames: []
      # Cluster-scoped observability (prompt injects cluster label; no toolNames override needed)
      - type: McpServer
        mcpServer:
          kind: RemoteMCPServer
          name: kagent-grafana-mcp
          toolNames:
            - query_prometheus
            - query_loki_logs
    systemMessage: |-
      You are a single-cluster diagnostics agent.
      Scope: one named cluster only (overlay injects the actual cluster identity).
      Always respond in English.

      ## Core Operating Rules
      - Tool-first discipline: for every new query, call the relevant tool(s) before stating cluster facts.
      - Read-only by default: do not make persistent in-cluster changes directly.
      - GitOps boundary: for durable changes, identify the fleet-infra file path and instruct users to use git-agent PR flow.
      - Keep responses concise and structured.

      ## Capabilities
      - Kubernetes + Flux via k8s-tools-federated
      - Helm inspection via helm-tools-federated
      - Cluster-scoped observability via kagent-grafana-mcp tools:
        - query_prometheus
        - query_loki_logs

      ## Observability Scope
      - All PromQL/LogQL must be scoped to this cluster.
      - If the request is fleet-wide (all/across clusters), do not answer it here.
        Return a scoped warning and delegate routing to observability-agent.
      - Loki calls must use RFC3339 timestamps.

      ## Flux/GitOps Policy
      - Never recommend bypassing GitOps with direct apply for permanent fixes.
      - Reconciliation trigger is allowed only through approved tool calls.

      ## Response Envelope (Schema v2)
      Output only a JSON object using this schema:
      {
        "schema_version": "2",
        "agent": "cluster-agent-<cluster>",
        "summary": "<plain text>",
        "severity": "info|warning|error|critical",
        "data": {
          "scope": {"cluster": "<cluster>", "operation_class": "k8s|flux|helm|observability"},
          "resources": {},
          "issues": [],
          "proposed_change": {"file_path": null, "yaml_diff": null, "rationale": null},
          "tool_calls_made": 0
        },
        "recommended_action": null,
        "follow_up_agent": null
      }

      Resource listing rules:
      - resources is a map keyed by Kind.
      - Each Kind entry has columns[] and items[].
      - Cluster-scoped resources use namespace: "all".
      - Namespaced resources use actual namespace.

      If any tool errors, include the error in issues[] and do not fabricate data.
    a2aConfig:
      skills:
        - id: cluster-diagnostics
          name: Cluster Diagnostics
          description: >-
            Diagnose Kubernetes, Flux GitOps, Helm, and observability state for a named cluster.
            Use for any operation scoped to a single cluster.
          tags:
            - cluster
            - diagnostics
            - k8s
            - flux
            - helm
            - observability
          examples:
            - "What pods are failing in the kagent namespace?"
            - "Is Flux synced on this cluster?"
            - "What Helm chart version is n8n running?"
            - "Show recent error logs from the temporal namespace"
