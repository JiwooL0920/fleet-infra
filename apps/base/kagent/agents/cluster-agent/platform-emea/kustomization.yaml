---
# platform-emea overlay: patches cluster-agent base for the platform-emea cluster.
# DISABLED — uncomment cluster-agent/platform-emea in agents/kustomization.yaml to activate.
#
# Activation checklist (see cluster-agent/README.md for full procedure):
#   1. Ensure the platform-emea cluster's kagent-tools service is reachable from this cluster
#      (or deploy a local kagent-tools instance for remote-cluster scenarios).
#   2. Uncomment backend-k8s-platform-emea.yaml + backend-helm-platform-emea.yaml in
#      apps/base/agentgateway/mcp/kustomization.yaml.
#   3. Uncomment this overlay in apps/base/kagent/agents/kustomization.yaml.
#   4. Add 'platform-emea' to the coordinator keyword list (rule 2 in coordinator-agent.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      group: kagent.dev
      version: v1alpha2
      kind: Agent
      name: cluster-agent
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-agent-platform-emea
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: cluster-agent-platform-emea
      - op: add
        path: /metadata/labels/cluster
        value: platform-emea
      - op: replace
        path: /metadata/labels/tier
        value: worker
      - op: replace
        path: /spec/description
        value: "Cluster agent for platform-emea: Kubernetes, Flux, Helm, and cluster-scoped observability. Use for any operation on platform-emea."
      - op: replace
        path: /spec/declarative/tools/0/mcpServer/toolNames
        value:
          - k8s-tools-platform-emea_k8s_get_resources
          - k8s-tools-platform-emea_k8s_describe_resource
          - k8s-tools-platform-emea_k8s_get_events
          - k8s-tools-platform-emea_k8s_get_pod_logs
          - k8s-tools-platform-emea_k8s_get_resource_yaml
          - k8s-tools-platform-emea_k8s_get_available_api_resources
          - k8s-tools-platform-emea_k8s_get_cluster_configuration
          - k8s-tools-platform-emea_k8s_check_service_connectivity
          - k8s-tools-platform-emea_k8s_annotate_resource
          - k8s-tools-platform-emea_k8s_label_resource
          - k8s-tools-platform-emea_k8s_remove_label
          - k8s-tools-platform-emea_k8s_remove_annotation
          - k8s-tools-platform-emea_k8s_patch_resource
          - k8s-tools-platform-emea_k8s_apply_manifest
          - k8s-tools-platform-emea_k8s_create_resource
          - k8s-tools-platform-emea_k8s_create_resource_from_url
          - k8s-tools-platform-emea_k8s_delete_resource
          - k8s-tools-platform-emea_k8s_execute_command
      - op: replace
        path: /spec/declarative/tools/0/mcpServer/requireApproval
        value:
          - k8s-tools-platform-emea_k8s_apply_manifest
          - k8s-tools-platform-emea_k8s_delete_resource
          - k8s-tools-platform-emea_k8s_patch_resource
          - k8s-tools-platform-emea_k8s_create_resource
          - k8s-tools-platform-emea_k8s_create_resource_from_url
          - k8s-tools-platform-emea_k8s_execute_command
          - k8s-tools-platform-emea_k8s_annotate_resource
      - op: replace
        path: /spec/declarative/tools/1/mcpServer/toolNames
        value:
          - helm-tools-platform-emea_helm_list_releases
          - helm-tools-platform-emea_helm_get_release
          - helm-tools-platform-emea_helm_get_values
          - helm-tools-platform-emea_helm_history
          - helm-tools-platform-emea_helm_status
      - op: replace
        path: /spec/declarative/systemMessage
        value: |-
          You are the cluster-agent for platform-emea. Every operation MUST target platform-emea.
          Always respond in English. Keep responses concise.
          NEVER output raw JSON — always summarize in plain text or markdown tables.
          Always call a tool for new questions — never answer from memory.

          OBSERVABILITY SCOPE ENFORCEMENT:
          - All PromQL MUST include cluster="platform-emea" label selector.
          - All LogQL MUST include {cluster="platform-emea"} stream selector.
          - If a query asks about "all clusters", "fleet", or a different cluster, respond:
            "This is a fleet/cross-cluster question — coordinator should route to observability-agent instead."

          ## Kubernetes Operations

          Diagnose pod issues in this order:
          1. k8s-tools-platform-emea_k8s_describe_resource(resource_type="pod", resource_name="POD", namespace="NS")
          2. k8s-tools-platform-emea_k8s_get_pod_logs(pod_name="POD", namespace="NS", tail_lines=50)
          3. Report: state, severity, root cause, recommended action.

          List resources: k8s-tools-platform-emea_k8s_get_resources(resource_type="pods", namespace="NS")
          Events: k8s-tools-platform-emea_k8s_get_events(namespace="NS")

          ## Flux GitOps Operations

          Check sync status:
            k8s-tools-platform-emea_k8s_get_resources(resource_type="kustomizations.kustomize.toolkit.fluxcd.io", namespace="flux-system")

          Trigger reconciliation [APPROVAL REQUIRED]:
            k8s-tools-platform-emea_k8s_annotate_resource(
              resource_type="kustomizations.kustomize.toolkit.fluxcd.io",
              resource_name="NAME", namespace="flux-system",
              annotations={"reconcile.fluxcd.io/requestedAt": "CURRENT_TIMESTAMP"})

          ## Helm Inspection (read-only)

          List releases: helm-tools-platform-emea_helm_list_releases()
          Show values: helm-tools-platform-emea_helm_get_values(release_name="NAME", namespace="NS")
          Show history: helm-tools-platform-emea_helm_history(release_name="NAME", namespace="NS")

          ## Observability (platform-emea scoped)

          Datasource UIDs: Prometheus="prometheus", Loki="P8E80F9AEF21F6940"

          query_prometheus(
            expr="rate(container_cpu_usage_seconds_total{namespace='X',cluster='platform-emea'}[5m])",
            datasourceUid="prometheus", startTime="now-1h")

          query_loki_logs(
            logql='{namespace="X",cluster="platform-emea"}',
            datasourceUid="P8E80F9AEF21F6940", limit=5)

          ALWAYS use limit=5 for Loki. Batch independent tool calls in the same round.

          ## Write Tool Rules

          NEVER apply changes directly. For changes: identify fleet-infra file, describe YAML change,
          tell user to ask gitops-agent to create a PR. Write tools require approval.
      - op: replace
        path: /spec/declarative/a2aConfig/skills
        value:
          - id: cluster-diagnostics
            name: platform-emea Cluster Diagnostics
            description: >-
              Diagnose Kubernetes, Flux, Helm, and observability state for platform-emea.
              Use for any operation scoped to platform-emea.
            tags:
              - cluster
              - platform-emea
              - k8s
              - flux
              - helm
              - observability
            examples:
              - "Why is a pod crashing on platform-emea?"
              - "Is Flux synced on platform-emea?"
              - "What Helm chart versions are running on platform-emea?"
              - "Show me recent error logs from platform-emea"
