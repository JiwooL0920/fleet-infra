---
# Faster ModelConfig for the classifier-agent (input safety gate).
# Uses qwen2.5:3b (~2-3s TTFR) — 5-bucket classification doesn't need 14B parameters.
# num_ctx is intentionally tiny: only the user query + 5-bucket schema needs to fit.
# temperature: 0.0 for fully deterministic classification (same query → same verdict every time).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: classifier-model-config
  namespace: kagent
  labels:
    app.kubernetes.io/name: classifier-model-config
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  model: qwen2.5:3b
  provider: Ollama
  ollama:
    host: "${OLLAMA_HOST}"
    options:
      num_ctx: "2048"    # tiny — only user query + 5-bucket schema fits; intentional
      temperature: "0.0" # fully deterministic for classification
      num_predict: "256" # refusal/allow envelope is < 200 tokens
