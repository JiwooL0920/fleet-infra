---
# ModelConfig for direct classification use (reserved / not currently wired).
#
# classifier-agent uses fast-model-config (qwen2.5:14b-kagent) for reliable
# classify-then-delegate with a structured JSON output contract.
# qwen2.5:3b can handle pure classification but cannot reliably emit the JSON envelope
# AND call a tool in the same turn — see classifier-agent.yaml for upgrade rationale.
#
# This config is kept for future use when/if classifier-agent is split into two stages:
#   Stage 1: classify only (3b, this config) → emit verdict JSON
#   Stage 2: delegate to coordinator (14b) based on verdict
# Until that split is implemented, this config is not referenced by any agent.
# temperature: 0.0 for fully deterministic classification (same query → same verdict every time).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: classifier-model-config
  namespace: kagent
  labels:
    app.kubernetes.io/name: classifier-model-config
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  model: qwen2.5:3b
  provider: Ollama
  ollama:
    host: "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:9080"
    options:
      num_ctx: "2048"
      temperature: "0.0"
      num_predict: "256"
