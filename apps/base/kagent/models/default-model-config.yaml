---
# Primary ModelConfig for complex reasoning tasks (coordinator-agent, k8s-agent, git-agent).
# Uses qwen2.5:72b (~90s TTFR) — the highest quality local model for planning and delegation.
# For latency-sensitive agents, use fast-model-config (qwen2.5:14b-kagent).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: default-model-config
  namespace: kagent
  labels:
    app.kubernetes.io/name: default-model-config
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  model: "${OLLAMA_MODEL}"
  provider: Ollama
  ollama:
    host: "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:9080"
    options:
      num_ctx: "16384"
      temperature: "0.1"
      num_predict: "4096"
