---
# opencost-mcp-server: Connects the finops-agent to OpenCost's built-in MCP server.
# OpenCost runs its MCP server on port 8081 (HTTP/STREAMABLE_HTTP) by default.
# No additional deployment needed — the MCP is built into the OpenCost pod.
#
# Tools available to finops-agent:
#   - get_allocation_costs: cost by namespace/pod/node/label (time window)
#   - get_asset_costs: node, disk, load balancer costs
#
# Reference: https://opencost.io/docs/integrations/mcp/
apiVersion: kagent.dev/v1alpha1
kind: ToolServer
metadata:
  name: opencost-mcp-server
  namespace: kagent
  labels:
    app.kubernetes.io/name: opencost-mcp-server
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  description: OpenCost MCP server for Kubernetes cost allocation and asset cost queries
  config:
    streamableHttp:
      url: http://opencost.opencost.svc.cluster.local:8081
      timeout: 30s
      sseReadTimeout: 2m0s
