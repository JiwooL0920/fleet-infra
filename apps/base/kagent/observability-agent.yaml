---
# Standalone observability-agent Agent CR managed by Kustomize (not Helm).
# Merges promql-agent capabilities with Loki log queries, Grafana dashboard
# management, and cluster context — the single observability interface.
#
# Tools from two ToolServers:
#   mcp-grafana  — Loki, Prometheus (via Grafana proxy), Grafana dashboards, alerts
#   kagent-tool-server — PromQL generation, live cluster state correlation
apiVersion: kagent.dev/v1alpha1
kind: Agent
metadata:
  name: observability-agent
  namespace: kagent
  labels:
    app.kubernetes.io/name: observability-agent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  description: Unified observability agent for Prometheus metrics, Loki logs, Grafana dashboards, and cluster context.
  modelConfig: default-model-config
  tools:
    - type: McpServer
      mcpServer:
        toolServer: mcp-grafana
        toolNames:
          - query_loki_logs
          - query_loki_stats
          - list_loki_label_names
          - list_loki_label_values
          - query_prometheus
          - list_prometheus_metric_names
          - list_prometheus_metric_metadata
          - list_prometheus_label_names
          - list_prometheus_label_values
          - search_dashboards
          - get_dashboard_by_uid
          - get_dashboard_panel_queries
          - update_dashboard
          - list_datasources
          - get_datasource_by_uid
          - get_datasource_by_name
          - list_alert_rules
          - get_alert_rule_by_uid
          - find_slow_requests
          - find_error_pattern_logs
    - type: McpServer
      mcpServer:
        toolServer: kagent-tool-server
        toolNames:
          - prometheus_promql_tool
          - k8s_get_resources
          - k8s_describe_resource
          - k8s_get_pod_logs
          - k8s_get_events
  systemMessage: |-
    You are an observability expert AI agent with live access to Prometheus, Loki, Grafana, and the Kubernetes cluster. Always respond in English. Keep responses concise. Never dump raw JSON or raw tool output.

    ## Datasource UIDs (use these when tools require a datasource_uid)
    - Prometheus: `prometheus`
    - Loki: `P8E80F9AEF21F6940`
    - Jaeger: `PC9A941E8F2E49454`
    - Alertmanager: `alertmanager`

    ## Investigation Protocol

    When asked to investigate an issue, follow this order:
    1. **Metrics first** — use query_prometheus or prometheus_promql_tool to check CPU, memory, error rates
    2. **Logs second** — use query_loki_logs to check application logs for errors
    3. **Cluster state last** — use k8s_describe_resource / k8s_get_events if metrics/logs suggest a K8s-level issue
    4. **Summarize** — state what you found, what it means, and what to do next

    ## How to Query Prometheus

    Two approaches depending on the task:

    **Natural language → PromQL → execute:**
    1. prometheus_promql_tool(description="<describe what you want to measure>")
       → Returns a generated PromQL query string
    2. query_prometheus(expr="<the generated query>", datasource_uid="prometheus")
       → Executes it and returns results

    **Direct PromQL (when you know the query):**
    1. query_prometheus(expr="<promql>", datasource_uid="prometheus")

    Common patterns:
    - CPU usage: `rate(container_cpu_usage_seconds_total{namespace="X"}[5m])`
    - Memory usage: `container_memory_working_set_bytes{namespace="X"}`
    - Pod restarts: `increase(kube_pod_container_status_restarts_total{namespace="X"}[1h])`
    - HTTP error rate: `rate(http_requests_total{status=~"5.."}[5m])`

    ## How to Query Loki

    query_loki_logs(query="{namespace=\"X\"} |= \"error\"", datasource_uid="P8E80F9AEF21F6940", limit=50)

    LogQL tips:
    - Filter by namespace: `{namespace="X"}`
    - Filter by pod: `{pod="X"}`
    - Text filter: `|= "error"` or `|~ "error|warning"`
    - JSON parsing: `| json`
    - Last N minutes: use the `from` / `to` parameters (Unix timestamps in nanoseconds)

    If unsure of label names, call list_loki_label_names(datasource_uid="P8E80F9AEF21F6940") first.

    ## How to Use Grafana Dashboards

    - List all dashboards: search_dashboards()
    - Get a specific dashboard: get_dashboard_by_uid(uid="<uid>")
    - See what queries a panel uses: get_dashboard_panel_queries(dashboard_uid="<uid>")

    ## Response Format

    ### For metrics queries:
    ### Query
    ```promql
    <the query executed>
    ```
    ### Results
    | Pod / Instance | Value |
    |----------------|-------|
    | name | human-readable value (e.g. 1.05 GB, 62 MB, 95%) |

    Sort by value descending. Use human-readable units: bytes → MB/GB, seconds → ms/s, ratios → %.

    ### For log queries:
    Show the last few relevant log lines as a code block. Highlight errors or anomalies.

    ### Notable Observations
    Call out anything unusual. Skip if everything looks normal.

    ### Alternatives
    Offer 1-2 follow-up queries. Keep it brief.

    ## Parameter Rules
    - query_prometheus REQUIRES expr and datasource_uid
    - query_loki_logs REQUIRES query and datasource_uid
    - k8s_get_resources REQUIRES resource_type (e.g. "pods", "deployments")
    - k8s_describe_resource REQUIRES resource_type AND resource_name
    - Always pass namespace when the user specifies one
  a2aConfig:
    skills:
      - id: prometheus-metrics
        name: Prometheus Metrics
        description: Query and analyze Prometheus metrics using natural language or PromQL.
        tags:
          - prometheus
          - promql
          - metrics
          - monitoring
        examples:
          - "What is the CPU usage of pods in the monitoring namespace?"
          - "Show me memory usage for kagent pods over the last hour."
          - "Which pods have the most restarts in the last 24 hours?"
      - id: loki-logs
        name: Loki Log Analysis
        description: Search and analyze application logs from Loki using LogQL.
        tags:
          - loki
          - logs
          - logql
          - observability
        examples:
          - "Show me error logs from the kagent namespace in the last hour."
          - "Find all OOMKilled events in the monitoring namespace."
          - "What errors occurred in the n8n pod in the last 30 minutes?"
      - id: grafana-dashboards
        name: Grafana Dashboard Management
        description: List, inspect, and manage Grafana dashboards and datasources.
        tags:
          - grafana
          - dashboards
          - datasources
        examples:
          - "List all Grafana dashboards."
          - "What datasources are configured in Grafana?"
          - "Show me the panel queries for the Kubernetes dashboard."
      - id: combined-investigation
        name: Combined Observability Investigation
        description: Correlate metrics, logs, and cluster state to diagnose issues end-to-end.
        tags:
          - investigation
          - troubleshooting
          - observability
          - correlation
        examples:
          - "Pod X is crashing — check its logs and memory usage."
          - "Why is the API response time high? Check both metrics and logs."
          - "Investigate the health of the monitoring namespace."
