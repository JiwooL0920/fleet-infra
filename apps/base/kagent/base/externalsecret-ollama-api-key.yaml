---
# ExternalSecret: Ollama API key placeholder
# Ollama does not require API authentication, but the kagent OpenAI provider
# schema requires an apiKeySecret reference. This creates a dummy secret with
# a fixed value "ollama-no-auth-required" that satisfies the schema.
# The value is stored in LocalStack Secrets Manager for consistency with
# other secrets in this cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ollama-api-key
  namespace: kagent
  labels:
    app.kubernetes.io/name: ollama-api-key
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: ollama-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: kagent/ollama/api-key
