---
# ExternalSecret: Grafana service account token for kagent mcp-grafana ToolServer.
#
# Must be in flux-system namespace so postBuild.substituteFrom in base/services/kagent.yaml
# can inject KAGENT_GRAFANA_API_KEY into the kagent HelmRelease values.
#
# The token is initially a placeholder (set by LocalStack startup hooks) and gets
# replaced by the real SA token after the grafana-sa-setup Job completes.
# ExternalSecret refreshes every hour so the real token is picked up automatically.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-grafana-sa-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: kagent-grafana-sa-token
    creationPolicy: Owner
    template:
      data:
        KAGENT_GRAFANA_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: kagent/grafana/api-key
