---
# kagent main chart
# Depends on kagent-crds HelmRelease being fully ready before applying
#
# postRenderers: patches the kagent-controller Service to add appProtocol: kgateway.dev/a2a
# so AgentGateway can route A2A traffic to kagent-controller on :8083.
# Reference: https://agentgateway.dev/docs/kubernetes/latest/agent/a2a/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kagent
  targetNamespace: kagent
  dependsOn:
    - name: kagent-crds
  install:
    crds: Create
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 15m
    force: true
    remediation:
      retries: 3
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: kagent-controller
            patch: |
              - op: add
                path: /spec/ports/0/appProtocol
                value: kgateway.dev/a2a
          - target:
              group: kagent.dev
              version: v1alpha2
              kind: RemoteMCPServer
              name: kagent-grafana-mcp
            patch: |
              - op: replace
                path: /spec/url
                value: "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:9090/mcp/grafana"
          - target:
              version: v1
              kind: Deployment
              name: kagent-controller
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/startupProbe/failureThreshold
                value: 20
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "grpc"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: OTEL_SERVICE_NAME
                  value: "kagent-controller"
  chart:
    spec:
      chart: kagent
      version: "${KAGENT_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: kagent-oci
        namespace: flux-system
      interval: 10m
  values:
    # ---------------------------------------------------------
    # Database: external CNPG PostgreSQL with pgvector
    # Credentials mounted via secret (official production recommendation:
    # https://kagent.dev/docs/kagent/operations/operational-considerations)
    # ---------------------------------------------------------
    database:
      postgres:
        urlFile: /var/secrets/db-url/DATABASE_URL
        vectorEnabled: true
        bundled:
          enabled: false

    controller:
      replicas: "${KAGENT_CONTROLLER_REPLICAS}"
      resources:
        requests:
          cpu: "${KAGENT_CONTROLLER_CPU_REQUEST}"
          memory: "${KAGENT_CONTROLLER_MEMORY_REQUEST}"
        limits:
          cpu: "${KAGENT_CONTROLLER_CPU_LIMIT}"
          memory: "${KAGENT_CONTROLLER_MEMORY_LIMIT}"
      extraEnv:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_EXPORTER_OTLP_TIMEOUT
          value: "5000"
        - name: OTEL_BSP_SCHEDULE_DELAY
          value: "10000"
        - name: OTEL_SERVICE_NAME
          value: "kagent-controller"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=kagent,deployment.environment=${ENVIRONMENT}"
      # Mount the kagent-postgres-credentials secret (created by ExternalSecret)
      # so kagent can read DATABASE_URL from a file instead of Helm values
      volumes:
        - name: kagent-db-url
          secret:
            secretName: kagent-postgres-credentials
      volumeMounts:
        - name: kagent-db-url
          mountPath: /var/secrets/db-url
          readOnly: true

    ui:
      replicas: "${KAGENT_UI_REPLICAS}"
      resources:
        requests:
          cpu: "${KAGENT_UI_CPU_REQUEST}"
          memory: "${KAGENT_UI_MEMORY_REQUEST}"
        limits:
          cpu: "${KAGENT_UI_CPU_LIMIT}"
          memory: "${KAGENT_UI_MEMORY_LIMIT}"

    # ---------------------------------------------------------
    # LLM Provider: Ollama (local, in-cluster)
    # Model is served by the ollama service in the ollama namespace
    # ---------------------------------------------------------
    providers:
      default: ollama
      ollama:
        provider: Ollama
        model: "${OLLAMA_MODEL}"
        config:
          host: "${OLLAMA_HOST}"

    # ---------------------------------------------------------
    # Built-in subcharts: disabled — we manage agents as standalone CRs
    # and tools as RemoteMCPServer CRs via Kustomize.
    # Subchart conditions use TOP-LEVEL keys (Chart.yaml condition: field).
    # ---------------------------------------------------------
    k8s-agent:
      enabled: false
    kgateway-agent:
      enabled: false
    istio-agent:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    querydoc:
      enabled: false
    kagent-tools:
      enabled: true

    # ---------------------------------------------------------
    # Grafana MCP subchart config (v0.8.3 moved out of tools block)
    # URL points at kube-prometheus-stack Grafana in monitoring namespace.
    # apiKey injected via postBuild.substituteFrom from kagent-grafana-sa-token Secret.
    # ---------------------------------------------------------
    grafana-mcp:
      enabled: true
      grafana:
        url: "http://monitoring-kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
        serviceAccountToken: "${KAGENT_GRAFANA_API_KEY}"

    # ---------------------------------------------------------
    # Observability: wire to existing OTel Collector in monitoring namespace.
    # OTLP endpoint explicitly set to match agentgateway's collector target.
    # Reference: apps/base/agentgateway/config/proxy-params.yaml
    # ---------------------------------------------------------
    otel:
      tracing:
        enabled: true
      logging:
        enabled: false
      exporter:
        endpoint: "http://opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
