---
# OCI HelmRepository for kagent charts
# Using HelmRepository type: oci (not OCIRepository) to avoid the open Flux label bug:
# https://github.com/kagent-dev/kagent/issues/695
# Confirmed working by community with this approach (issue comment by @poblin-orange)
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kagent-oci
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/kagent-dev/kagent/helm
---
# Install kagent CRDs first
# CRDs must be present before the main kagent HelmRelease is applied
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kagent-crds
  targetNamespace: kagent
  install:
    crds: Create
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    timeout: 10m
    remediation:
      retries: 3
  chart:
    spec:
      chart: kagent-crds
      version: "${KAGENT_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: kagent-oci
        namespace: flux-system
      interval: 10m
