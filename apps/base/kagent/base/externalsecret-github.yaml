---
# ExternalSecret: GitHub Personal Access Token for git-agent GitHub MCP server.
# The secret is initialized by running: make setup-github-secret
# This reads GITHUB_TOKEN or GITHUB_PAT from your environment and pushes it to LocalStack.
# Run once after first cluster spinup or after rotating your GitHub PAT.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-mcp-credentials
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: github-mcp-credentials
    creationPolicy: Owner
    template:
      data:
        GITHUB_PERSONAL_ACCESS_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: github/mcp/token
        property: GITHUB_PERSONAL_ACCESS_TOKEN
