---
# kagent IngressRoute
# Defense-in-depth middleware chain (order matters — Traefik applies in declaration order):
#   1. input-guardrail: regex safety gate (rejects prompt-injection, credential leak patterns)
#   2. kagent-auth:     basicAuth identity gate (requires valid credentials)
# For production, replace kagent-auth with JWT/OIDC (Traefik forwardAuth to an OIDC provider).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kagent.local`)
      kind: Rule
      middlewares:
        - name: input-guardrail
          namespace: kagent
        - name: kagent-auth
          namespace: kagent
      services:
        - name: kagent-ui
          port: 8080
