---
# ExternalSecret: kagent PostgreSQL credentials
# Follows the same pattern as apps/base/n8n/externalsecret.yaml:
# - Pulls CNPG credentials pushed to LocalStack by apps/base/cloudnative-pg/push-secret.yaml
# - Templates a single DATABASE_URL string for use with kagent's urlFile setting
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-postgres-credentials
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: localstack-secretstore
    kind: ClusterSecretStore
  target:
    name: kagent-postgres-credentials
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}.cnpg-system.svc.cluster.local:{{ .port }}/kagent"
  data:
    - secretKey: host
      remoteRef:
        key: cnpg/postgresql-cluster-app/host
    - secretKey: port
      remoteRef:
        key: cnpg/postgresql-cluster-app/port
    - secretKey: username
      remoteRef:
        key: cnpg/postgresql-cluster-app/username
    - secretKey: password
      remoteRef:
        key: cnpg/postgresql-cluster-app/password
