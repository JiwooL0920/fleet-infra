---
# input-guardrail: Traefik forwardAuth sidecar for edge-layer regex guardrail.
#
# Architecture:
#   User → Traefik IngressRoute (kagent.local)
#          → forwardAuth → input-guardrail-svc (this pod)
#             ├─ Pattern match? → 403 + refusal envelope (never reaches kagent)
#             └─ No match?     → 200 (Traefik proceeds to kagent-ui)
#
# The guard reads the raw request body from the X-Forwarded-Body header that
# Traefik's forwardAuth sends, or falls back to reading the forwarded request body.
# For kagent's API, the user query lands in the POST body as JSON.
#
# Pattern ordering: most-common attack patterns first (credential leaks → injection → jailbreak)
# This is a free perf optimization — earlier match = less evaluation work per request.
#
# Latency target: < 5ms p99 (pure in-memory regex, no disk/network IO per request).
#
# Defense-in-depth: agentgateway AgentgatewayPolicy (a2a/guardrail-policy.yaml) handles
# compromised-agent injection on the A2A path — this guard handles user-originated attacks.
#
# Image: pinned to python:3.12-alpine@sha256 digest for reproducibility.
# To update: pull python:3.12-alpine, replace both tag and digest.
# Note: future improvement — package as a versioned image (see LOW findings in audit plan).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: input-guardrail
  namespace: kagent
  labels:
    app.kubernetes.io/name: input-guardrail
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: input-guardrail
  template:
    metadata:
      labels:
        app: input-guardrail
        app.kubernetes.io/name: input-guardrail
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guard
          # python:3.12-alpine pinned by digest for supply-chain reproducibility.
          # The guard is a self-contained HTTP server — no external dependencies.
          image: python:3.12-alpine@sha256:236173eb74001afe2f60862de935b74fcbd00adfca247b2c27051a70a6a39a2d
          command: ["/bin/sh", "-c"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - |
              python3 - <<'PYEOF'
              import re, json, sys
              from http.server import HTTPServer, BaseHTTPRequestHandler

              # Ordered by likelihood-of-match (highest hit-rate first → cheapest avg eval).
              # Each pattern is compiled once at startup.
              PATTERNS = [
                  # 1. Credential leaks (most common in real traffic)
                  re.compile(r'(?i)bearer\s+[A-Za-z0-9._\-]+'),
                  re.compile(r'(?i)(password|passwd|pwd)\s*[=:]\s*\S+'),
                  re.compile(r'(?i)api[_-]?key\s*[=:]\s*\S+'),
                  # 2. Direct prompt-injection strings
                  re.compile(r'(?i)ignore (all |the )?(previous|prior|above) (instructions|prompts|messages)'),
                  re.compile(r'(?i)disregard (all |the )?(previous|prior|above) (instructions|prompts)'),
                  # 3. Specific credential format signatures
                  re.compile(r'ghp_[A-Za-z0-9]{36}'),
                  re.compile(r'sk-[A-Za-z0-9]{32,}'),
                  # 4. Jailbreak phrases
                  re.compile(r'(?i)you are now (DAN|in developer mode|jailbroken)'),
                  re.compile(r'(?i)\b(JAILBREAK|DAN mode|developer mode)\b'),
                  # 5. System-prompt extraction (rarest)
                  re.compile(r'(?i)(reveal|show|print|output|repeat) (your |the )?(system|initial) (prompt|instructions|message)'),
                  re.compile(r'(?i)(secret|token)\s*[=:]\s*[\'"]?[A-Za-z0-9._\-]{16,}'),
              ]

              REFUSAL_BODY = json.dumps({
                  "schema_version": "1",
                  "agent": "traefik-edge",
                  "trace_id": None,
                  "summary": "Request blocked by edge guardrail",
                  "severity": "error",
                  "data": {
                      "verdict": "refuse",
                      "category": "edge_regex_block",
                      "reason": "Pattern matched in request body — possible prompt injection or credential leak"
                  },
                  "recommended_action": "Rephrase without instruction-override or credential patterns.",
                  "raw_data_truncated": False,
                  "follow_up_agent": None
              }).encode()

              class GuardHandler(BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      pass  # suppress default access log; structured logging via print

                  def do_POST(self):
                      length = int(self.headers.get('Content-Length', 0))
                      body = self.rfile.read(length).decode('utf-8', errors='replace') if length else ''

                      for pattern in PATTERNS:
                          if pattern.search(body):
                              matched = pattern.pattern[:60]
                              print(json.dumps({
                                  "level": "warn",
                                  "msg": "edge_regex_block",
                                  "pattern": matched,
                                  "category": "edge_regex_block"
                              }), flush=True)
                              self.send_response(403)
                              self.send_header('Content-Type', 'application/json')
                              self.send_header('Content-Length', str(len(REFUSAL_BODY)))
                              self.end_headers()
                              self.wfile.write(REFUSAL_BODY)
                              return

                      self.send_response(200)
                      self.end_headers()

                  # Traefik forwardAuth sends GET for health; support it
                  def do_GET(self):
                      if self.path == '/health':
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(b'ok')
                      else:
                          self.send_response(200)
                          self.end_headers()

              print("input-guardrail listening on :9292", flush=True)
              HTTPServer(('0.0.0.0', 9292), GuardHandler).serve_forever()
              PYEOF
          ports:
            - containerPort: 9292
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 9292
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9292
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: input-guardrail
  namespace: kagent
  labels:
    app.kubernetes.io/name: input-guardrail
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: input-guardrail
  ports:
    - port: 9292
      targetPort: 9292
      name: http
---
# Traefik Middleware: forwardAuth pointing at the guard service.
# Attached to the kagent IngressRoute via middlewares field.
#
# forwardAuth sends the full original request to the guard (including body via POST).
# On 2xx response from guard → Traefik proceeds to kagent-ui.
# On 4xx/5xx from guard → Traefik returns the guard's response to the user.
#
# authResponseHeaders: pass guard-set headers back to kagent (e.g., X-Guardrail-Category
# for structured logging — added when guard detects borderline patterns).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: input-guardrail
  namespace: kagent
  labels:
    app.kubernetes.io/name: input-guardrail
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  forwardAuth:
    address: http://input-guardrail.kagent.svc.cluster.local:9292/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Guardrail-Category
