---
# github-mcp-server: Self-hosted GitHub MCP server for git-agent.
# Runs the official GitHub MCP server in HTTP/SSE mode so kagent can connect to it
# as a ToolServer. The GITHUB_PERSONAL_ACCESS_TOKEN is injected from the
# github-mcp-credentials ExternalSecret.
#
# GitHub MCP Server: https://github.com/github/github-mcp-server
# Exposed tools used by git-agent:
#   get_file_contents, list_commits, list_pull_requests, get_pull_request,
#   get_pull_request_files, search_code, create_branch, create_or_update_file,
#   push_files, create_pull_request
#
# The RemoteMCPServer CR that registers this endpoint with kagent lives in
# config/mcpservers/github-mcp.yaml
#
# Image: pinned to v1.0.0 with SHA256 digest for supply-chain reproducibility.
# To update: pull the new tag, replace both tag and digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp-server
  namespace: kagent
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-mcp-server
        app.kubernetes.io/instance: kagent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-mcp-server
          image: ghcr.io/github/github-mcp-server:v1.0.0@sha256:d2550953f8050bc5a1c8f80d1678766f66f60bbfbcd953fdeaf661fe4269bd95
          args:
            - http
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-mcp-credentials
                  key: GITHUB_PERSONAL_ACCESS_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp-server
  namespace: kagent
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: github-mcp-server
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
