---
# PodMonitor: scrapes kagent-controller Prometheus metrics.
# kagent-controller exposes metrics on the same port as A2A (named 'http', port 8083).
# NOTE: kagent may not serve /metrics by default — if scraping fails with connection
# timeout, enable metrics in the kagent HelmRelease: controller.metrics.enabled: true
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kagent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
    release: monitoring-kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kagent
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# PodMonitor: scrapes agentgateway-proxy Prometheus metrics.
# agentgateway exposes metrics on named port 'metrics' (9092).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: agentgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/instance: agentgateway
    app.kubernetes.io/managed-by: kustomize
    release: monitoring-kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - agentgateway-system
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
