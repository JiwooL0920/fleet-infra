---
# RemoteMCPServer: registers the github-mcp-server Streamable HTTP endpoint with kagent.
# Referenced by git-agent as name: github-mcp-server
# The Deployment and Service for the MCP server live in base/github-mcp-server.yaml.
# Auth: HTTP mode uses the PAT via Authorization header (headersFrom) which the
# server accepts for Streamable HTTP requests.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: github-mcp-server
  namespace: kagent
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/managed-by: kustomize
spec:
  description: GitHub MCP server for repository operations and Pull Request creation
  url: http://github-mcp-server.kagent.svc.cluster.local:8082/mcp
  protocol: STREAMABLE_HTTP
  timeout: 45s
  headersFrom:
    - name: Authorization
      valueFrom:
        key: GITHUB_PERSONAL_ACCESS_TOKEN
        name: github-mcp-credentials
        type: Secret
