# IMPORTANT: After any change here, recreate cluster and re-bootstrap:
# kind delete cluster --name dev-services-amer && kind create cluster --config kind-config.yaml && make bootstrap-cilium
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-services-amer
nodes:
  - role: control-plane
    # Port mappings for Traefik ingress
    extraPortMappings:
      - containerPort: 30080  # HTTP
        hostPort: 80
        protocol: TCP
      - containerPort: 30443  # HTTPS
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
