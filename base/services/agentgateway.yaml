---
# agentgateway (install) - HelmReleases only; no CRD instances.
# Installs the agentgateway Helm chart + CRDs (AgentgatewayParameters, AgentgatewayBackend,
# AgentgatewayPolicy) and the Traefik IngressRoute for agentgateway.local.
#
# CRD instances (Gateway, AgentgatewayParameters, Backends, Routes) are applied by
# agentgateway-config which dependsOn this kustomization.
#
# Depends on:
#   - gateway-api-crds: Gateway API CRDs must exist before agentgateway installs its GatewayClass
#   - kagent: A2A routing targets the kagent-controller Service
#   - traefik: IngressRoute for agentgateway.local
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/agentgateway/base
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: gateway-api-crds
    - name: kagent
    - name: traefik
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
