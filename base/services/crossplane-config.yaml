---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-config
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/crossplane-config
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: crossplane-providers
    - name: external-secrets-operator  # Required for AWS credentials
    - name: localstack  # Required for S3 bucket testing
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
