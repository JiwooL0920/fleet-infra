---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m  # Reduced from 5m - no dependencies
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/traefik
  prune: true
  wait: true
  # No dependsOn - starts immediately
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: traefik
