---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: grafana-dashboards
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/JiwooL0920/grafana-dashboards
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: grafana-dashboards
  path: ./infra
  prune: true
  wait: true
  dependsOn:
    - name: grafana-config
  healthChecks:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaDashboard
      name: llm-metrics
      namespace: monitoring
