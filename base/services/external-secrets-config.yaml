---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/external-secrets-config
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: external-secrets-operator  # CRDs must be installed first
    - name: localstack  # LocalStack must be ready for AWS secrets access
  healthChecks:
    - apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      name: localstack-secretstore
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars