---
# kagent - Kubernetes-native AI agent platform (CNCF Sandbox)
# Depends on:
#   - ollama: LLM inference backend
#   - cnpg-operator: PostgreSQL for agent state + pgvector memory
#   - external-secrets-config: ClusterSecretStore for DB credentials
#   - traefik: Ingress for kagent.local UI
#   - grafana-sa-setup: Grafana SA token in LocalStack for mcp-grafana ToolServer
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/kagent
  prune: true
  wait: true
  timeout: 15m0s
  dependsOn:
    - name: ollama
    - name: cnpg-operator
    - name: external-secrets-config
    - name: traefik
    - name: grafana-sa-setup
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: Secret
        name: kagent-grafana-sa-token
        optional: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kagent-controller
      namespace: kagent
    - apiVersion: apps/v1
      kind: Deployment
      name: kagent-ui
      namespace: kagent
