---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m  # No dependencies, operator startup
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/cnpg-operator
  prune: true
  wait: true
  # No dependsOn - starts immediately (foundation operator)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cnpg-operator-cloudnative-pg
      namespace: cnpg-system
