apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All Services - Organized by Dependencies
# Services are deployed in dependency order for proper startup sequence

resources:
  # Foundation services (no dependencies - start immediately)
  - cilium.yaml
  - traefik.yaml
  - localstack.yaml
  - cnpg-operator.yaml
  - scylla-operator.yaml  # ScyllaDB operator for managing clusters
  - external-secrets-operator.yaml
  - external-secrets-config.yaml  # ClusterSecretStore (secrets auto-created by LocalStack init hooks)
  - traefik-config.yaml  # Traefik middleware and configuration
  - metrics-server.yaml
  - kube-prometheus-stack.yaml
  - weave-gitops.yaml
  - grafana-sa-setup.yaml  # One-time Job: creates Grafana SA token, stores in LocalStack for kagent

  # Node maintenance (no dependencies - runs on schedule)
  - node-image-gc.yaml  # Prunes unused container images every 6 hours

  # Event-driven autoscaling
  - keda.yaml

  # Infrastructure as Code services (disabled)
  # - crossplane.yaml
  # - crossplane-providers.yaml
  # - crossplane-config.yaml

  # Logging stack services
  - loki.yaml
  - promtail.yaml

  # Distributed tracing services
  - jaeger.yaml
  - opentelemetry-collector.yaml

  # Grafana Operator (for declarative dashboard management)
  - grafana-operator.yaml
  - grafana-config.yaml
  - grafana-dashboards.yaml

  # Database management services (depend on operators)
  # - scylla-manager.yaml  # ScyllaDB backup/repair automation (disabled for dev - high resource requirements)

  # Database services (depend on operators)
  - postgresql-cluster.yaml
  - redis-sentinel.yaml
  - scylla-cluster.yaml  # ScyllaDB with Alternator (DynamoDB API) for chat history

  # Application services (depend on databases)
  - n8n.yaml
  - temporal.yaml

  # AI agent platform
  - ollama.yaml    # Local LLM inference (foundation, no dependencies)
  - code-tools.yaml   # FastMCP server: Python execution + HTTP + mem0 memory (depends on ollama)
  - kagent.yaml    # Kubernetes-native AI agent platform (depends on ollama, cnpg-operator, external-secrets-config, traefik)
  - gateway-api-crds.yaml  # Kubernetes Gateway API CRDs (prerequisite for agentgateway)
  - agentgateway.yaml      # A2A routing + MCP federation HelmRelease install (depends on gateway-api-crds, kagent, traefik)
  - agentgateway-config.yaml  # AgentgatewayParameters, Gateway, Backends, Routes (depends on agentgateway)

  # Security and cost observability (depend on kube-prometheus-stack)
  - kubescape.yaml    # Kubernetes security scanning — feeds security-agent
  - opencost.yaml     # Kubernetes cost monitoring — feeds finops-agent via built-in MCP

  # Database UI services (fine-grained dependencies)
  - pgadmin4.yaml
  - redisinsight.yaml

configMapGenerator:
  - name: cluster-vars
    envs:
      - environment.env
    options:
      disableNameSuffixHash: true
    namespace: flux-system
