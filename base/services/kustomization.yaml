apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All Services - Organized by Dependencies
# Services are deployed in dependency order for proper startup sequence

resources:
  # Foundation services (no dependencies - start immediately)
  - traefik.yaml
  - localstack.yaml
  - cnpg-operator.yaml
  - scylla-operator.yaml  # ScyllaDB operator for managing clusters
  - external-secrets-operator.yaml
  - external-secrets-config.yaml  # ClusterSecretStore (secrets auto-created by LocalStack init hooks)
  - traefik-config.yaml  # Traefik middleware and configuration
  - metrics-server.yaml
  - kube-prometheus-stack.yaml
  - weave-gitops.yaml

  # Infrastructure as Code services (disabled)
  # - crossplane.yaml
  # - crossplane-providers.yaml
  # - crossplane-config.yaml

  # Logging stack services
  - loki.yaml
  - promtail.yaml

  # Distributed tracing services
  - jaeger.yaml
  - opentelemetry-collector.yaml

  # Grafana Operator (for declarative dashboard management)
  - grafana-operator.yaml

  # Database management services (depend on operators)
  # - scylla-manager.yaml  # ScyllaDB backup/repair automation (disabled for dev - high resource requirements)

  # Database services (depend on operators)
  - postgresql-cluster.yaml
  - redis-sentinel.yaml
  - scylla-cluster.yaml  # ScyllaDB with Alternator (DynamoDB API) for chat history

  # Application services (depend on databases)
  - n8n.yaml
  - temporal.yaml

  # Database UI services (fine-grained dependencies)
  - pgadmin4.yaml
  - redisinsight.yaml

configMapGenerator:
  - name: cluster-vars
    envs:
      - environment.env
    options:
      disableNameSuffixHash: true
    namespace: flux-system
