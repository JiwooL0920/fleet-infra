---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m  # Redis starts quickly after secrets are available
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/redis
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets-operator  # Needs External Secrets for authentication
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: redis
      namespace: redis
    - apiVersion: v1
      kind: Secret
      name: redis-secret
      namespace: redis