---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-operator
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m  # Quick operator startup after LocalStack
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/external-secrets-operator
  prune: true
  wait: true
  dependsOn:
    - name: localstack  # Needs LocalStack for secret store
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets
      namespace: external-secrets-system