---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-operator
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m  # Quick operator startup after LocalStack
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/external-secrets-operator
  prune: true
  wait: true
  dependsOn:
    - name: localstack  # Needs LocalStack for secret store
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: secrets-manager
      namespace: flux-system