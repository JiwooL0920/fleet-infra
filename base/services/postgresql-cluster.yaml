---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m  # Database cluster initialization can take 10-15 minutes (DB creation, init scripts, replica sync)
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/cloudnative-pg
  prune: true
  wait: true
  dependsOn:
    - name: cnpg-operator  # CNPG controller must be running to manage the Cluster CR
    - name: external-secrets-config  # ExternalSecret cnpg-backup-s3 needs localstack-secretstore ClusterSecretStore
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgresql-cluster
      namespace: cnpg-system
    - apiVersion: v1
      kind: Secret
      name: postgresql-cluster-app
      namespace: cnpg-system
