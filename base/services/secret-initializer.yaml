---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-initializer
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m  # Allow time for secret initialization
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/infrastructure
  prune: true
  wait: true
  dependsOn:
    - name: localstack  # Wait for LocalStack to be ready before initializing secrets
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: secret-initializer
      namespace: default