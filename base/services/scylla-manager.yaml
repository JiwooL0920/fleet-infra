---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scylla-manager
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m  # Manager includes internal Scylla cluster
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/scylla-manager
  prune: true
  wait: true
  dependsOn:
    - name: scylla-operator  # Needs operator for ScyllaCluster CRD
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: scylla-manager
      namespace: scylla-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: scylla-manager-controller
      namespace: scylla-manager
