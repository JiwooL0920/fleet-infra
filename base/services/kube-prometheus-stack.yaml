---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m  # Prometheus stack deployment time
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/kube-prometheus-stack
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets-config  # Needs ClusterSecretStore for Grafana admin credentials
    - name: postgresql-cluster       # Grafana DB backend + grafana-db-credentials ExternalSecret depends on cnpg/postgresql-cluster-app/password (pushed by push-cnpg-app-secret)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-operator
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: monitoring-kube-prometheus-stack-grafana  # fullname is release-prefixed; wrong name here silently no-ops so a crashed Grafana never blocks reconcile
      namespace: monitoring
