---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m  # Prometheus stack deployment time
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/kube-prometheus-stack
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets-config  # Needs ClusterSecretStore for Grafana admin credentials
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-operator
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: monitoring
