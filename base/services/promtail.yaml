---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: promtail
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/promtail
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: loki  # Must have Loki running to ship logs to
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: promtail
      namespace: monitoring
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars