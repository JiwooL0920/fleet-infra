---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-config
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/traefik-config
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: traefik  # Traefik must be running first
    - name: external-secrets-config  # Needs ClusterSecretStore for Basic Auth credentials
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
