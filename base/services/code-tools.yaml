---
# code-tools: FastMCP server providing code execution, HTTP, and memory tools to kagent agents.
# Connects to Ollama via OLLAMA_HOST (host.docker.internal for native Ollama).
# No in-cluster dependency needed — ollama kustomization is suspended (native mode).
# Reference: apps/base/code-tools/
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: code-tools
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/code-tools
  prune: true
  wait: true
  timeout: 15m0s
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
