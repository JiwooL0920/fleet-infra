---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scylla-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m  # ScyllaDB cluster initialization can take time
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/scylla
  prune: true
  wait: true
  dependsOn:
    - name: scylla-operator   # Needs operator for ScyllaCluster CRD
    - name: scylla-manager    # Manager should be ready for backup/repair
    - name: traefik-config    # Needs IngressRoute CRD and middleware
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: v1
      kind: Service
      name: scylla-client
      namespace: scylla
