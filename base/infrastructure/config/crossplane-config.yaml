---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-config
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/crossplane/crossplane-config
  prune: true
  wait: true
  timeout: 5m0s
  # Depends on crossplane provider being ready and external secrets operator
  dependsOn:
    - name: infrastructure-operators
    - name: external-secrets-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
        optional: false