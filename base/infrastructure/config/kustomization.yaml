apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Infrastructure Configuration - Wave 3 (Depends on Operators)
# Configuration resources that depend on operators being ready
resources:
  # External secrets configuration (depends on external-secrets-operator)
  - external-secrets-config.yaml
  
  # Crossplane providers (depends on crossplane core being ready)
  - crossplane-providers.yaml
  
  # Crossplane configuration (depends on crossplane providers and external-secrets)
  - crossplane-config.yaml
  
  # Traefik configuration (depends on traefik helm release)
  - traefik-config.yaml