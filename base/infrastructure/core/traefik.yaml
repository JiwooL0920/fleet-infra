---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/traefik
  prune: true
  wait: true
  timeout: 5m0s
  # Traefik needs LocalStack for future authentication secrets
  dependsOn:
    - name: localstack
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
