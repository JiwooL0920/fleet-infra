apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Infrastructure Core - Wave 1 (Foundation)
# These must be healthy before anything else can deploy
resources:
  # Core networking and ingress
  - traefik.yaml
  
  # Local AWS services for development/testing
  - localstack.yaml
  
  # Initialize infrastructure secrets early (replaces manual scripts)
  - ../../../apps/base/infrastructure/secret-init-job.yaml