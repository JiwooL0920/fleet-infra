---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: promtail
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/promtail
  prune: true
  wait: true
  timeout: 15m0s
  # Promtail depends on Loki to be ready to receive logs
  dependsOn:
    - name: loki
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars