---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m  # Complex workflow system with database dependency
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/base/temporal
  prune: true
  wait: true
  dependsOn:
    - name: postgresql-cluster  # Needs PostgreSQL databases ready
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgresql-cluster
      namespace: cnpg-system
    - apiVersion: apps/v1
      kind: Deployment
      name: temporal-frontend
      namespace: temporal