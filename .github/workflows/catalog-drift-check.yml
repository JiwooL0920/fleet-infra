name: catalog-drift-check

on:
  push:
    paths:
      - 'apps/base/**'
      - 'base/services/**'
      - 'clusters/stages/**/environment.env'
      - 'service-catalog.json'
      - 'service-insights/**'
      - 'scripts/docgen/**'
  pull_request:
    paths:
      - 'apps/base/**'
      - 'base/services/**'
      - 'clusters/stages/**/environment.env'
      - 'service-catalog.json'
      - 'service-insights/**'
      - 'scripts/docgen/**'

jobs:
  catalog-drift:
    name: Catalog freshness + insight schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docgen deps
        run: pip install -r scripts/docgen/requirements.txt

      - name: Regenerate service-catalog.json
        run: python3 scripts/docgen/catalog.py

      - name: Check for catalog drift
        run: |
          if ! git diff --exit-code service-catalog.json; then
            echo ""
            echo "ERROR: service-catalog.json is stale."
            echo "Run 'make catalog' and commit the updated service-catalog.json."
            exit 1
          fi

      - name: Validate insight YAML files
        run: |
          if ls service-insights/*.yaml 2>/dev/null | grep -q .; then
            python3 scripts/docgen/insight_schema.py
          else
            echo "No insight files to validate."
          fi

      - name: Render all pages (smoke test)
        run: python3 scripts/docgen/render.py --output-dir /tmp/docs-output

      - name: Validate rendered pages
        run: python3 scripts/docgen/validate.py --docs-dir /tmp/docs-output
